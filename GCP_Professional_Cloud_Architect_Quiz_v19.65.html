<script>
const QUESTIONS = [{"id":1,"topic":"Mountkirk Games Case Study","question":"For this question, refer to the Mountkirk Games case study. Mountkirk Games wants you to design their new testing strategy. How should the test coverage differ from their existing backends on the other platforms?","options":{"A":"Tests should scale well beyond the prior approaches.","B":"Unit tests are no longer required, only end-to-end tests.","C":"Tests should be applied after the release is in the production environment.","D":"Tests should include directly testing the Google Cloud Platform (GCP) infrastructure."},"answer":["A"],"explanation":"Explanation: From Scenario: A few of their games were more popular than expected, and they had problems scaling their application servers, MySQL databases, and analytics tools. Requirements for Game Analytics Platform include: Dynamically scale up or down based on game activity"},{"id":2,"topic":"Mountkirk Games Case Study 1","question":"For this question, refer to the Mountkirk Games case study. Mountkirk Games has deployed their new backend on Google Cloud Platform (GCP). You want to create a thorough testing process for new versions of the backend before they are released to the public. You want the testing environment to scale in an economical way. How should you design the process?","options":{"A":"Create a scalable environment in GCP for simulating production load.","B":"Use the existing infrastructure to test the GCP-based backend at scale.","C":"Build stress tests into each component of your application using resources internal to GCP to simulate load.","D":"Create a set of static environments in GCP to test different levels of load - for example, high, medium, and low."},"answer":["A"],"explanation":"Explanation: From scenario: Requirements for Game Backend Platform * Dynamically scale up or down based on game activity * Connect to a managed NoSQL database service * Run customize Linux distro"},{"id":3,"topic":"Mountkirk Games Case Study 1","question":"For this question, refer to the Mountkirk Games case study. Mountkirk Games ' gaming servers are not automatically scaling properly. Last month, they rolled out a new feature, which suddenly became very popular. A record number of users are trying to use the service, but many of them are getting 503 errors and very slow response times. What should they investigate first?","options":{"A":"Verify that the database is online.","B":"Verify that the project quota hasn ' t been exceeded.","C":"Verify that the new feature code did not introduce any performance bugs.","D":"Verify that the load-testing team is not running their tool against production."},"answer":["B"],"explanation":"Explanation: 503 is service unavailable error. If the database was online everyone would get the 503 error. https://cloud.google.com/docs/quota#capping_usage"},{"id":4,"topic":"Mountkirk Games Case Study 1","question":"For this question, refer to the Mountkirk Games case study. Mountkirk Games wants to set up a real-time analytics platform for their new game. The new 3 platform must meet their technical requirements. Which combination of Google technologies will meet all of their requirements?","options":{"A":"Container Engine, Cloud Pub/Sub, and Cloud SQL","B":"Cloud Dataflow, Cloud Storage, Cloud Pub/Sub, and BigQuery","C":"Cloud SQL, Cloud Storage, Cloud Pub/Sub, and Cloud Dataflow","D":"Cloud Dataproc, Cloud Pub/Sub, Cloud SQL, and Cloud Dataflow","E":"Cloud Pub/Sub, Compute Engine, Cloud Storage, and Cloud Dataproc"},"answer":["B"],"explanation":"Explanation: A real time requires Stream / Messaging so Pub/Sub, Analytics by Big Query . Ingest millions of streaming events per second from anywhere in the world with Cloud Pub/Sub, powered by Google ' s unique, high-speed private network. Process the streams with Cloud Dataflow to ensure reliable, exactly-once, low-latency data transformation. Stream the transformed data into BigQuery, the cloud-native data warehousing service, for immediate analysis via SQL or popular visualization tools. From scenario: They plan to deploy the game's backend on Google Compute Engine so they can capture streaming metrics, run intensive analytics. Requirements for Game Analytics Platform * Dynamically scale up or down based on game activity * Process incoming data on the fly directly from the game servers * Process data that arrives late because of slow mobile networks * Allow SQL queries to access at least 10 TB of historical data * Process files that are regularly uploaded by users' mobile devices * Use only fully managed services References: https://cloud.google.com/solutions/big-data/stream-analytics/"},{"id":5,"topic":"Mountkirk Games Case Study 1","question":"For this question, refer to the Mountkirk Games case study. Mountkirk Games wants to set up a continuous delivery pipeline. Their architecture includes many small services that they want to be able to update and roll back quickly. Mountkirk Games has the following requirements: * Services are deployed redundantly across multiple regions in the US and Europe. * Only frontend services are exposed on the public internet. * They can provide a single frontend IP for their fleet of services. * Deployment artifacts are immutable. Which set of products should they use?","options":{"A":"Google Cloud Storage, Google Cloud Dataflow, Google Compute Engine","B":"Google Cloud Storage, Google App Engine, Google Network Load Balancer","C":"Google Kubernetes Registry, Google Container Engine, Google HTTP(S) Load Balancer","D":"Google Cloud Functions, Google Cloud Pub/Sub, Google Cloud Deployment Manager"},"answer":["C"],"explanation":""},{"id":6,"topic":"Mountkirk Games Case Study 1","question":"For this question, refer to the Mountkirk Games case study Mountkirk Games needs to create a repeatable and configurable mechanism for deploying isolated application environments. Developers and testers can access each other ' s environments and resources, but they cannot access staging or production resources. The staging environment needs 4 access to some services from production. What should you do to isolate development environments from staging and production?","options":{"A":"Create a project for development and test and another for staging and production.","B":"Create a network for development and test and another for staging and production.","C":"Create one subnetwork for development and another for staging and production.","D":"Create one project for development, a second for staging and a third for production."},"answer":["D"],"explanation":""},{"id":7,"topic":"TerramEarth Case Study","question":"Your agricultural division is experimenting with fully autonomous vehicles. You want your architecture to promote strong security during vehicle operation. Which two architecture should you consider? Choose 2 answers:","options":{"A":"Treat every micro service call between modules on the vehicle as untrusted.","B":"Require IPv6 for connectivity to ensure a secure address space.","C":"Use a trusted platform module (TPM) and verify firmware and binaries on boot.","D":"Use a functional programming language to isolate code execution cycles.","E":"Use multiple connectivity subsystems for redundancy.","F":"Enclose the vehicle ' s drive electronics in a Faraday cage to isolate chips."},"answer":["A","C"],"explanation":""},{"id":8,"topic":"TerramEarth Case Study","question":"For this question refer to the TerramEarth case study Operational parameters such as oil pressure are adjustable on each of TerramEarth ' s vehicles to increase their efficiency, depending on their environmental conditions. Your primary goal is to increase the operating efficiency of all 20 million cellular and unconnected vehicles in the field How can you accomplish this goal?","options":{"A":"Have your engineers inspect the data for patterns, and then create an algorithm with rules that make operational adjustments automatically.","B":"Capture all operating data, train machine learning models that identify ideal operations, and run locally to make operational adjustments automatically.","C":"Implement a Google Cloud Dataflow streaming job with a sliding window, and use Google Cloud Messaging (GCM) to make operational adjustments automatically.","D":"Capture all operating data, train machine learning models that identify ideal operations, and host in Google Cloud Machine Learning (ML) Platform to make operational adjustments automatically."},"answer":["B"],"explanation":""},{"id":9,"topic":"TerramEarth Case Study","question":"For this question, refer to the TerramEarth case study. To speed up data retrieval, more vehicles will be upgraded to cellular connections and be able to transmit data to the ETL process. The current FTP process is error-prone and restarts the data transfer from the start of the file when connections fail, which happens often. You want to improve the reliability of the solution and minimize data transfer time on the cellular connections. What should you do?","options":{"A":"Use one Google Container Engine cluster of FTP servers. Save the data to a Multi-Regional bucket. Run the ETL process using data in the bucket.","B":"Use multiple Google Container Engine clusters running FTP servers located in different regions. Save the data to Multi-Regional buckets in us, eu, and asia. Run the ETL process using the data in the bucket.","C":"Directly transfer the files to different Google Cloud Multi-Regional Storage bucket locations in us, eu, and asia using Google APIs over HTTP(S). Run the ETL process using the data in the bucket.","D":"Directly transfer the files to a different Google Cloud Regional Storage bucket location in us, eu, and asia using Google APIs over HTTP(S). Run the ETL process to retrieve the data from each Regional bucket."},"answer":["D"],"explanation":"Explanation: http s://cloud.goo gle.com/storage/docs/locations"},{"id":10,"topic":"TerramEarth Case Study","question":"For this question, refer to the TerramEarth case study You analyzed TerramEarth ' s business requirement to reduce downtime, and found that they can achieve a majority of time saving by reducing customers ' wait time for parts You decided to focus on reduction of the 3 weeks aggregate reporting time Which modifications to the company ' s processes should you recommend?","options":{"A":"Migrate from CSV to binary format, migrate from FTP to SFTP transport, and develop machine learning analysis of metrics.","B":"Migrate from FTP to streaming transport, migrate from CSV to binary format, and develop machine learning analysis of metrics.","C":"Increase fleet cellular connectivity to 80%, migrate from FTP to streaming transport, and develop machine learning analysis of metrics.","D":"Migrate from FTP to SFTP transport, develop machine learning analysis of metrics, and increase dealer local inventory by a fixed factor."},"answer":["C"],"explanation":"Explanation: The Avro binary format is the preferred format for loading compressed data. Avro data is faster to load because the data can be read in parallel, even when the data blocks are compressed. Cloud Storage supports streaming transfers with the gsutil tool or boto library, based on HTTP chunked transfer encoding. Streaming data lets you stream data to and from your Cloud Storage account as soon as it becomes available without requiring that the data be first saved to a separate file. Streaming transfers are useful if you have a process that generates data and you do not want to buffer it locally before uploading it, or if you want to send the result from a computational pipeline directly into Cloud Storage. References: https://cloud.google.com/storage/docs/streaming https://cloud.google.com/bigquery/docs/loading-data"},{"id":11,"topic":"TerramEarth Case Study","question":"For this question, refer to the TerramEarth case study. TerramEarth has equipped unconnected trucks with servers and sensors to collet telemetry data. Next year they want to use the data to train machine learning models. They want to store this data in the cloud while reducing costs. What should they do?","options":{"A":"Have the vehicle' computer compress the data in hourly snapshots, and store it in a Google Cloud storage (GCS) Nearline bucket.","B":"Push the telemetry data in Real-time to a streaming dataflow job that compresses the data, and store it in Google BigQuery.","C":"Push the telemetry data in real-time to a streaming dataflow job that compresses the data, and store it in Cloud Bigtable.","D":"Have the vehicle ' s computer compress the data in hourly snapshots, a Store it in a GCS Coldline bucket."},"answer":["D"],"explanation":"Explanation: Coldline Storage is the best choice for data that you plan to access at most once a year, due to its slightly lower availability, 90-day minimum storage duration, costs for data access, and higher per- operation costs. For example: Cold Data Storage - Infrequently accessed data, such as data stored for legal or regulatory reasons, can be stored at low cost as Coldline Storage, and be available when you need it. Disaster recovery - In the event of a disaster recovery event, recovery time is key. Cloud Storage provides low latency access to data stored as Coldline Storage. References: https://cloud.google.com/storage/docs/storage-classes"},{"id":12,"topic":"TerramEarth Case Study","question":"For this question, refer to the TerramEarth case study. TerramEarth ' s 20 million vehicles are scattered around the world. Based on the vehicle ' s location its telemetry data is stored in a Google Cloud Storage (GCS) regional bucket (US. Europe, or Asia). The CTO has asked you to run a report on the raw telemetry data to determine why vehicles are breaking down after 100 K miles. You want to run this job on all the data. What is the most cost-effective way to run this job?","options":{"A":"Move all the data into 1 zone, then launch a Cloud Dataproc cluster to run the job.","B":"Move all the data into 1 region, then launch a Google Cloud Dataproc cluster to run the job.","C":"Launch a cluster in each region to preprocess and compress the raw data, then move the data into a multi region bucket and use a Dataproc cluster to finish the job.","D":"Launch a cluster in each region to preprocess and compress the raw data, then move the data into a region bucket and use a Cloud Dataproc cluster to finish the jo"},"answer":["D"],"explanation":"Explanation: Storageguarantees 2 replicates which are geo diverse (100 miles apart) which can get better remote latency and availability. More importantly, is that multiregional heavily leverages Edge caching and CDNs to provide the content to the end users. All this redundancy and caching means that Multiregional comes with overhead to sync and ensure consistency between geo-diverse areas. As such, it's much better for write-once-read-many scenarios. This means frequently accessed (e.g. \"hot\" objects) around the world, such as website content, streaming videos, gaming or mobile applications. References: https://medium.com/google-cloud/google-cloud-storage-what-bucket-class-for- the -best- performance-5c847ac8f9f2"},{"id":13,"topic":"TerramEarth Case Study","question":"For this question refer to the TerramEarth case study. Which of TerramEarth ' s legacy enterprise processes will experience significant change as a result of increased Google Cloud Platform adoption.","options":{"A":"Opex/capex allocation, LAN changes, capacity planning","B":"Capacity planning, TCO calculations, opex/capex allocation","C":"Capacity planning, utilization measurement, data center expansion","D":"Data Center expansion, TCO calculations, utilization measurement"},"answer":["B"],"explanation":"Explanation: Capacity planning, TCO calculations, opex/capex allocation From the case study, it can conclude that Management (CXO) all concern rapid provision of resources (infrastructure) for growing as well as cost management, such as Cost optimization in Infrastructure, trade up front capital expenditures (Capex) for ongoing operating expenditures (Opex), and Total cost of ownership (TCO)"},{"id":14,"topic":"TerramEarth Case Study","question":"For this question, refer to the TerramEarth case study Your development team has created a structured API to retrieve vehicle data. They want to allow third parties to develop tools for dealerships that use this vehicle event data. You want to support delegated authorization against this data. What should you do?","options":{"A":"Build or leverage an OAuth-compatible access control system.","B":"Build SAML 2.0 SSO compatibility into your authentication system.","C":"Restrict data access based on the source IP address of the partner systems.","D":"Create secondary credentials for each dealer that can be given to the trusted third party."},"answer":["A"],"explanation":"Explanation: https://cloud.google.com/appengine/docs/flexible/go/authorizi ng-apps https://cloud.googl e.com/docs/enterprise/best-practices-for-enterprise- organizations#delegate_appli cation_authorization_with_o auth2 Delegate application authorization with OAuth2 Cloud Platform APIs support OAuth 2.0, and scopes provide granular authorization over the methods that are supported. Cloud Platform supports both service-account and user-account OAuth, also called three-legged OAuth. References: https://cloud.google.com/docs/enterprise/best-practices-for-enterprise- organizations#delegate_application_aut horization_with_oauth2 https://cloud.google.com/appengine/docs/flexible/go/authorizing-apps"},{"id":15,"topic":"TerramEarth Case Study","question":"For this question, refer to the TerramEarth case study. TerramEarth ' s CTO wants to use the raw data from connected vehicles to help identify approximately when a vehicle in the development team to focus their failure. You want to allow analysts to centrally query the vehicle data. Which architecture should you recommend?","options":{"A":"Option A","B":"Option B","C":"Option C","D":"Option D"},"answer":["A"],"explanation":" Explanation: https://cloud.google.com/solutions/iot/ https://cloud.google.com/solutions/designing-conne cted-vehicle-platform https://cloud.google.com/solutions/designing-connected-vehicle- platform#data_ingestion http://www.eweek.com/big-data-and-analytics/google-touts-value-of-cloud-iot-core-for-analyzing- conne cted-car-data https://cloud.goog le.com/solutions/iot/ The push endpoint can be a load balancer. A container cluster can be used. Cloud Pub/Sub for Stream Analytics References: https://cloud.google.com/pubsub/ https://cloud.google.com/solutions/iot/ https://cloud.google.com/solutions/designing-connected-vehicle-platform https://cloud.google.com/solutions/designing-connected-vehicle-platfo rm#data_ingestion http://www.eweek.com/big-data-and-analytics/google-touts-value-of-cloud-iot-core-for-analyzing- connected-car-data https://cloud.google.com/solutions/iot/"},{"id":16,"topic":"TerramEarth Case Study","question":"For this question, refer to the TerramEarth case study. The TerramEarth development team wants to create an API to meet the company ' s business requirements. You want the development team to focus their development effort on business value versus creating a custom framework. Which method should they use?","options":{"A":"Use Google App Engine with Google Cloud Endpoints. Focus on an API for dealers and partners.","B":"Use Google App Engine with a JAX-RS Jersey Java-based framework. Focus on an API for the public.","C":"Use Google App Engine with the Swagger (open API Specification) framework. Focus on an API for the public.","D":"Use Google Container Engine with a Django Python container. Focus on an API for the public.","E":"Use Google Container Engine with a Tomcat container with the Swagger (Open API Specification) framework. Focus on an API for dealers and partners."},"answer":["A"],"explanation":" Explanation: https://cloud.google.com/endpoints/docs/openapi/about-cloud-endpoints?hl=en_US & _ga=2.21 787131. -1712523161.1522785064 https:/ /cloud.google.com/endpoints/docs/openapi/architecture-overview https://cloud.google.com/storage/docs/gsutil/commands/test Develop, deploy, protect and monitor your APIs with Google Cloud Endpoints. Using an Open API Specification or one of our API frameworks, Cloud Endpoints gives you the tools you need for every phase of API development. From scenario: Business Requirements Decrease unplanned vehicle downtime to less than 1 week, without increasing the cost of carrying surplus inventory Support the dealer network with more data on how their customers use their equipment to better position new products and services Have the ability to partner with different companies - especially with seed and fertilizer suppliers in the fast- growing agricultural business - to create compelling joint offerings for their customers. Reference: https://cloud.google.com/certification/guides/cloud-architect/casestudy-terramearth"},{"id":17,"topic":"TerramEarth Case Study","question":"For this question, refer to the TerramEarth case study. TerramEarth plans to connect all 20 million vehicles in the field to the cloud. This increases the volume to 20 million 600 byte records a second for 40 TB an hour. How should you design the data ingestion?","options":{"A":"Vehicles write data directly to GCS.","B":"Vehicles write data directly to Google Cloud Pub/Sub.","C":"Vehicles stream data directly to Google BigQuery.","D":"Vehicles continue to write data using the existing system (FTP)."},"answer":["B"],"explanation":"Explanation: https://cloud.google.com/solutions/data-lifecycle-cloud-platform https://cloud.google.com/solutions/designing-connected-vehicle-platform"},{"id":18,"topic":"JencoMart Case Study","question":"For this question, refer to the JencoMart case study A few days after JencoMart migrates the user credentials database to Google Cloud Platform and shuts down the old server, the new database server stops responding to SSH connections. It is still serving database requests to the application servers correctly. What three steps should you take to diagnose the problem? Choose 3 answers","options":{"A":"Delete the virtual machine (VM) and disks and create a new one.","B":"Delete the instance, attach the disk to a new VM, and investigate.","C":"Take a snapshot of the disk and connect to a new machine to investigate.","D":"Check inbound firewall rules for the network the machine is connected to.","E":"Connect the machine to another network with very simple firewall rules and investigate.","F":"Print the Serial Console output for the instance for troubleshooting, activate the interactive console, and investigate."},"answer":["C","D","F"],"explanation":"Explanation: https://cloud.google.com/compute/docs/troubleshooting/troubleshooting-ssh D: Handling \" Unable to connect on port 22 \" error message Possible causes include: There is no firewall rule allowing SSH access on the port. SSH access on port 22 is enabled on all Compute Engine instances by default. If you have disabled access, SSH from the Browser will not work. If you run sshd on a port other than 22, you need to enable the access to that port with a custom firewall rule. The firewall rule allowing SSH access is enabled, but is not configured to allow connections from GCP Console services. Source IP addresses for browser-based SSH sessions are dynamically allocated by GCP Console and can vary from session to session. References: https://cloud.google.com/compute/docs/ssh-in-browser https://cloud.google.com/compute/docs/ssh-in-browser"},{"id":19,"topic":"JencoMart Case Study","question":"For this question, refer to the JencoMart case study. 17 The JencoMart security team requires that all Google Cloud Platform infrastructure is deployed using a least privilege model with separation of duties for administration between production and development resources. What Google domain and project structure should you recommend?","options":{"A":"Create two G Suite accounts to manage users: one for development/test/staging and one for production. Each account should contain one project for every application.","B":"Create two G Suite accounts to manage users: one with a single project for all development applications and one with a single project for all production applications.","C":"Create a single G Suite account to manage users with each stage of each application in its own project.","D":"Create a single G Suite account to manage users with one project for the development/test/staging environment and one project for the production environment."},"answer":["D"],"explanation":"Explanation: Note: The principle of least privilege and separation of duties are concepts that, although semantically different, are intrinsically related from the standpoint of security. The intent behind both is to prevent people from having higher privilege levels than they actually need * Principle of Least Privilege: Users should only have the least amount of privileges required to perform their job and no more. This reduces authorization exploitation by limiting access to resources such as targets, jobs, or monitoring templates for which they are not authorized. * Separation of Duties: Beyond limiting user privilege level, you also limit user duties, or the specific jobs they can perform. No user should be given responsibility for more than one related function. This limits the ability of a user to perform a malicious action and then cover up that action. References: https://cloud.g oogle.com/km s/docs/separation-of-duties"},{"id":20,"topic":"JencoMart Case Study","question":"For this question, refer to the JencoMart case study. JencoMart has decided to migrate user profile storage to Google Cloud Datastore and the application servers to Google Compute Engine (GCE). During the migration, the existing infrastructure will need access to Datastore to upload the data. What service account key-management strategy should you recommend?","options":{"A":"Provision service account keys for the on-premises infrastructure and for the GCE virtual machines (VMs).","B":"Authenticate the on-premises infrastructure with a user account and provision service account keys for the VMs.","C":"Provision service account keys for the on-premises infrastructure and use Google Cloud Platform (GCP) managed keys for the VMs","D":"Deploy a custom authentication service on GCE/Google Container Engine (GKE) for the on- premises infrastructure and use GCP managed keys for the VMs."},"answer":["A"],"explanation":"Explanation: https://cloud.google.com/iam/docs/understanding-service-accounts Migrating data to Google Cloud Platform Let's say that you have some data processing that happens on another cloud provider and you want to transfer the processed data to Google Cloud Platform. You can use a service account from the virtual machines on the external cloud to push the data to Google Cloud Platform. To do this, you must create and download a service account key when you create the service account and then use that key from the external process to call the Cloud Platform APIs. References: https://cloud.google.com/iam/docs/understanding-service- accounts#migrating_data_to_google_cloud_platform"},{"id":21,"topic":"JencoMart Case Study","question":"For this question, refer to the JencoMart case study. JencoMart wants to move their User Profiles database to Google Cloud Platform. Which Google Database should they use?","options":{"A":"Cloud Spanner","B":"Google BigQuery","C":"Google Cloud SQL","D":"Google Cloud Datastore"},"answer":["D"],"explanation":"Explanation: htt ps://cloud.google.co m/datastore/docs/concepts/overview Common workloads for Google Cloud Datastore: * User profiles * Product catalogs * Game state References: https://cloud.google.com/s torage-optio ns/ https://cloud.google.com/datastore/docs/concepts/overview"},{"id":22,"topic":"JencoMart Case Study","question":"For this question, refer to the JencoMart case study. The migration of JencoMart's application to Google Cloud Platform (GCP) is progressing too slowly. The infrastructure is shown in the diagram. You want to maximize throughput. What are three potential bottlenecks? (Choose 3 answers.)","options":{"A":"A single VPN tunnel, which limits throughput","B":"A tier of Google Cloud Storage that is not suited for this task","C":"A copy command that is not suited to operate over long distances","D":"Fewer virtual machines (VMs) in GCP than on-premises machines","E":"A separate storage layer outside the VMs, which is not suited for this task","F":"Complicated internet connectivity between the on-premises infrastructure and GCP"},"answer":["A","D","F"],"explanation":""},{"id":23,"topic":"JencoMart Case Study","question":"For this question, refer to the JencoMart case study. JencoMart has built a version of their application on Google Cloud Platform that serves traffic to Asia. You want to measure success against their business and technical goals. Which metrics should you track?","options":{"A":"Error rates for requests from Asia","B":"Latency difference between US and Asia","C":"Total visits, error rates, and latency from Asia","D":"Total visits and average latency for users in Asia","E":"The number of character sets present in the database"},"answer":["D"],"explanation":""},{"id":24,"topic":"Dress4Win case study","question":"For this question, refer to the Dress4Win case study. The Dress4Win security team has disabled external SSH access into production virtual machines (VMs) on Google Cloud Platform (GCP). The operations team needs to remotely manage the VMs, build and push Docker containers, and manage Google Cloud Storage objects. What can they do?","options":{"A":"Grant the operations engineers access to use Google Cloud Shell.","B":"Configure a VPN connection to GCP to allow SSH access to the cloud VMs.","C":"Develop a new access request process that grants temporary SSH access to cloud VMs when an operations engineer needs to perform a task.","D":"Have the development team build an API service that allows the operations team to execute specific remote procedure calls to accomplish their tasks."},"answer":["A"],"explanation":""},{"id":25,"topic":"Dress4Win case study","question":"For this question, refer to the Dress4Win case study. Dress4Win would like to become familiar with deploying applications to the cloud by successfully deploying some applications quickly, as is. They have asked for your recommendation. What should you advise?","options":{"A":"Identify self-contained applications with external dependencies as a first move to the cloud.","B":"Identify enterprise applications with internal dependencies and recommend these as a first move to the cloud.","C":"Suggest moving their in-house databases to the cloud and continue serving requests to on-premise applications.","D":"Recommend moving their message queuing servers to the cloud and continue handling requests to on- premise applications."},"answer":["A"],"explanation":"Explanation: https://cloud.google. com/blog/products/gcp/the-five-phases-of-migrating-to-google-cloud-platform"},{"id":26,"topic":"Dress4Win case study","question":"For this question, refer to the Dress4Win case study. Dress4Win has end-to-end tests covering 100% of their endpoints. They want to ensure that the move to the cloud does not introduce any new bugs. Which additional testing methods should the developers employ to prevent an outage?","options":{"A":"They should enable Google Stackdriver Debugger on the application code to show errors in the code.","B":"They should add additional unit tests and production scale load tests on their cloud staging environment.","C":"They should run the end-to-end tests in the cloud staging environment to determine if the code is working as intended.","D":"They should add canary tests so developers can measure how much of an impact the new release causes to latency."},"answer":["B"],"explanation":""},{"id":27,"topic":"Dress4Win case study","question":"The current Dress4win system architecture has high latency to some customers because it is located in one data center. As of a future evaluation and optimizing for performance in the cloud, Dresss4win wants to distribute it ' s system architecture to multiple locations when Google cloud platform. Which approach should they use?","options":{"A":"Use regional managed instance groups and a global load balancer to increase performance because the regional managed instance group can grow instances in each region separately based on traffic.","B":"Use a global load balancer with a set of virtual machines that forward the requests to a closer group of virtual machines managed by your operations team.","C":"Use regional managed instance groups and a global load balancer to increase reliability by providing automatic failover between zones in different regions.","D":"Use a global load balancer with a set of virtual machines that forward the requests to a closer group of virtual machines as part of a separate managed instance groups."},"answer":["A"],"explanation":""},{"id":28,"topic":"Dress4Win case study","question":"For this question, refer to the Dress4Win case study. Dress4Win has asked you for advice on how to migrate their on-premises MySQL deployment to the cloud. They want to minimize downtime and performance impact to their on-premises solution during the migration. Which approach should you recommend? 22","options":{"A":"Create a dump of the on-premises MySQL master server, and then shut it down, upload it to the cloud environment, and load into a new MySQL cluster.","B":"Setup a MySQL replica server/slave in the cloud environment, and configure it for asynchronous replication from the MySQL master server on-premises until cutover.","C":"Create a new MySQL cluster in the cloud, configure applications to begin writing to both on- premises and cloud MySQL masters, and destroy the original cluster at cutover.","D":"Create a dump of the MySQL replica server into the cloud environment, load it into: Google Cloud Datastore, and configure applications to read/write to Cloud Datastore at cutover."},"answer":["B"],"explanation":""},{"id":29,"topic":"Dress4Win case study","question":"For this question, refer to the Dress4Win case study. As part of Dress4Win ' s plans to migrate to the cloud, they want to be able to set up a managed logging and monitoring system so they can handle spikes in their traffic load. They want to ensure that: * The infrastructure can be notified when it needs to scale up and down to handle the ebb and flow of usage throughout the day * Their administrators are notified automatically when their application reports errors. * They can filter their aggregated logs down in order to debug one piece of the application across many hosts Which Google StackDriver features should they use?","options":{"A":"Logging, Alerts, Insights, Debug","B":"Monitoring, Trace, Debug, Logging","C":"Monitoring, Logging, Alerts, Error Reporting","D":"Monitoring, Logging, Debug, Error Report"},"answer":["D"],"explanation":""},{"id":30,"topic":"Dress4Win case study","question":"For this question, refer to the Dress4Win case study. You want to ensure Dress4Win ' s sales and tax records remain available for infrequent viewing by auditors for at least 10 years. Cost optimization is your top priority. Which cloud services should you choose?","options":{"A":"Google Cloud Storage Coldline to store the data, and gsutil to access the data.","B":"Google Cloud Storage Nearline to store the data, and gsutil to access the data.","C":"Google Bigtabte with US or EU as location to store the data, and gcloud to access the data.","D":"BigQuery to store the data, and a web server cluster in a managed instance group to access the data.Google Cloud SQL mirrored across two distinct regions to store the data, and a Redis cluster in a managed instance group to access the data."},"answer":["A"],"explanation":"References: https://cloud.google.com/storage/docs/storage-classes"},{"id":31,"topic":"Dress4Win case study","question":"For this question, refer to the Dress4Win case study. At Dress4Win, an operations engineer wants to create a tow-cost solution to remotely archive copies of database backup files. The database files are compressed tar files stored in their current data center. How should he proceed?","options":{"A":"Create a cron script using gsutil to copy the files to a Coldline Storage bucket.","B":"Create a cron script using gsutil to copy the files to a Regional Storage bucket.","C":"Create a Cloud Storage Transfer Service Job to copy the files to a Coldline Storage bucket.","D":"Create a Cloud Storage Transfer Service job to copy the files to a Regional Storage bucket."},"answer":["A"],"explanation":"Explanation: Follow these rules of thumb when deciding whether to use gsutil or Storage Transfer Service: * When transferring data from an on-premises location, use gsutil. * When transferring data from another cloud storage provider, use Storage Transfer Service. * Otherwise, evaluate both tools with respect to your specific scenario. Use this guidance as a starting point. The specific details of your transfer scenario will also help you determine which tool is more appropriate https://cloud.google.com/storage-transfer/docs/overview"},{"id":32,"topic":"Dress4Win case study","question":"For this question, refer to the Dress4Win case study. Dress4Win has configured a new uptime check with Google Stackdriver for several of their legacy services. The Stackdriver dashboard is not reporting the services as healthy. What should they do?","options":{"A":"Install the Stackdriver agent on all of the legacy web servers.","B":"In the Cloud Platform Console download the list of the uptime servers ' IP addresses and create an inbound firewall rule","C":"Configure their load balancer to pass through the User-Agent HTTP header when the value matches GoogleStackdriverMonitoring-UptimeChecks (https://cloud.google.com/monitoring)","D":"Configure their legacy web servers to allow requests that contain user-Agent HTTP header when the value matches GoogleStackdriverMonitoring- UptimeChecks (https://cloud.google.com/monitoring)"},"answer":["B"],"explanation":""},{"id":33,"topic":"Dress4Win case study","question":"For this question, refer to the Dress4Win case study. Dress4Win has asked you to recommend machine types they should deploy their application servers to. How should you proceed?","options":{"A":"Perform a mapping of the on-premises physical hardware cores and RAM to the nearest machine types in the cloud.","B":"Recommend that Dress4Win deploy application servers to machine types that offer the highest RAM to CPU ratio available.","C":"Recommend that Dress4Win deploy into production with the smallest instances available, monitor them over time, and scale the machine type up until the desired performance is reached.","D":"Identify the number of virtual cores and RAM associated with the application server virtual machines align them to a custom machine type in the cloud, monitor performance, and scale the machine types up until the desired performance is reached."},"answer":["C"],"explanation":""},{"id":34,"topic":"Dress4Win case study","question":"Dress4win has end to end tests covering 100% of their endpoints. They want to ensure that the move of cloud does not introduce any new bugs. Which additional testing methods should the developers employ to prevent an outage?","options":{"A":"They should run the end to end tests in the cloud staging environment to determine if the code is working as intended.","B":"They should enable google stack driver debugger on the application code to show errors in the code","C":"They should add additional unit tests and production scale load tests on their cloud staging environment.","D":"They should add canary tests so developers can measure how much of an impact the new release causes to latency"},"answer":["B"],"explanation":""},{"id":35,"topic":"Dress4Win case study","question":"For this question, refer to the Dress4Win case study. As part of their new application experience, Dress4Wm allows customers to upload images of themselves. The customer has exclusive control over who may view these images. Customers should be able to upload images with minimal latency and also be shown their images quickly on the main application page when they log in. Which configuration should Dress4Win use?","options":{"A":"Store image files in a Google Cloud Storage bucket. Use Google Cloud Datastore to maintain metadata that maps each customer ' s ID and their image files.","B":"Store image files in a Google Cloud Storage bucket. Add custom metadata to the uploaded images in Cloud Storage that contains the customer ' s unique ID.","C":"Use a distributed file system to store customers ' images. As storage needs increase, add more persistent disks and/or nodes. Assign each customer a unique ID, which sets each file ' s owner attribute, ensuring privacy of images.","D":"Use a distributed file system to store customers ' images. As storage needs increase, add more persistent disks and/or nodes. Use a Google Cloud SQL database to maintain metadata that maps each customer ' s ID to their image files."},"answer":["A"],"explanation":""},{"id":36,"topic":"Dress4Win Case 2","question":"For this question, refer to the Dress4Win case study. To be legally compliant during an audit, Dress4Win must be able to give insights in all administrative actions that modify the configuration or metadata of resources on Google Cloud. What should you do?","options":{"A":"Use Stackdriver Trace to create a trace list analysis.","B":"Use Stackdriver Monitoring to create a dashboard on the project's activity.","C":"Enable Cloud Identity-Aware Proxy in all projects, and add the group of Administrators as a member.","D":"Use the Activity page in the GCP Console and Stackdriver Logging to provide the required insight."},"answer":["A"],"explanation":"Explanation: https://cloud.google.com/logging/docs/audit/"},{"id":37,"topic":"Dress4Win Case 2","question":"For this question, refer to the Dress4Win case study. Which of the compute services should be migrated as -is and would still be an optimized architecture for performance in the cloud?","options":{"A":"Web applications deployed using App Engine standard environment","B":"RabbitMQ deployed using an unmanaged instance group","C":"Hadoop/Spark deployed using Cloud Dataproc Regional in High Availability mode","D":"Jenkins, monitoring, bastion hosts, security scanners services deployed on custom machine types"},"answer":["C"],"explanation":""},{"id":38,"topic":"Dress4Win Case 2","question":"For this question, refer to the Dress4Win case study. Considering the given business requirements, how would you automate the deployment of web and transactional data layers?","options":{"A":"Deploy Nginx and Tomcat using Cloud Deployment Manager to Compute Engine. Deploy a Cloud SQL server to replace MySQL. Deploy Jenkins using Cloud Deployment Manager.","B":"Deploy Nginx and Tomcat using Cloud Launcher. Deploy a MySQL server using Cloud Launcher. Deploy Jenkins to Compute Engine using Cloud Deployment Manager scripts.","C":"Migrate Nginx and Tomcat to App Engine. Deploy a Cloud Datastore server to replace the MySQL server in a high-availability configuration. Deploy Jenkins to Compute Engine using Cloud Launcher.","D":"Migrate Nginx and Tomcat to App Engine. Deploy a MySQL server using Cloud Launcher. Deploy Jenkins to Compute Engine using Cloud Launcher."},"answer":["A"],"explanation":""},{"id":39,"topic":"Dress4Win Case 2","question":"For this question, refer to the Dress4Win case study. You are responsible for the security of data stored in Cloud Storage for your company, Dress4Win. You have already created a set of Google Groups and assigned the appropriate users to those groups. You should use Google best practices and implement the simplest design to meet the requirements. Considering Dress4Win's business and technical requirements, what should you do?","options":{"A":"Assign custom IAM roles to the Google Groups you created in order to enforce security requirements. Encrypt data with a customer-supplied encryption key when storing files in Cloud Storage.","B":"Assign custom IAM roles to the Google Groups you created in order to enforce security requirements. Enable default storage encryption before storing files in Cloud Storage.","C":"Assign predefined IAM roles to the Google Groups you created in order to enforce security requirements. Utilize Google's default encryption at rest when storing files in Cloud Storage.","D":"Assign predefined IAM roles to the Google Groups you created in order to enforce security requirements. Ensure that the default Cloud KMS key is set before storing files in Cloud Storage."},"answer":["D"],"explanation":"Explanation: https://cloud .google.com/iam/docs/understanding-service-accounts"},{"id":40,"topic":"Dress4Win Case 2","question":"For this question, refer to the Dress4Win case study. You want to ensure that your on- premises architecture meets business requirements before you migrate your solution. What change in the on-premises architecture should you make?","options":{"A":"Replace RabbitMQ with Google Pub/Sub.","B":"Downgrade MySQL to v5.7, which is supported by Cloud SQL for MySQL.","C":"Resize compute resources to match predefined Compute Engine machine types.","D":"Containerize the micro services and host them in Google Kubernetes Engine."},"answer":["C"],"explanation":""},{"id":41,"topic":"Dress4Win Case 2","question":"For this question, refer to the Dress4Win case study. Dress4Win is expected to grow to 10 times its size in 1 year with a corresponding growth in data and traffic that mirrors the existing patterns of usage. The CIO has set the target of migrating production infrastructure to the cloud within the next 6 months. How will you configure the solution to scale for this growth without making major application changes and still maximize the ROI?","options":{"A":"Migrate the web application layer to App Engine, and MySQL to Cloud Datastore, and NAS to Cloud Storage. Deploy RabbitMQ, and deploy Hadoop servers using Deployment Manager.","B":"Migrate RabbitMQ to Cloud Pub/Sub, Hadoop to BigQuery, and NAS to Compute Engine with Persistent Disk storage. Deploy Tomcat, and deploy Nginx using Deployment Manager.","C":"Implement managed instance groups for Tomcat and Nginx. Migrate MySQL to Cloud SQL, RabbitMQ to Cloud Pub/Sub, Hadoop to Cloud Dataproc, and NAS to Compute Engine with Persistent Disk storage.","D":"Implement managed instance groups for the Tomcat and Nginx. Migrate MySQL to Cloud SQL, RabbitMQ to Cloud Pub/Sub, Hadoop to Cloud Dataproc, and NAS to Cloud Storage."},"answer":["D"],"explanation":""},{"id":42,"topic":"TerramEarth Case 2","question":"For this question, refer to the TerramEarth case study. To be compliant with European GDPR regulation, TerramEarth is required to delete data generated from its European customers after a period of 36 months when it contains personal data. In the new architecture, this data will be stored in both Cloud Storage and BigQuery. What should you do?","options":{"A":"Create a BigQuery table for the European data, and set the table retention period to 36 months. For Cloud Storage, use gsutil to enable lifecycle management using a DELETE action with an Age condition of 36 months.","B":"Create a BigQuery table for the European data, and set the table retention period to 36 months. For Cloud Storage, use gsutil to create a SetStorageClass to NONE action when with an Age condition of 36 months.","C":"Create a BigQuery time-partitioned table for the European data, and set the partition expiration period to 36 months. For Cloud Storage, use gsutil to enable lifecycle management using a DELETE action with an Age condition of 36 months.","D":"Create a BigQuery time-partitioned table for the European data, and set the partition period to 36 months. For Cloud Storage, use gsutil to create a SetStorageClass to NONE action with an Age condition of 36 months."},"answer":["C"],"explanation":"Explanation: https://cloud.google.com/bigquery/docs/managing-partitioned-tables#partition-expiration https://cloud.google.com/storage/docs/lifecycle "},{"id":43,"topic":"TerramEarth Case 2","question":"For this question, refer to the TerramEarth case study. You need to implement a reliable, scalable GCP solution for the data warehouse for your company, TerramEarth. Considering the TerramEarth business and technical requirements, what should you do?","options":{"A":"Replace the existing data warehouse with BigQuery. Use table partitioning.","B":"Replace the existing data warehouse with a Compute Engine instance with 96 CPUs.","C":"Replace the existing data warehouse with BigQuery. Use federated data sources.","D":"Replace the existing data warehouse with a Compute Engine instance with 96 CPUs. Add an additional Compute Engine pre-emptible instance with 32 CPUs."},"answer":["C"],"explanation":"Explanation: https://cloud.google.com/solutions/bigquery-data-warehouse#external_sources https://cloud .google.com/solutions/bigquery-data-warehouse"},{"id":44,"topic":"TerramEarth Case 2","question":"For this question, refer to the TerramEarth case study. You are asked to design a new architecture for the ingestion of the data of the 200,000 vehicles that are connected to a cellular network. You want to follow Google-recommended practices. Considering the technical requirements, which components should you use for the ingestion of the data?","options":{"A":"Google Kubernetes Engine with an SSL Ingress","B":"Cloud IoT Core with public/private key pairs","C":"Compute Engine with project-wide SSH keys","D":"Compute Engine with specific SSH keys"},"answer":["A"],"explanation":"Explanation: https://cloud.google.com/solutions/iot -overview https://cloud.google.com/iot/quotas"},{"id":45,"topic":"TerramEarth Case 2","question":"For this question, refer to the TerramEarth case study. TerramEarth has decided to store data files in Cloud Storage. You need to configure Cloud Storage lifecycle rule to store 1 year of data and minimize file storage cost. Which two actions should you take?","options":{"A":"Create a Cloud Storage lifecycle rule with Age: \"30\", Storage Class: \"Standard\", and Action: \"Set to Coldline\", and create a second GCS life-cycle rule with Age: \"365\", Storage Class: \"Coldline\", and Action: \"Delete\".","B":"Create a Cloud Storage lifecycle rule with Age: \"30\", Storage Class: \"Coldline\", and Action: \"Set to Nearline\", and create a second GCS life-cycle rule with Age: \"91\", Storage Class: \"Coldline\", and Action: \"Set to Nearline\".","C":"Create a Cloud Storage lifecycle rule with Age: \"90\", Storage Class: \"Standard\", and Action: \"Set to Nearline\", and create a second GCS life-cycle rule with Age: \"91\", Storage Class: \"Nearline\", and Action: \"Set to Coldline\".","D":"Create a Cloud Storage lifecycle rule with Age: \"30\", Storage Class: \"Standard\", and Action: \"Set to Coldline\", and create a second GCS life-cycle rule with Age: \"365\", Storage Class: \"Nearline\", and Action: \"Delete\"."},"answer":["A"],"explanation":""},{"id":46,"topic":"TerramEarth Case 2","question":"You are migrating a Linux-based application from your private data center to Google Cloud. The TerramEarth security team sent you several recent Linux vulnerabilities published by Common Vulnerabilities and Exposures (CVE). You need assistance in understanding how these vulnerabilities could impact your migration. What should you do?","options":{"A":"Open a support case regarding the CVE and chat with the support engineer.","B":"Read the CVEs from the Google Cloud Status Dashboard to understand the impact.","C":"Read the CVEs from the Google Cloud Platform Security Bulletins to understand the impact","D":"Post a question regarding the CVE in Stack Overflow to get an explanation","E":"Post a question regarding the CVE in a Google Cloud discussion group to get an explanation"},"answer":["A","C"],"explanation":"Explanation: https://cloud.google.com/support/bulletins"},{"id":47,"topic":"TerramEarth Case 2","question":"TerramEarth has about 1 petabyte (PB) of vehicle testing data in a private data center. You want to move the data to Cloud Storage for your machine learning team. Currently, a 1-Gbps interconnect link is available for you. The machine learning team wants to start using the data in a month. What should you do?","options":{"A":"Request Transfer Appliances from Google Cloud, export the data to appliances, and return the appliances to Google Cloud.","B":"Configure the Storage Transfer service from Google Cloud to send the data from your data center to Cloud Storage","C":"Make sure there are no other users consuming the 1 Gbps link, and use multi-thread transfer to upload the data to Cloud Storage.","D":"Export files to an encrypted USB device, send the device to Google Cloud, and request an import of the data to Cloud Storage"},"answer":["A"],"explanation":""},{"id":48,"topic":"TerramEarth Case 2","question":"For this question, refer to the TerramEarth case study. You start to build a new application that uses a few Cloud Functions for the backend. One use case requires a Cloud Function func_display to invoke another Cloud Function func_query. You want func_query only to accept invocations from func_display. You also want to follow Google ' s recommended best practices. What should you do?","options":{"A":"Create a token and pass it in as an environment variable to func_display. When invoking func_query, include the token in the request Pass the same token to func _query and reject the invocation if the tokens are different.","B":"Make func_query ' Require authentication. ' Create a unique service account and associate it to func_display. Grant the service account invoker role for func_query. Create an id token in func_display and include the token to the request when invoking func_query.","C":"Make func _query ' Require authentication ' and only accept internal traffic. Create those two functions in the same VPC. Create an ingress firewall rule for func_query to only allow traffic from func_display.","D":"Create those two functions in the same project and VPC. Make func_query only accept internal traffic.Create an ingress firewall for func_query to only allow traffic from func_display. Also, make sure both functions use the same service account."},"answer":["B"],"explanation":"Explanation: https://cloud.google.com/functions/docs/securing/authenticating#authenticating_function_to_funct ion_calls"},{"id":49,"topic":"TerramEarth Case 2","question":"For this question, refer to the TerramEarth case study. A new architecture that writes all incoming data to BigQuery has been introduced. You notice that the data is dirty, and want to ensure data quality on an automated daily basis while managing cost. What should you do?","options":{"A":"Set up a streaming Cloud Dataflow job, receiving data by the ingestion process. Clean the data in a Cloud Dataflow pipeline.","B":"Create a Cloud Function that reads data from BigQuery and cleans it. Trigger it. Trigger the Cloud Function from a Compute Engine instance.","C":"Create a SQL statement on the data in BigQuery, and save it as a view. Run the view daily, and save the result to a new table.","D":"Use Cloud Dataprep and configure the BigQuery tables as the source. Schedule a daily job to clean the data."},"answer":["A"],"explanation":""},{"id":50,"topic":"TerramEarth Case 2","question":"You have broken down a legacy monolithic application into a few containerized RESTful microservices. You want to run those microservices on Cloud Run. You also want to make sure the services are highly available with low latency to your customers. What should you do?","options":{"A":"Deploy Cloud Run services to multiple availability zones. Create Cloud Endpoints that point to the services. Create a global HTIP(S) Load Balancing instance and attach the Cloud Endpoints to its backend.","B":"Deploy Cloud Run services to multiple regions Create serverless network endpoint groups pointing to the services. Add the serverless NE Gs to a backend service that is used by a global HTIP(S) Load Balancing instance.","C":"Cloud Run services to multiple regions. In Cloud DNS, create a latency-based DNS name that points to the services.","D":"Deploy Cloud Run services to multiple availability zones. Create a TCP/IP global load balancer. Add the Cloud Run Endpoints to its backend service."},"answer":["B"],"explanation":"Explanation: https://cloud.google.com/run/docs/multiple-regions"},{"id":51,"topic":"TerramEarth Case 2","question":"TerramEarth has a legacy web application that you cannot migrate to cloud. However, you still want to build a cloud-native way to monitor the application. If the application goes down, you want the URL to point to a \" Site is unavailable \" page as soon as possible. You also want your Ops team to receive a notification for the issue. You need to build a reliable solution for minimum cost What should you do?","options":{"A":"Create a scheduled job in Cloud Run to invoke a container every minute. The container will check the application URL If the application is down, switch the URL to the \" Site is unavailable \" page, and notify the Ops team.","B":"Create a cron job on a Compute Engine VM that runs every minute. The cron job invokes a Python program to check the application URL If the application is down, switch the URL to the \" Site is unavailable \" page, and notify the Ops team.","C":"Create a Cloud Monitoring uptime check to validate the application URL If it fails, put a message in a Pub/Sub queue that triggers a Cloud Function to switch the URL to the \" Site is unavailable \" page, and notify the Ops team.","D":"Use Cloud Error Reporting to check the application URL If the application is down, switch the URL to the \" Site is unavailable \" page, and notify the Ops team."},"answer":["C"],"explanation":"Explanation: https://cloud.google.com/blog/products/management-tools/how-to-use-pubsub-as-a-cloud- monitoring-notification-channel"},{"id":52,"topic":"TerramEarth Case 2","question":"For this question, refer to the TerramEarth case study. Considering the technical requirements, how should you reduce the unplanned vehicle downtime in GCP?","options":{"A":"Use BigQuery as the data warehouse. Connect all vehicles to the network and stream data into BigQuery using Cloud Pub/Sub and Cloud Dataflow. Use Google Data Studio for analysis and reporting.","B":"Use BigQuery as the data warehouse. Connect all vehicles to the network and upload gzip files to a Multi-Regional Cloud Storage bucket using gcloud. Use Google Data Studio for analysis and reporting.","C":"Use Cloud Dataproc Hive as the data warehouse. Upload gzip files to a MultiRegional Cloud Storage bucket. Upload this data into BigQuery using gcloud. Use Google data Studio for analysis and reporting.","D":"Use Cloud Dataproc Hive as the data warehouse. Directly stream data into prtitioned Hive tables. Use Pig scripts to analyze data."},"answer":["A"],"explanation":""},{"id":53,"topic":"Mountkrik Games Case 2","question":"For this question, refer to the Mountkirk Games case study. Mountkirk Games wants to migrate from their current analytics and statistics reporting model to one that meets their technical requirements on Google Cloud Platform. Which two steps should be part of their migration plan? (Choose two.)","options":{"A":"Evaluate the impact of migrating their current batch ETL code to Cloud Dataflow.","B":"Write a schema migration plan to denormalize data for better performance in BigQuery.","C":"Draw an architecture diagram that shows how to move from a single MySQL database to a MySQL cluster.","D":"Load 10 TB of analytics data from a previous game into a Cloud SQL instance, and run test queries against the full dataset to confirm that they complete successfully.","E":"Integrate Cloud Armor to defend against possible SQL injection attacks in analytics files uploaded to Cloud Storage."},"answer":["A","B"],"explanation":"Explanation: https://cloud.google.com/bigquery/docs/loading-data#loading_denormalized_nested_and_repeat ed_data"},{"id":54,"topic":"Mountkrik Games Case 2","question":"For this question, refer to the Mountkirk Games case study. You are in charge of the new Game Backend Platform architecture. The game communicates with the backend over a REST API. You want to follow Google-recommended practices. How should you design the backend?","options":{"A":"Create an instance template for the backend. For every region, deploy it on a multi-zone managed instance group. Use an L4 load balancer.","B":"Create an instance template for the backend. For every region, deploy it on a single-zone managed instance group. Use an L4 load balancer.","C":"Create an instance template for the backend. For every region, deploy it on a multi-zone managed instance group. Use an L7 load balancer.","D":"Create an instance template for the backend. For every region, deploy it on a single-zone managed instance group. Use an L7 load balancer."},"answer":["C"],"explanation":"Explanation: https://cloud.google.co m/solutions/gaming/cloud-game-infrastructure#dedicated_game_server"},{"id":55,"topic":"Mountkrik Games Case 2","question":"For this question, refer to the Mountkirk Games case study. You need to analyze and define the technical architecture for the compute workloads for your company, Mountkirk Games. Considering the Mountkirk Games business and technical requirements, what should you do?","options":{"A":"Create network load balancers. Use preemptible Compute Engine instances.","B":"Create network load balancers. Use non-preemptible Compute Engine instances.","C":"Create a global load balancer with managed instance groups and autoscaling policies. Use preemptible Compute or on a Compute Engine virtual machine, and run multiple copies in Google Cloud Platform regions all over the world to generate realistic traffic.","C":"Add the ability to introduce a random amount of delay before beginning to process analytics files uploaded from mobile devices.","D":"Create an opt-in beta of the game that runs on players ' mobile devices and collects response times from analytics endpoints running in Google Cloud Platform regions all over the world."},"answer":["D"],"explanation":""},{"id":59,"topic":"Mountkrik Games Case 2","question":"For this question, refer to the Mountkirk Games case study. Mountkirk Games wants to design their solution for the future in order to take advantage of cloud and technology improvements as they become available. Which two steps should they take? (Choose two.)","options":{"A":"Store as much analytics and game activity data as financially feasible today so it can be used to train machine learning models to predict user behavior in the future.","B":"Begin packaging their game backend artifacts in container images and running them on Kubernetes Engine to improve the availability to scale up or down based on game activity.","C":"Set up a CI/CD pipeline using Jenkins and Spinnaker to automate canary deployments and improve development velocity.","D":"Adopt a schema versioning tool to reduce downtime when adding new game features that require storing additional player data in the database.","E":"Implement a weekly rolling maintenance process for the Linux virtual machines so they can apply critical kernel patches and package updates and reduce the risk of 0-day vulnerabilities."},"answer":["B","C"],"explanation":""},{"id":60,"topic":"Mountkrik Games Case 3","question":"You are implementing Firestore for Mountkirk Games. Mountkirk Games wants to give a new game programmatic access to a legacy game ' s Firestore database. Access should be as restricted as possible. What should you do?","options":{"A":"Create a service account (SA) in the legacy game ' s Google Cloud project, add this SA in the new game ' s IAM page, and then give it the Firebase Admin role in both projects","B":"Create a service account (SA) in the legacy game ' s Google Cloud project, add a second SA in the new game ' s IAM page, and then give the Organization Admin role to both SAs","C":"Create a service account (SA) in the legacy game ' s Google Cloud project, give it the Firebase Admin role, and then migrate the new game to the legacy game ' s project.","D":"Create a service account (SA) in the lgacy game ' s Google Cloud project, give the SA the Organization Admin rule and then give it the Firebase Admin role in both projects"},"answer":["A"],"explanation":""},{"id":61,"topic":"Mountkrik Games Case 3","question":"Mountkirk Games wants to limit the physical location of resources to their operating Google 38 Cloud regions. What should you do?","options":{"A":"Configure an organizational policy which constrains where resources can be deployed.","B":"Configure IAM conditions to limit what resources can be configured.","C":"Configure the quotas for resources in the regions not being used to 0.","D":"Configure a custom alert in Cloud Monitoring so you can disable resources as they are created in other regions."},"answer":["A"],"explanation":""},{"id":62,"topic":"Mountkrik Games Case 3","question":"You need to implement a network ingress for a new game that meets the defined business and technical requirements. Mountkirk Games wants each regional game instance to be located in multiple Google Cloud regions. What should you do?","options":{"A":"Configure a global load balancer connected to a managed instance group running Compute Engine instances.","B":"Configure kubemci with a global load balancer and Google Kubernetes Engine.","C":"Configure a global load balancer with Google Kubernetes Engine.","D":"Configure Ingress for Anthos with a global load balancer and Google Kubernetes Engine."},"answer":["A"],"explanation":""},{"id":63,"topic":"Mountkrik Games Case 3","question":"You need to optimize batch file transfers into Cloud Storage for Mountkirk Games' new Google Cloud solution. The batch files contain game statistics that need to be staged in Cloud Storage and be processed by an extract transform load (ETL) tool. What should you do?","options":{"A":"Use gsutil to batch move files in sequence.","B":"Use gsutil to batch copy the files in parallel.","C":"Use gsutil to extract the files as the first part of ETL.","D":"Use gsutil to load the files as the last part of ETL."},"answer":["B"],"explanation":"Reference: https://cloud.google.com/storage/docs/gsutil/commands/cp"},{"id":64,"topic":"Mountkrik Games Case 3","question":"Your development team has created a mobile game app. You want to test the new mobile app on Android and iOS devices with a variety of configurations. You need to ensure that testing is efficient and cost-effective. What should you do?","options":{"A":"Upload your mobile app to the Firebase Test Lab, and test the mobile app on Android and iOS devices.","B":"Create Android and iOS VMs on Google Cloud, install the mobile app on the VMs, and test the mobile app.","C":"Create Android and iOS containers on Google Kubernetes Engine (GKE), install the mobile app on the containers, and test the mobile app.","D":"Upload your mobile app with different configurations to Firebase Hosting and test each configuration."},"answer":["C"],"explanation":""},{"id":65,"topic":"Mountkrik Games Case 3","question":"Mountkirk Games wants you to secure the connectivity from the new gaming application platform to Google Cloud. You want to streamline the process and follow Google-recommended practices. What should you do?","options":{"A":"Configure Workload Identity and service accounts to be used by the application platform.","B":"Use Kubernetes Secrets, which are obfuscated by default. Configure these Secrets to be used by the application platform.","C":"Configure Kubernetes Secrets to store the secret, enable Application-Layer Secrets Encryption, and use Cloud Key Management Service (Cloud KMS) to manage the encryption keys. Configure these Secrets to be used by the application platform.","D":"Configure HashiCorp Vault on Compute Engine, and use customer managed encryption keys and Cloud Key Management Service (Cloud KMS) to manage the encryption keys. Configure these Secrets to be used by the application platform."},"answer":["A"],"explanation":""},{"id":66,"topic":"Mountkrik Games Case 3","question":"Your development teams release new versions of games running on Google Kubernetes Engine (GKE) daily. You want to create service level indicators (SLIs) to evaluate the quality of the new versions from the user's perspective. What should you do?","options":{"A":"Create CPU Utilization and Request Latency as service level indicators.","B":"Create GKE CPU Utilization and Memory Utilization as service level indicators.","C":"Create Request Latency and Error Rate as service level indicators.","D":"Create Server Uptime and Error Rate as service level indicators."},"answer":["C"],"explanation":""},{"id":67,"topic":"Helicopter Racing League Case","question":"For this question, refer to the Helicopter Racing League (HRL) case study. A recent finance audit of cloud infrastructure noted an exceptionally high number of Compute Engine instances are allocated to do video encoding and transcoding. You suspect that these Virtual Machines are zombie machines that were not deleted after their workloads completed. You need to quickly get a list of which VM instances are idle. What should you do?","options":{"A":"Log into each Compute Engine instance and collect disk, CPU, memory, and network usage statistics for analysis.","B":"Use the gcloud compute instances list to list the virtual machine instances that have the idle: true label set.","C":"Use the gcloud recommender command to list the idle virtual machine instances.","D":"From the Google Console, identify which Compute Engine instances in the managed instance groups are no longer responding to health check probes."},"answer":["C"],"explanation":"Reference: https://cloud.google.com/compute/docs/instances/viewing-and-applying-idle-vm- recommendations "},{"id":68,"topic":"Helicopter Racing League Case","question":"For this question, refer to the Helicopter Racing League (HRL) case study. HRL wants better prediction accuracy from their ML prediction models. They want you to use Google's AI Platform so HRL can understand and interpret the predictions. What should you do?","options":{"A":"Use Explainable AI.","B":"Use Vision AI.","C":"Use Google Cloud's operations suite.","D":"Use Jupyter Notebooks."},"answer":["A"],"explanation":"Reference: https://cloud.google.com/ai-platform/prediction/docs/ai-explanations/preparing- metadata"},{"id":69,"topic":"Helicopter Racing League Case","question":"For this question, refer to the Helicopter Racing League (HRL) case study. The HRL development team releases a new version of their predictive capability application every Tuesday evening at 3 a.m. UTC to a repository. The security team at HRL has developed an in-house penetration test Cloud Function called Airwolf. The security team wants to run Airwolf against the predictive capability application as soon as it is released every Tuesday. You need to set up Airwolf to run at the recurring weekly cadence. What should you do?","options":{"A":"Set up Cloud Tasks and a Cloud Storage bucket that triggers a Cloud Function.","B":"Set up a Cloud Logging sink and a Cloud Storage bucket that triggers a Cloud Function.","C":"Configure the deployment job to notify a Pub/Sub queue that triggers a Cloud Function.","D":"Set up Identity and Access Management (IAM) and Confidential Computing to trigger a Cloud Function."},"answer":["A"],"explanation":""},{"id":70,"topic":"Helicopter Racing League Case","question":"For this question, refer to the Helicopter Racing League (HRL) case study. HRL is looking for a stly IP address ranges.","D":"Apply a VPC firewall rule on port 443 for network resources tagged with scurceiplisr-fasrly."},"answer":["C"],"explanation":"Reference: https://cloud.google.com/load-balancing/docs/https D18912E1457D5D1DDCBD40AB3BF70D5D"},{"id":72,"topic":"Helicopter Racing League Case","question":"For this question, refer to the Helicopter Racing League (HRL) case study. Your team is in charge of creating a payment card data vault for card numbers used to bill tens of thousands of viewers, merchandise consumers, and season ticket holders. You need to implement a custom card tokenization service that meets the following requirements: * It must provide low latency at minimal cost. * It must be able to identify duplicate credit cards and must not store plaintext card numbers. * It should support annual key rotation. Which storage approach should you adopt for your tokenization service?","options":{"A":"Store the card data in Secret Manager after running a query to identify duplicates.","B":"Encrypt the card data with a deterministic algorithm stored in Firestore using Datastore mode.","C":"Encrypt the card data with a deterministic algorithm and shard it across multiple Memorystore instances.","D":"Use column-level encryption to store the data in Cloud SQL."},"answer":["B"],"explanation":"Explanation: https://cloud.google.com/community/tutorials/pci-tokenizer Deterministic output means that a given set of inputs (card number, expiration, and userID) will always generate the same token. This is useful if you want to rely on the token value to deduplicate your token stores. You can simply match a newly generated token to your existing catalog of tokens to determine whether the card has been previously stored. Depending on your application architecture, this can be a very useful feature. However, this could also be accomplished using a salted hash of the input values."},{"id":73,"topic":"EHR Health Care","question":"You need to upgrade the EHR connection to comply with their requirements. The new connection design must support business-critical needs and meet the same network and security policy requirements. What should you do?","options":{"A":"Add a new Dedicated Interconnect connection.","B":"Upgrade the bandwidth on the Dedicated Interconnect connection to 100 G.","C":"Add three new Cloud VPN connections.","D":"Add a new Carrier Peering connection."},"answer":["D"],"explanation":""},{"id":74,"topic":"EHR Health Care","question":"For this question, refer to the EHR Healthcare case study. You are a developer on the EHR customer portal team. Your team recently migrated the customer portal application to Google Cloud. The load has increased on the application servers, and now the application is logging many timeout errors. You recently incorporated Pub/Sub into the application architecture, and the application is not logging any Pub/Sub publishing errors. You want to improve publishing latency. What should you do?","options":{"A":"Increase the Pub/Sub Total Timeout retry value.","B":"Move from a Pub/Sub subscriber pull model to a push model.","C":"Turn off Pub/Sub message batching.","D":"Create a backup Pub/Sub message queue."},"answer":["C"],"explanation":"Explanation: https://cloud.google.com /pubsub/docs/publisher?hl=en#batching"},{"id":75,"topic":"EHR Health Care","question":"For this question, refer to the EHR Healthcare case study. In the past, configuration errors put public IP addresses on backend servers that should not have been accessible from the Internet. You need to ensure that no one can put external IP addresses on backend Compute Engine instances and that external IP addresses can only be configured on frontend Compute Engine instances. What should you do?","options":{"A":"Create an Organizational Policy with a constraint to allow external IP addresses only on the frontend Compute Engine instances.","B":"Revoke the compute.networkAdmin role from all users in the project with front end instances.","C":"Create an Identity and Access Management (IAM) policy that maps the IT staff to the compute. networkAdmin role for the organization.","D":"Create a custom Identity and Access Management (IAM) role named GCE_FRONTEND with the compute.addresses.create permission."},"answer":["A"],"explanation":"Explanation: https://cloud.google.com/compute/docs/ip-addresses/reserve-static-external-ip- address#disableexternalip"},{"id":76,"topic":"EHR Health Care","question":"For this question, refer to the EHR Healthcare case study. EHR has single Dedicated Interconnect connection between their primary data center and Googles network. This connection satisfies EHR's network and security policies: * On-premises servers without public IP addresses need to connect to cloud resources without public IP addresses * Traffic flows from production network mgmt. servers to Compute Engine virtual machines should never traverse the public internet. You need to upgrade the EHR connection to comply with their requirements. The new connection design must support business critical needs and meet the same network and security policy requirements. What should you do?","options":{"A":"Add a new Dedicated Interconnect connection","B":"Upgrade the bandwidth on the Dedicated Interconnect connection to 100 G","C":"Add three new Cloud VPN connections","D":"Add a new Carrier Peering connection"},"answer":["A"],"explanation":"Explanation: The case does not call out the throughput being an issue. However, to achieve 99.99%, you need to have 4 connections as per Google recommendations. However, in the options only A has the option to add an additional Interconnect connection. https://cloud.google.com/network- connectivity/docs/interconnect/concepts /dedicated-overview#availability"},{"id":77,"topic":"EHR Health Care","question":"For this question, refer to the EHR Healthcare case study. You are responsible for designing the Google Cloud network architecture for Google Kubernetes Engine. You want to follow Google
