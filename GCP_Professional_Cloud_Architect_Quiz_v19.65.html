g model that requires high-performance access to large volumes of media data currently stored in Cloud Storage. Model training will be executed on multiple VM instances with GPUs attached, but your application must interact with the data as if it were on the local file system. You need to minimize complexity and cost. What should you do?","options":{"A":"Use the gsutil command line tool to download the data to your VM instances.","B":"Copy the data from Cloud Storage to Filestore, and then mount the Filestore volume as a local file system on your VM instances.","C":"Create a shared persistent disk, attach the disk to your VM instances, and load data from the Cloud Storage bucket.","D":"Use the gcsfuse command line tool to mount the Cloud Storage bucket as a local file system, and perform read/write operations in your bucket using standard file system semantics."},"answer":["D"],"explanation":"Explanation: According to Google Cloud documentation on Cloud Storage FUSE , gcsfuse is the recommended tool for applications that require a POSIX-compliant file system interface to Cloud Storage buckets. This allows deep learning frameworks (like TensorFlow or PyTorch) to read media data using standard file I/O commands (open, read) as if the data were on a local disk, without requiring the application code to be rewritten to use the Cloud Storage API. Cloud Storage FUSE is the most cost-effective and least complex solution because it avoids the need to duplicate data. Option B (Filestore) and Option C (Persistent Disk) would require you to pay for expensive block/file storage in addition to your Cloud Storage costs, and would require time- consuming data copying steps. Option A (download ing) is impractical for \" large volumes of media data \" as it would consume significant time and local disk space on every GPU instance. While gcsfuse does not provide the same performance as a local SSD for random small-file I/O, it is highly optimized for the sequential read patterns typical of media processing and deep learning training. By mounting the bucket directly, you minimize operational overhead and only pay for the data you store in Cloud Storage and the egress associated with the reads, aligning perfectly with the goal of \" minimizing complexity and cost. \""},{"id":131,"topic":"Altostrat Media Case Study","question":"You have an application deployed on Kubernetes Engine using a Deployment named echo- deployment. The deployment is exposed using a Service called echo-service. You need to perform an update to the application with minimal downtime to the application. What should you do?","options":{"A":"Use kubect1 set image deployment/echo-deployment < new-image >","B":"Use the rolling update functionality of the Instance Group behind the Kubernetes cluster","C":"Update the deployment yaml file with the new container image. Use kubect1 delete deployment/ echo-deployment and kubect1 create -f < yaml-file >","D":"Update the service yaml file which the new container image. Use kubect1 delete service/echoservice and kubect1 create -f < yaml-file >"},"answer":["A"],"explanation":"Explanation: https://cloud.googl e.com/kubernetes-engine/docs/how-to/updating-apps#updating_an_application"},{"id":132,"topic":"Altostrat Media Case Study","question":"You are implementing the infrastructure for a web service on Google Cloud. The web service needs to receive and store the data from 500,000 requests per second. The data will be queried later in real time, based on exact matches of a known set of attributes. There will be periods where the web service will not receive any requests. The business wants to keep costs low. Which web service platform and database should you use for the application?","options":{"A":"Cloud Run and BigQuery","B":"Cloud Run and Cloud Bigtable","C":"A Compute Engine autoscaling managed instance group and BigQuery","D":"A Compute Engine autoscaling managed instance group and Cloud Bigtable"},"answer":["B"],"explanation":" Explanation: https://cloud.google.com/run/docs/about-instance-autoscaling https://cloud.google.com/blog/topics/developers-practitioners/bigtable-vs-bigquery-whats- difference"},{"id":133,"topic":"Altostrat Media Case Study","question":"A large, multinational corporation is migrating to Google Cloud. The company has several distinct business units: Finance, Marketing, and Research and Development (R & D). The central security team has mandated governance requirements for each business unit. You need to design a resource hierarchy that enforces these security policies at scale according to the Google Cloud Well- Architected Framework while providing the correct level of autonomy for each business unit. What should you do?","options":{"A":"Place all projects directly under the Organization node. Use network tags and service accounts to enforce security boundaries between the different department workloads. Apply the resource location Organization Policy on the Finance project.","B":"Create a folder for each department under the root Organization node. Apply the resource location Organization Policy on the Finance folder. Within the Marketing folder, create separate projects for mktg-prod and mktg-dev. Grant the compliance team the roles/viewer role at the Organization level.","C":"Create separate Google Cloud Organizations for each department (Finance, Marketing, and R & D). Grant the compliance team the roles/viewer role for each organization.","D":"Create a single project for each department. Apply the resource location policy directly to the Finance project. Grant the compliance team the roles/browser role on each project individually."},"answer":["B"],"explanation":"Explanation: According to the Google Cloud Resource Hierarchy documentation, Folders are the primary mechanism for organizing projects and grouping resources with similar requirements. This design perfectly addresses the multinational ' s needs: * Inheritance: By creating a \" Finance \" folder, you can apply the Resource Location Organization Policy (restricting deployments to us-central1 and eu rope-west2) at the folder level. Any project created within that folder will automatically inherit this restriction. * IAM Governance: You can grant the finance-admins group permissions at the folder level, ensuring they have control over all finance-related projects without accessing Marketing or R & D. * Auditing: Granting the roles/viewer role at the Organization level ensures the compliance team has the required \" read-only access to view all resources \" across the entire company, fulfilling the global auditing requirement through hierarchical inheritance. * Isolation: Creating separate projects for mktg-prod and mktg-dev within the Marketing folder allows for environment isolation, while the R & D folder can be granted more permissive policies or its own VPC to prevent impacts on production. Option C is incorrect because managing multiple Organizations adds unnecessary administrative complexity and fragments billing. Option A and D are not scalable and fail to leverage the \" policy inheritance \" benefits that define a Well-Architected resource hierarchy."},{"id":134,"topic":"Altostrat Media Case Study","question":"You are designing the storage architecture for a financial analytics platform. The platform ingests and stores terabytes of transactional data daily, which is used for both real-time fraud detection and long-term historical analysis. Transaction data from the last 30 days must be accessible 75 with very low latency for the fraud detection engine. Data older than 30 days is accessed infrequently for quarterly reports, where retrieval times of a few seconds are acceptable. All data must be retained for five years to meet compliance regulations. You need to design a solution as cost- effective as possible. What should you do?","options":{"A":"Store all transaction data in a Cloud Storage bucket using the Standard storage class for the entire five- year retention period.","B":"Ingest all data into BigQuery using time-partitioned tables, and rely on BigQuery ' s automatic long- term storage pricing for data older than 90 days.","C":"Configure a Cloud Storage bucket with an Object Lifecycle Management policy to transition data from the Standard class to the Archive class after 30 days.","D":"Configure a Cloud Storage bucket with an Object Lifecycle Management policy to transition data from the Standard class to the Coldline class after 30 days."},"answer":["D"],"explanation":"Explanation: According to Google Cloud Storage documentation , the choice of storage class depends on the access frequency and retention period. For the first 30 days, data requires \" very low latency, \" making Standard Storage necessary. For data older than 30 days that is accessed for \" quarterly reports \" (roughly every 90 days) where \" retrieval times of a few seconds \" are acceptable, Coldline Storage is the most cost-effective choice. Coldline is designed for data accessed at most once a quarter. Transitioning to Archive (Option C) would be too aggressive, as Archive is intended for data accessed less than once a year and may have higher retrieval costs. Option B (BigQuery) is excellent for analytics but can be significantly more expensive than Cloud Storage for simple long-term retention of terabytes of raw transaction data. Object Lifecycle Management automates this transition, ensuring cost-efficiency over the 5-year compliance window."},{"id":135,"topic":"Altostrat Media Case Study","question":"You have a Compute Engine application that you want to autoscale when total memory usage exceeds 80%. You have Installed the Cloud Ops agent and configured the autoscaling policy as follows: You observe that the application does not scale under high load. You want to resolve this. What should you do?","options":{"A":"Change the metric identifier to agent.googleapis.com/memory/bytes_used","B":"Change the Filter to metric.label.state = 'used'","C":"Change the filer to metric.label.state = 'free' and the Target utilization level to 20","D":"Change the Target type to DELTA_PER_MINUTE"},"answer":["C"],"explanation":""},{"id":136,"topic":"Altostrat Media Case Study","question":"Your operations team currently stores 10 TB of data m an object storage service from a third-party provider. They want to move this data to a Cloud Storage bucket as quickly as possible, following Google- recommended practices. They want to minimize the cost of this data migration. When approach should they use?","options":{"A":"Use the gsutil mv command lo move the data","B":"Use the Storage Transfer Service to move the data","C":"Download the data to a Transfer Appliance and ship it to Google","D":"Download the data to the on-premises data center and upload it to the Cloud Storage bucket"},"answer":["B"],"explanation":"Explanation: https://cloud.google.com/architecture/migration-to-google-cloud-transferring-your-large- datasets#transfer-options https://cloud.google.com/storage-transfer-service"},{"id":137,"topic":"Altostrat Media Case Study","question":"Your organization has a significant amount of log data stored in Cloud Logging. The data engineering team is accustomed to using SQL for analysis and wants the ability to create insightful dashboards for visualizing log trends and patterns. You want to follow the recommendations of the Google Cloud Well-Architected Framework to provide a solution for the data engineering team What should you do?","options":{"A":"Enable log analytics and run queries in the linked log dataset in BigQuery. Visualize the data with Looker Studio dashboards.","B":"Create a log sink, and export the data to a storage bucket. Create an external table in BigQuery for the data in the bucket Run queries and visualize the data with Cloud Monitoring dashboards","C":"Enable log analytics and run queries in Cloud Monitoring Visualize the data using Vertex Al workbench.","D":"Create a log sink, and export the data to BigQuery using Pub/Sub. Run queries and visualize the data with Cloud Monitoring dashboards."},"answer":["A"],"explanation":"Explanation: The Google Cloud Well-Architected Framework recommends using specialized tools for specialized tasks. * Log Analytics: This feature allows you to query your Cloud Logging data using Standard SQL directly in the console. * BigQuery & Looker Studio: By linking the log bucket to BigQuery, your data engineering team can use their existing SQL skills to perform complex joins. Looker Studio (Option A) is then used to create high-level visualizations that are far more advanced than basic Cloud Monitoring charts. * Why not D? While Pub/Sub to BigQuery works, it is more complex to manage ( \" operational complexity \" ) than simply enabling the built-in Log Analytics feature."},{"id":138,"topic":"Altostrat Media Case Study","question":"You are designing a hybrid cloud network for a financial services company with two on- premises data centers in different geographical regions. The company requires a highly available (99.9% SLA) and low-latency connection to a single VPC in Google Cloud for business-critical, high- throughput applications. You need to design the most resilient connectivity solution to protect against a regional on-premises failure. What should you do?","options":{"A":"Provision an HA VPN connection from each on-premises data center to the VPC.","B":"Provision two Dedicated Interconnect connections from each on-premises data center to the VPC.","C":"Deploy an IPsec VPN on Compute Engine in the VPC network. Configure connectivity from each on- premises data center to the VPN.","D":"Provision a single Dedicated Interconnect connection to the VPC."},"answer":["B"],"explanation":"Explanation: To protect against a regional on-premises failure while satisfying high-throughput, low-latency, and high- availability criteria (99.9% SLA), Dedicated Interconnect is the required primary physical transport mechanism. Cloud VPN options (both HA VPN and Compute Engine-based IPsec VPNs) cannot natively match the raw line-rate throughput and deterministic ultra-low latency profiles offered by Dedicated Interconnect, making them unsuitable for massive, business-critical financial applications. To achieve the 99.9% availability SLA topology outlined by Google Cloud deployment guidelines, the architecture requires redundant connections in a dual-homed configuration across distinct edge availability domains (Metropolitan Areas or distinct colocation facilities). Provisioning two Dedicated Interconnect connections from each of the two geographically distinct on-premises data centers ensures that even if one complete region or facility suffers a catastrophic failure, the remaining data center maintains uninterrupted, high-throughput path diversity to the Google Cloud VPC via its own pair of local circuits. References: Cloud Architect (GCP) Study Guide topics: \" Hybrid Connectivity \" , \" Dedicated Interconnect Topology \" , \" Designing for 99.9% and 99.99% Availability \" , and \" Cloud Router BGP Routing Policies \" ."},{"id":139,"topic":"Altostrat Media Case Study","question":"You need to build a continuous delivery pipeline tor a containerized application in Google Cloud. You want to run all your tests in the pipeline to Improve your application ' s quality. What should you do?","options":{"A":"1. After the developers push the code to a central repository, trigger Cloud Build to run unit tests If all unit tests are successful, build the application container and push it to a central registry. 2. Trigger Cloud Build to deploy the container to a testing environment and run integration tests and acceptance tests 3. If all tests are successful, deploy the application to the production environment and run the smoke tests","B":"1. Automatically run unit tests in a local environment once the code is changed It all tests are successful, build a container. 2. Trigger Cloud Build to deploy the container to a testing environment, and run integration tests and acceptance tests. 3. If all tests are successful, tag the code as production ready. Trigger Cloud Build to build and deploy the container to the production environment.","C":"1. Run unit tests in the developer ' s local environment before committing and pushing the code to a central repository 2. After the code is pushed, trigger Cloud Build to build the application container and deploy the container to a testing environment, and run integration tests 3. If the integration tests are successful, deploy the container to your production environment and run acceptance tests.","D":"1. Alter the developers push the code to a central repository, trigger Cloud Build to build the application container. Then run unit tests 2. If unit tests are successful, deploy the container to a testing environment and run integration tests. 3. If the integration tests are successful, deploy the container to a production environment and run acceptance tests."},"answer":["A"],"explanation":"Explanation: The most efficient pipeline follows the \" Fail Fast \" principle (Option A). You should run unit tests before the expensive and time-consuming process of building a container image. If the code logic is broken, the build should fail immediately. Once the image is built and stored, it is deployed to a Testing Environment for integration and acceptance tests to ensure it works within the system architecture. Finally, after deploying to Production , you run smoke tests (basic health checks) to ensure the live environment is stable. Options C and D are less ideal because they either suggest running acceptance tests after reaching production or skipping local validation steps, which increases the risk of deploying broken code to users."},{"id":140,"topic":"Altostrat Media Case Study","question":"You are working with a data warehousing team that performs data analysis. The team needs to process data from external partners, but the data contains personally identifiable information (PlI). You need to process and store the data without storing any of the Pll data. What should you do?","options":{"A":"Create a Dataflow pipeline to retrieve the data from the external sources. As part of the pipeline use the Cloud Data Loss Prevention (Cloud DLP) API to remove any Pll data Store the result in BigQuery","B":"Create a Dataflow pipeline to retrieve the data from the external sources. As part of the pipeline store all non-PII data in BigQuery and store all Pll data in a Cloud Storage bucket that has a retention policy set.","C":"Ask the external partners to upload an data on Cloud Storage Configure Bucket Lock for the bucket Create a Dataflow pipeline to read the data from the bucket As part of the pipeline, use the Cloud Data Loss Prevention (Cloud DIP) API to remove any Pll data Store the result in BigQuery","D":"Ask the external partners to import ail data in your BigQuery dataset Create a dataflow pipeline to copy the data into a new table As part of the Dataflow bucket skip all data in columns that have Pll data"},"answer":["B"],"explanation":"Explanation: Create a Dataflow pipeline to retrieve the data from the external sources, he did not specify the way he is going to create it, it might be a pub/sub or external table or whatever."},{"id":141,"topic":"Altostrat Media Case Study","question":"One of the developers on your team deployed their application in Google Container Engine with the Dockerfile below. They report that their application deployments are taking too long. You want to optimize this Dockerfile for faster deployment times without adversely affecting the app's functionality. Which two actions should you take? Choose 2 answers.","options":{"A":"Remove Python after running pip.","B":"Remove dependencies from requirements.txt.","C":"Use a slimmed-down base image like Alpine linux.","D":"Use larger machine types for your Google Container Engine node pools.","E":"Copy the source after the package dependencies (Python and pip) are installed."},"answer":["C","E"],"explanation":" Explanation: The speed of deployment can be changed by limiting the size of the uploaded app, limiting the complexity of the build necessary in the Dockerfile, if present, and by ensuring a fast and reliable internet connection. Note: Alpine Linux is built around musl libc and busybox. This makes it smaller and more resource efficient than traditional GNU/Linux distributions. A container requires no more than 8 MB and a minimal installation to disk requires around 130 MB of storage. Not only do you get a fully-fledged Linux environment but a large selection of packages from the repository. References: https://groups.google.com/forum/#!topic/google-appengine/hZMEkmm ObDU https://www.alpinelinux.org/about/"},{"id":142,"topic":"Altostrat Media Case Study","question":"You are using a single Cloud SQL instance to serve your application from a specific zone. You want to introduce high availability. What should you do?","options":{"A":"Create a read replica instance in a different region","B":"Create a failover replica instance in a different region","C":"Create a read replica instance in the same region, but in a different zone","D":"Create a failover replica instance in the same region, but in a different zone"},"answer":["B"],"explanation":"Explanation: https://cloud.google.com/sql/docs/mysql/high-availability"},{"id":143,"topic":"Altostrat Media Case Study","question":"Refer to the Altostrat Media case study for the following solutions regarding cost optimization for batch processing and microservices testing strategies. Altostrat is experiencing fluctuating computational demands for its batch processing jobs. These jobs are not time-critical and can tolerate occasional interruptions. You want to optimize cloud costs and address batch processing needs. What should you do?","options":{"A":"Configure reserved VM instances","B":"Deploy spot VM instances.","C":"Set up standard VM instances.","D":"Use Cloud Run functions."},"answer":["B"],"explanation":"Explanation: According to Google Cloud Compute Engine documentation , Spot VMs (formerly Preemptible VMs) are the most cost-effective choice for fault-tolerant, batch processing workloads. Since Altostrat's jobs are \" not time-critical \" and can \" tolerate occasional interruptions, \" Spot VMs offer a significant discount-typically 60-91% -compared to standard on-demand prices. The \" Reliability and cost management \" priority mentioned in the executive statement is directly addressed by utilizing the spare capacity that Spot VMs provide. While these instances can be reclaimed by Google Cloud at any time (preempted) with a 30-second notice, Altostrat's batch processing architecture (likely running on GKE or managed in stance groups) can automatically reschedule these tasks when capacity becomes available again. Option A (Reserved instances) requires a long-term commitment (1 or 3 years) and is better suited for predictable, constant workloads, not fluctuating batch jobs. Option C (Standard VMs) is unnecessarily expensive for workloads that do not require 100% uptime. Option D (Cloud Run functions) is excellent for event-driven, short-lived tasks but can become more expensive than Spot VMs for heavy, long-running batch computational demands. By leveraging Spot VMs, Altostrat achieves its goal of optimizing cloud storage and compute costs while maintaining the scalability required for its vast media library."},{"id":144,"topic":"Altostrat Media Case Study","question":"Your company ' s user-feedback portal comprises a standard LAMP stack replicated across two zones. It is deployed in the us-central1 region and uses autoscaled managed instance groups on all layers, except the database. Currently, only a small group of select customers have access to the portal. The portal meets a 99.99% availability SLA under these conditions However next quarter, your company will be making the portal available to all users, including unauthenticated users. You need to develop a resiliency testing strategy to ensure the system maintains the SLA once they introduce additional user load. What should you do?","options":{"A":"Capture existing users input, and replay captured user load until autoscale is triggered on all layers. At the same time, terminate all resources in one of the zones.","B":"Create synthetic random user input, replay synthetic load until autoscale logic is triggered on at least one layer, and introduce \" chaos \" to the system by terminating random resources on both zones.","C":"Expose the new system to a larger group of users, and increase group ' size each day until autoscale logic is tnggered on all layers. At the same time, terminate random resources on both zones.","D":"Capture existing users input, and replay captured user load until resource utilization crosses 80%. Also, derive estimated number of users based on existing users usage of the app, and deploy enough resources to handle 200% of expected load."},"answer":["A"],"explanation":""},{"id":145,"topic":"Altostrat Media Case Study","question":"You write a Python script to connect to Google BigQuery from a Google Compute Engine virtual machine. The script is printing errors that it cannot connect to BigQuery. What should you do to fix the script?","options":{"A":"Install the latest BigQuery API client library for Python","B":"Run your script on a new virtual machine with the BigQuery access scope enabled","C":"Create a new service account with BigQuery access and execute your script with that user","D":"Install the bq component for gccloud with the command gcloud components install bq."},"answer":["B"],"explanation":"Explanation: The error is most like caused by the access scope issue. When create new instance, you have the default Compute engine default service account but most serves access including BigQuery is not enable. Create an instance Most access are not enabled by default You have default service account but don ' t have the permission (scope) you can stop the instance, edit, change scope and restart it to enable the scope access. Of course, if you Run your script on a new virtual machine with the BigQuery access scope enabled, it also works https://cloud.google.com/compute/docs/access/service-accounts"},{"id":146,"topic":"Altostrat Media Case Study","question":"You are analyzing and defining business processes to support your startup's trial usage of GCP, and you don't yet know what consumer demand for your product will be. Your manager 81 requires you to minimize GCP service costs and adhere to Google best practices. What should you do?","options":{"A":"Utilize free tier and sustained use discounts. Provision a staff position for service cost management.","B":"Utilize free tier and sustained use discounts. Provide training to the team about service cost management.","C":"Utilize free tier and committed use discounts. Provision a staff position for service cost management.","D":"Utilize free tier and committed use discounts. Provide training to the team about service cost management."},"answer":["D"],"explanation":"Explanation: https://cloud.google.com/docs /enterprise/best-practices-for-enterprise-organizations#billing _and_management"},{"id":147,"topic":"Altostrat Media Case Study","question":"You are deploying a highly confidential data processing workload on Google Cloud. Your company ' s compliance framework mandates that cryptographic keys used for encrypting data at rest must be generated and stored exclusively within a validated Hardware Security Module (HSM). You want to use a fully integrated Google Cloud managed service to handle the lifecycle and usage of these keys. What should you do?","options":{"A":"Create a new key in Cloud Key Management Service (Cloud KMS) with the HSM protection level.","B":"Use Customer-Supplied Encryption Keys (CSEK) by providing your on-premises generated key with each API request.","C":"Configure Cloud External Key Manager (Cloud EKM) to connect to your on-premises HSM.","D":"Import your on-premises HSM key material into a Cloud KMS key with the SOFTWARE protection level."},"answer":["A"],"explanation":"Explanation: According to Cloud KMS documentation , the HSM protection level allows you to host encryption keys in a FIPS 140-2 Level 3 certified hardware security module managed by Google. This is the \" fully integrated managed service \" the requirement asks for. When you select the HSM protection level, the key material is generated within the HSM and never leaves the hardware boundary in plaintext. This fulfills the compliance mandate for HSM-based key storage while providing the ease of use of the Cloud KMS API. Option C (Cloud EKM) is used when you must keep the keys on-premises, which adds significant network latency and complexity. Option B (CSEK) places the burden of key management and availability on the customer, which is not a \" managed service \" for the key lifecycle. Option D is incorrect as it lowers the security posture to a software-based level, violating the HSM storage mandate."},{"id":148,"topic":"Altostrat Media Case Study","question":"You are a cloud architect for a financial services company that is migrating to Google Cloud. The company needs to create a multi-tenant landing zone for its business units and must adhere to strict regulatory compliance. The security team wants to use VPC Service Controls to create a zero- trust perimeter. However, the business wants you to accelerate the migration to quickly start developing new applications. How can you design a deployment and release management process to meet these competing requirements? 82","options":{"A":"Implement a centralized CI/CD pipeline that uses pre-approved Infrastructure as Code (IaC) templates. To maximize agility, allow business units to clone and modify these templates freely, and use a phased rollout for VPC Service Controls.","B":"Use a single CI/CD pipeline for all business units that deploys directly to a single, shared project. Rely on IAM permissions to isolate workloads within the project. Turn on VPC Service Controls perimeter for the production environment.","C":"Grant each business unit autonomy to create their own CI/CD pipelines and infrastructure, and conduct periodic security audits to ensure compliance with VPC Service Controls. Enforce IAM inheritance from the folder level.","D":"Establish a centralized CI/CD pipeline with automated policy and security validation at each stage.Define the VPC Service Controls perimeter in a \" dry run \" mode in the development environment to audit and test for violations. Turn on VPC Service Controls perimeter for the production environment."},"answer":["D"],"explanation":"Explanation: Designing a security landing zone for financial migrations requires balancing business agility with strict infrastructure perimeters. VPC Service Controls (VPC-SC) can inadvertently block legitimate service requests if misconfigured, causing application disruptions during migrations. To avoid these issues, Google Cloud recommends using the VPC-SC \" Dry Run \" mode feature. Dry Run mode allows security teams to configure perimeters and evaluate prospective violations against active workloads by logging telemetry to Cloud Logging without blocking actual API invocations. Embedding this validation into a centralized CI/CD pipeline ensures automated policy validation runs alongside application deployments. Developers can iterate quickly without experiencing perimeter blockages, while the architecture team gathers the data required to build a zero-trust perimeter before enforcing it in production. Granting unvalidated template access or omitting dry-run protections introduces severe risks of perimeter-induced application downtime. References: Cloud Architect (GCP) Study Guide topics: \" VPC Service Controls Dry Run Mode \" , \" Multi- Tenant Landing Zone Architecture \" , \" Automated Policy As Code \" , and \" Enterprise Release Management \"."},{"id":149,"topic":"Altostrat Media Case Study","question":"During a high traffic portion of the day, one of your relational databases crashes, but the replica is never promoted to a master. You want to avoid this in the future. What should you do?","options":{"A":"Use a different database.","B":"Choose larger instances for your database.","C":"Create snapshots of your database more regularly.","D":"Implement routinely scheduled failovers of your databases."},"answer":["D"],"explanation":"Explanation: https://cloud.google.com/solutions/dr-scenar ios-plann ing-guide"},{"id":150,"topic":"Altostrat Media Case Study","question":"Your company plans to migrate a multi-petabyte data set to the cloud. The data set must be available 24hrs a day. Your business analysts have experience only with using a SQL interface. How 83 should you store the data to optimize it for ease of analysis?","options":{"A":"Load data into Google BigQuery.","B":"Insert data into Google Cloud SQL.","C":"Put flat files into Google Cloud Storage.","D":"Stream data into Google Cloud Datastore."},"answer":["A"],"explanation":"Explanation: Google Big Query is for multi peta byte storage , HA(High availability) which means 24 hours, SQL interface . https://medium.com/google-cloud/the-12-components-of-google-bigquery-c2b49829a7c7 h ttps ://cloud.google.com/solutions/bigquery-data-warehouse https://cloud.google.com/bigquery/ BigQuery is Google ' s serverless, highly scalable, low cost enterprise data warehouse designed to make all your data analysts productive. Because there is no infrastructure to manage, you can focus on analyzing data to find meaningful insights using familiar SQL and you don ' t need a database administrator. BigQuery enables you to analyze all your data by creating a logical data warehouse over managed, columnar storage as well as data from object storage, and spreadsheets. References: https: //cloud.google.com/bigquery/"},{"id":151,"topic":"Altostrat Media Case Study","question":"Your company and one of its partners each nave a Google Cloud protect in separate organizations. Your company s protect (prj-a) runs in Virtual Private Cloud (vpc-a). The partner ' s project (prj-b) runs in vpc-b. There are two instances running on vpc-a and one instance running on vpc-b Subnets denned in both VPCs are not overlapping. You need to ensure that all instances communicate with each other via internal IPs minimizing latency and maximizing throughput. What should you do?","options":{"A":"Set up a network peering between vpc-a and vpc-b","B":"Set up a VPN between vpc-a and vpc-b using Cloud VPN","C":"Configure IAP TCP forwarding on the instance in vpc b and then launch the following gcloud command from one of the instance in vpc-gcloud: 1. Create an additional instance in vpc-a 2. Create an additional instance n vpc-b 3. Instal OpenVPN in newly created instances 4. Configure a VPN tunnel between vpc-a and vpc-b with the help of OpenVPN"},"answer":["C"],"explanation":""},{"id":152,"topic":"Altostrat Media Case Study","question":"You are setting up a new regional environment for your business needs. You plan to migrate more than 2 TB of data from the us-central1 region to the asia-southeast1 region. The transfer should occur as quickly as possible. If the transfer is interrupted, the operation must resume where it left off and copy only new or modified objects. What should you do?","options":{"A":"Utilize Storage Transfer Service (STS) to migrate objects to the destination bucket in the target region. Once the transfer is complete, delete the original source bucket objects.","B":"Use the gcloud storage rsync --recursive command to replicate the source bucket to a new target bucket in the us-west1 region.","C":"Use the gcloud storage cp command to copy the objects. Be careful to manage potential naming conflicts to ensure data integrity.","D":"Leverage Cloud Composer to orchestrate a data pipeline that copies objects from the source bucket to the destination bucket."},"answer":["A"],"explanation":"Explanation: According to Google Cloud Storage documentation , the Storage Transfer Service (STS) is the purpose- built tool for large-scale data movement between Cloud Storage buckets, especially across regions. STS is superior for this scenario for several reasons. First, it is a fully managed service that operates on Google's backbone, providing much higher throughput and reliability than a client-side command like gcloud storage cp (Option C). Second, STS inherently supports incremental transfers and checkpointing . If a transfer job is interrupted, it automatically resumes and only transfers objects that haven ' t been successfully copied or have been modified since the last run, satisfying the specific requirement of the prompt. While gcloud storage rsync (Option B) provides similar synchronization logic, it runs on the user ' s local machine or a specific VM, making it subject to the performance and stability of that single instance. STS, being a managed service, scales out resources to handle 2 TB+ transfers \" as quickly as possible. \" Option D (Cloud Composer) adds unnecessary complexity and cost for a task that is natively handled by STS. Option A provides the most robust, performant, and automated path for regional data migration."},{"id":153,"topic":"Altostrat Media Case Study","question":"Your company has just acquired another company, and you have been asked to integrate their existing Google Cloud environment into your company's data center. Upon investigation, you discover that some of the RFC 1918 IP ranges being used in the new company's Virtual Private Cloud (VPC) overlap with your data center IP space. What should you do to enable connectivity and make sure that there are no routing conflicts when connectivity is established?","options":{"A":"Create a Cloud VPN connection from the new VPC to the data center, create a Cloud Router, and apply new IP addresses so there is no overlapping IP space.","B":"Create a Cloud VPN connection from the new VPC to the data center, and create a Cloud NAT instance to perform NAT on the overlapping IP space.","C":"Create a Cloud VPN connection from the new VPC to the data center, create a Cloud Router, and apply a custom route advertisement to block the overlapping IP space.","D":"Create a Cloud VPN connection from the new VPC to the data center, and apply a firewall rule that blocks the overlapping IP space."},"answer":["A"],"explanation":"Explanation: To connect two networks together we need (1) either VPN or interconnect and (2) peering. When there is peering, you cannot have conflicting IP addresses. You can use either Cloud VPN or Cloud Interconnect to securely connect your on-premises network to your VPC network. (https://cloud.google.com/vpc/docs/vpc- peering#transit-network) At the time of peering, Google Cloud checks to see if there are any subnet IP ranges that overlap subnet IP ranges in the other network. If there is any overlap, peering is not established. (https://cloud.google.com/vpc/docs/vpc-peering#considerations) NAT is used to translate private to public IP and vice versa, however because we are connecting 2 networks together, they become private IPs. So it is not applicable."},{"id":154,"topic":"Altostrat Media Case Study","question":"Your company is planning to perform a lift and shift migration of their Linux RHEL 6.5+ virtual machines. The virtual machines are running in an on-premises VMware environment. You want to migrate them to Compute Engine following Google-recommended practices. What should you do?","options":{"A":"1. Define a migration plan based on the list of the applications and their dependencies. 2. Migrate all virtual machines into Compute Engine individually with Migrate for Compute Engine.","B":"1. Perform an assessment of virtual machines running in the current VMware environment. 2. Create images of all disks. Import disks on Compute Engine. 3. Create standard virtual machines where the boot disks are the ones you have imported.","C":"1. Perform an assessment of virtual machines running in the current VMware environment. 2. Define a migration plan, prepare a Migrate for Compute Engine migration RunBook, and execute the migration.","D":"1. Perform an assessment of virtual machines running in the current VMware environment. 2. Install a third-party agent on all selected virtual machines. 3. Migrate all virtual machines into Compute Engine."},"answer":["C"],"explanation":"Explanation: The framework illustrated in the preceding diagram has four phases: * Assess. In this phase, you assess your source environment, assess the workloads that you want to migrate to Google Cloud, and assess which VMs support each workload. * Plan. In this phase, you create the basic infrastructure for Migrate for Compute Engine, such as provisioning the resource hierarchy and setting up network access. * Deploy. In this phase, you migrate the VMs from the source environment to Compute Engine. * Optimize. In this phase, you begin to take advantage of the cloud technologies and capabilities. Reference: https://cloud.google.com/architecture/migrating-vms-migrate-for-compute-engine- getting-started"},{"id":155,"topic":"Altostrat Media Case Study","question":"Your customer is moving an existing corporate application to Google Cloud Platform from an on-premises data center. The business owners require minimal user disruption. There are strict security team requirements for storing passwords. What authentication strategy should they use?","options":{"A":"Use G Suite Password Sync to replicate passwords into Google.","B":"Federate authentication via SAML 2.0 to the existing Identity Provider.","C":"Provision users in Google using the Google Cloud Directory Sync tool.","D":"Ask users to set their Google password to match their corporate password."},"answer":["B"],"explanation":"Explanation: https://cloud.google.com/solutions/authenticating-corporate-users-in-a-hybrid-environment"},{"id":156,"topic":"Altostrat Media Case Study","question":"Your company is designing its data lake on Google Cloud and wants to develop different ingestion pipelines to collect unstructured data from different sources. After the data is stored in Google Cloud, it will be processed in several data pipelines to build a recommendation engine for end users on the website. The structure of the data retrieved from the source systems can change at any 86 time. The data must be stored exactly as it was retrieved for reprocessing purposes in case the data structure is incompatible with the current processing pipelines. You need to design an architecture to support the use case after you retrieve the data. What should you do?","options":{"A":"Send the data through the processing pipeline, and then store the processed data in a BigQuery table for reprocessing.","B":"Store the data in a BigQuery table. Design the processing pipelines to retrieve the data from the table.","C":"Send the data through the processing pipeline, and then store the processed data in a Cloud Storage bucket for reprocessing.","D":"Store the data in a Cloud Storage bucket. Design the processing pipelines to retrieve the data from the bucket"},"answer":["D"],"explanation":""},{"id":157,"topic":"Altostrat Media Case Study","question":"Your team will start developing a new application using microservices architecture on Kubernetes Engine. As part of the development lifecycle, any code change that has been pushed to the remote develop branch on your GitHub repository should be built and tested automatically. When the build and test are successful, the relevant microservice will be deployed automatically in the development environment. You want to ensure that all code deployed in the development environment follows this process. What should you do?","options":{"A":"Have each developer install a pre-commit hook on their workstation that tests the code and builds the container when committing on the development branch. After a successful commit, have the developer deploy the newly built container image on the development cluster.","B":"Install a post-commit hook on the remote git repository that tests the code and builds the container when code is pushed to the development branch. After a successful commit, have the developer deploy the newly built container image on the development cluster.","C":"Create a Cloud Build trigger based on the development branch that tests the code, builds the container, and stores it in Container Registry. Create a deployment pipeline that watches for new images and deploys the new image on the development cluster. Ensure only the deployment tool has access to deploy new versions.","D":"Create a Cloud Build trigger based on the development branch to build a new container image and store it in Container Registry. Rely on Vulnerability Scanning to ensure the code tests succeed. As the final step of the Cloud Build process, deploy the new container image on the development cluster. Ensure only Cloud Build has access to deploy new versions."},"answer":["C"],"explanation":"Explanation: https://cloud.google.com/container-registry/docs/overview Create a Cloud Build trigger based on the development branch that tests the code, builds the container, and stores it in Container Registry. Create a deployment pipeline that watches for new images and deploys the new image on the development cluster. Ensure only the deployment tool has access to deploy new versions."},{"id":158,"topic":"Altostrat Media Case Study","question":"You are developing a globally scaled frontend for a legacy streaming backend data API. This API expects events in strict chronological order with no repeat data for proper processing. Which products should you deploy to ensure guaranteed-once FIFO (first-in, first-out) delivery of 87 data?","options":{"A":"Cloud Pub/Sub alone","B":"Cloud Pub/Sub to Cloud DataFlow","C":"Cloud Pub/Sub to Stackdriver","D":"Cloud Pub/Sub to Cloud SQL"},"answer":["B"],"explanation":"Explanation: Reference https://cloud.google.com/pubsub/docs/ordering"},{"id":159,"topic":"Altostrat Media Case Study","question":"You are designing an application for use only during business hours. For the minimum viable product release, you'd like to use a managed product that automatically \"scales to zero\" so you don't incur costs when there is no activity. Which primary compute resource should you choose?","options":{"A":"Cloud Functions","B":"Compute Engine","C":"Kubernetes Engine","D":"AppEngine flexible environment"},"answer":["A"],"explanation":"Explanation: http s://cloud.google.com/serverless-options"},{"id":160,"topic":"Altostrat Media Case Study","question":"You set up an autoscaling instance group to serve web traffic for an upcoming launch. After configuring the instance group as a backend service to an HTTP(S) load balancer, you notice that virtual machine (VM) instances are being terminated and re-launched every minute. The instances do not have a public IP address. You have verified the appropriate web response is coming from each instance using the curl command. You want to ensure the backend is configured correctly. What should you do?","options":{"A":"Ensure that a firewall rule exists to allow source traffic on HTTP/HTTPS to reach the load balancer.","B":"Assign a public IP to each instance and configure a firewall rule to allow the load balancer to reach the instance public IP.","C":"Ensure that a firewall rule exists to allow load balancer health checks to reach the instances in the instance group.","D":"Create a tag on each instance with the name of the load balancer. Configure a firewall rule with the name of the load balancer as the source and the instance tag as the destination."},"answer":["C"],"explanation":"Explanation: https://cloud.google.com/vpc/docs/using- firewalls The best practice when configuration a health check is to check health and serve traffic on the same port. However, it is possible to perform health checks on one port, but serve traffic on another. If you do use two different ports, ensure that firewall rules and services running on instances are configured appropriately. If you run health checks and serve traffic on the same port, but decide to switch ports at some point, be sure to update both the backend service and the health check. Backend services that do not have a valid global forwarding rule referencing it will not be health checked and will have no health status. References: https:// cloud.google.com/compu te/docs/load-balancing/http/backend-service"},{"id":161,"topic":"Altostrat Media Case Study","question":"You have deployed several instances on Compute Engine. As a security requirement, instances cannot have a public IP address. There is no VPN connection between Google Cloud and your office, and you need to connect via SSH into a specific machine without violating the security requirements. What should you do?","options":{"A":"Configure Cloud NAT on the subnet where the instance is hosted. Create an SSH connection to the Cloud NAT IP address to reach the instance.","B":"Add all instances to an unmanaged instance group. Configure TCP Proxy Load Balancing with the instance group as a backend. Connect to the instance using the TCP Proxy IP.","C":"Configure Identity-Aware Proxy (IAP) for the instance and ensure that you have the role of IAP- secured Tunnel User. Use the gcloud command line tool to ssh into the instance.","D":"Create a bastion host in the network to SSH into the bastion host from your office location. From the bastion host, SSH into the desired instance."},"answer":["C"],"explanation":"Explanation: https://cloud.google.com/iap/docs/using-tcp-forward ing#tunneling_with_ssh Leveraging the BeyondCorp security model. \" This January, we enhanced context-aware access capabilities in Cloud Identity-Aware Proxy (IAP) to help you protect SSH and RDP access to your virtual machines (VMs)- without needing to provide your VMs with public IP addresses, and without having to set up bastion hosts. \" https://cloud. google.com/blog/products/identity-security/cloud-iap-enables-context-aware-access- to-vms-via-ssh-and-rdp-without-bastion-hosts Reference: https://cloud.google.com/solutions/connecting-securely"},{"id":162,"topic":"Altostrat Media Case Study","question":"Your company recently acquired a company that has infrastructure in Google Cloud. Each company has its own Google Cloud organization Each company is using a Shared Virtual Private Cloud (VPC) to provide network connectivity tor its applications Some of the subnets used by both companies overlap In order for both businesses to integrate, the applications need to have private network connectivity. These applications are not on overlapping subnets. You want to provide connectivity with minimal re-engineering. What should you do?","options":{"A":"Set up VPC peering and peer each Shared VPC together","B":"Configure SSH port forwarding on each application to provide connectivity between applications i the different Shared VPCs","C":"Migrate the protects from the acquired company into your company ' s Google Cloud organization Re launch the instances in your companies Shared VPC","D":"Set up a Cloud VPN gateway in each Shared VPC and peer Cloud VPNs"},"answer":["D"],"explanation":""},{"id":163,"topic":"Altostrat Media Case Study","question":"A development manager is building a new application He asks you to review his requirements and identify what cloud technologies he can use to meet them. The application must 1. Be based on open-source technology for cloud portability 2. Dynamically scale compute capacity based on demand 3. Support continuous software delivery 89 4. Run multiple segregated copies of the same application stack 5. Deploy application bundles using dynamic templates 6. Route network traffic to specific services based on URL Which combination of technologies will meet all of his requirements?","options":{"A":"Google Container Engine, Jenkins, and Helm","B":"Google Container Engine and Cloud Load Balancing","C":"Google Compute Engine and Cloud Deployment Manager","D":"Google Compute Engine, Jenkins, and Cloud Load Balancing"},"answer":["A"],"explanation":"Explanation: Helm for managing Kubernetes Kubernetes can base on the URL to route traffic to different location (path) https://cloud.google.com/kubernetes-engine/docs/tutorials/http-balancer eg.apiVersion: networking.k8s.io/v1beta1 kind: Ingress metadata: name: fanout-ingress spec: rules: - http: paths: - path: /* backend: serviceName: web servicePort: 8080 - path: /v2/* backend: serviceName: web2 servicePort: 8080"},{"id":164,"topic":"Altostrat Media Case Study","question":"You are responsible for the Google Cloud environment in your company Multiple departments need access to their own projects and the members within each department will have the same project responsibilities You want to structure your Google Cloud environment for minimal maintenance and maximum overview of 1AM permissions as each department ' s projects start and end You want to follow Google-recommended practices What should you do?","options":{"A":"Create a Google Group per department and add all department members to their respective groups Create a folder per department and grant the respective group the required 1AM permissions at the folder level Add the projects under the respective folders","B":"Grant all department members the required 1AM permissions for their respective projects","C":"Create a Google Group per department and add all department members to their respective groups Grant each group the required I AM permissions for their respective projects","D":"Create a folder per department and grant the respective members of the department the required 1AM permissions at the folder level. Structure all projects for each department under the respective folders"},"answer":["C"],"explanation":"Explanation: This option follows the Google-recommended practices for structuring a Google Cloud environment for minimal maintenance and maximum overview of IAM permissions. By creating a Google Group per department and adding all department members to their respective groups, you can simplify user management and avoid granting IAM permissions to individual users. By creating a folder per department and granting the respective group the required IAM permissions at the folder level, you can enforce consistent policies across all projects within each department and avoid granting IAM permissions at the project level. By adding the projects under the respective folders, you can organize your resources hierarchically and leverage inheritance of IAM policies from folders to projects. The other options are not optimal for this scenario, because they either require granting IAM permissions to individual users (B, C), or do not use Google Groups to manage users (D). References: * https://cloud.google.com/architecture/framework/system-design * https://cloud.google.com/architecture/identity/best-practices-for-planning * https://cloud.google.com/resource-manager/docs/creating-managing-folders"},{"id":165,"topic":"Altostrat Media Case Study","question":"Your company wants to track whether someone is present in a meeting room reserved for a scheduled meeting. There are 1000 meeting rooms across 5 offices on 3 continents. Each room is equipped with a motion sensor that reports its status every second. The data from the motion detector includes only a sensor ID and several different discrete items of information. Analysts will use this data, together with information about account owners and office locations. Which database type should you use?","options":{"A":"Flat file","B":"NoSQL","C":"Relational","D":"Blobstore"},"answer":["B"],"explanation":"Explanation: Relational databases were not designed to cope with the scale and agility challenges that face modern applications, nor were they built to take advantage of the commodity storage and processing power available today. NoSQL fits well for: Developers are working with applications that create massive volumes of new, rapidly changing data types - structured, semi-structured, unstructured and polymorphic data. References: https://www.mongodb.com/no sql-explain ed"},{"id":166,"topic":"Altostrat Media Case Study","question":"You are a cloud architect for a financial services organization that is migrating its environment to Google Cloud. A new developer on your team needs to quickly inspect the metadata of a Compute Engine instance to troubleshoot a configuration issue, but they do not have the Google Cloud SDK installed on their local workstation. You need to provide a quick and effective solution that allows them to run gcloud commands directly from their browser. What should you do?","options":{"A":"Instruct the developer to install Cloud Code in their local integrated development environment (IDE).","B":"Tell the developer to provision a Cloud Workstation and use its terminal to run the commands.","C":"Guide the developer to download and install the Google Cloud SDK on their workstation.","D":"Advise the developer to use the Cloud Shell Terminal."},"answer":["D"],"explanation":"Explanation: The Google Cloud Console provides Cloud Shell as an embedded, browser-accessible terminal environment that removes local machine installation overhead. Cloud Shell comes pre-provisioned with the Google Cloud SDK (gcloud CLI), command-line tools, and pre-authenticated context based on the user ' s active console session. This fulfills the strict requirement to quickly run management operations directly from a web browser without executing local software installers or modifying the workstation. While Cloud Workstations offers a fully managed development environment in the cloud, provisioning an entirely new instance introduces unnecessary infrastructure provisioning delays and operational complexity for a simple metadata inspection task. Installing Cloud Code or downloading the SDK locally directly violates the constraints of avoiding local workstation modifications. Cloud Shell provides a temporary compute instance backed by an ephemeral container, making it the most immediate, frictionless utility for running ad- hoc operations. References: Cloud Architect (GCP) Study Guide topics: \" Google Cloud Management Tools \" , \" Cloud Shell Utilities and Ephemeral Storage \" , and \" Interacting with Compute Engine Metadata via gcloud \" ."},{"id":167,"topic":"Altostrat Media Case Study","question":"You are architecting a new application feature for a healthcare provider based in Qatar. The feature needs to summarize sensitive patient notes that are submitted by clinicians. A critical requirement is that the content of these patient notes must never be processed outside of Qatar ' s borders. You want to use a powerful, pre- trained generative model for the summarization task while strictly adhering to the data residency constraint. What should you do?","options":{"A":"Use the Cloud Natural Language API to analyze the text and configure it to generate a summary of the patient notes.","B":"Gather a large, anonymized dataset of medical notes. Use Gemini Enterprise Agent Platform Managed Training to train a custom summarization model from scratch, deploying it in a Qatar region.","C":"Use Gemini Enterprise Agent Platform Model Garden to select a Gemma model. Deploy this model to a Gemini Enterprise Agent Platform Endpoint within a Google Cloud region located in Qatar.","D":"Write application code that sends the patient notes explicitly to the Gemini API endpoint in Qatar for summarization. Protect the API by VPC Service Controls."},"answer":["C"],"explanation":"Explanation: Strict geographical data residency rules require data to be processed locally within a specific country ' s jurisdiction. Standard cloud-hosted, multi-tenant foundation models (such as the primary Gemini API endpoints) often routes requests across global data centers, which violates data sovereignty boundaries if a regional endpoint is unavailable. To enforce absolute data isolation within Qatar, the architecture must utilize a local runtime model deployment. Gemma models are lightweight, open foundation models built from the same research and technology used to create the Gemini models. By selecting a pre-trained Gemma model from Model Garden and deploying it to a dedicated Vertex AI (Gemini Enterprise Agent Platform) Endpoint running inside a Google Cloud data center physically located within Qatar, the clinician text stays completely contained inside local infrastructure. This satisfies data residency requirements without needing to train a custom model from scratch. References: Cloud Architect (GCP) Study Guide topics: \" Vertex AI Model Garden and Custom Endpoints \" , \" Gemma Open Models Deployment \" , \" Data Sovereignty and Governance \" , and \" AI Infrastructure Data Residency \" ."},{"id":168,"topic":"Altostrat Media Case Study","question":"You are working at a financial institution that stores mortgage loan approval documents on Cloud Storage. Any change to these approval documents must be uploaded as a separate approval file, so you want to ensure that these documents cannot be deleted or overwritten for the next 5 years. What should you do?","options":{"A":"Create a retention policy on the bucket for the duration of 5 years. Create a lock on the retention policy.","B":"Create the bucket with uniform bucket-level access, and grant a service account the role of Object Writer. Use the service account to upload new files.","C":"Use a customer-managed key for the encryption of the bucket. Rotate the key after 5 years.","D":"Create the bucket with fine-grained access control, and grant a service account the role of Object Writer. Use the service account to upload new files."},"answer":["A"],"explanation":"Reference: https://cloud.google.com/storage/docs/using-bucket-lock"},{"id":169,"topic":"Altostrat Media Case Study","question":"A small number of API requests to your microservices-based application take a very long time. You know that each request to the API can traverse many services. You want to know which service takes the longest in those cases. What should you do?","options":{"A":"Set timeouts on your application so that you can fail requests faster.","B":"Send custom metrics for each of your requests to Stackdriver Monitoring.","C":"Use Stackdriver Monitoring to look for insights that show when your API latencies are high.","D":"Instrument your application with Stackdnver Trace in order to break down the request latencies at each microservice."},"answer":["D"],"explanation":"Explanation: https://cloud.google.com/trace/docs/overview"},{"id":170,"topic":"Altostrat Media Case Study","question":"A large healthcare provider ' s primary electronic health record (EHR) application runs on Compute Engine instances with a Cloud SQL for PostgreSQL database, all located in the us-west1 region. A new regulatory mandate requires you to implement and document a business continuity plan (BCP). This plan must ensure that the EHR application can be fully recovered and operational in a different geographical region with a recovery time objective (RTO) of two hours and a recovery point objective (RPO) of 15 minutes. You need to design a disaster recovery strategy that meets these strict BCP requirements. What should you do?","options":{"A":"Deploy active managed instance groups (MIGs) in both us-west1 and us-east1, fronted by a global external HTTP(S) Load Balancer. For the database, use a cross-region read replica in us-east1, and rely on load balancer health checks to automatically fail over all traffic during an outage.","B":"Use Terraform to define the application ' s compute infrastructure. During a disaster, configure the Cloud SQL database in us-west1 to use a cross-region read replica in us-east1, build the environment in us-east1, and promote the replica.","C":"Take daily snapshots of the Compute Engine disks and Cloud SQL database. Copy these snapshots to a Cloud Storage bucket in us-east1. During a disaster, manually restore the virtual machines (VMs) and database from the latest snapshots.","D":"Deploy a regional MIG in us-west1 for high availability, and rely on the Google Cloud SLA to ensure the region remains online."},"answer":["A"],"explanation":"Explanation: To meet a strict Recovery Time Objective (RTO) of 2 hours and a Recovery Point Objective (RPO) of 15 minutes, a \" Warm Standby \" or \" Active-Active \" architecture is required. According to Google Cloud ' s Disaster Recovery Planning Guide , relying on manual restores from snapshots (Option C) or building infrastructure from scratch (Option B) often exceeds these timeframes due to the duration of data transfer and VM boot times. Option A leverages a Global External HTTP(S) Load Balancer , which provides a single anycast IP address and can automatically route traffic to the healthy Managed Instance Group (MIG) in us-east1 if the us-west1 backend becomes unresponsive. For the data layer, Cloud SQL Cross-Region Read Replicas provide asynchronous replication. This setup ensures that the RPO is typically measured in seconds (well within the 15-minute requirement). In the event of a regional failure, an administrator promotes the read replica in us-east1 to a primary standalone instance. Because the application servers in us-east1 are already deployed and \" active \" (warm), the time to redirect traffic and promote the database fits comfortably within the 2-hour RTO. This design provides the highest level of continuity and reliability for sensitive healthcare applications."},{"id":171,"topic":"Altostrat Media Case Study","question":"A lead engineer wrote a custom tool that deploys virtual machines in the legacy data center. He wants to migrate the custom tool to the new cloud environment You want to advocate for the adoption of Google Cloud Deployment Manager What are two business risks of migrating to Cloud Deployment Manager? Choose 2 answers","options":{"A":"Cloud Deployment Manager uses Python.","B":"Cloud Deployment Manager APIs could be deprecated in the future.","C":"Cloud Deployment Manager is unfamiliar to the company ' s engineers.","D":"Cloud Deployment Manager requires a Google APIs service account to run.","E":"Cloud Deployment Manager can be used to permanently delete cloud resources.","F":"Cloud Deployment Manager only supports automation of Google Cloud resources."},"answer":["C","F"],"explanation":"Explanation: https://cloud.google.com/deployment-manager/docs/deplo yments/deleting-deployments"},{"id":172,"topic":"Altostrat Media Case Study","question":"You are developing your microservices application on Google Kubernetes Engine. During testing, you want to validate the behavior of your application in case a specific microservice should suddenly crash. What should you do?","options":{"A":"Add a taint to one of the nodes of the Kubernetes cluster. For the specific microservice, configure a pod anti-affinity label that has the name of the tainted node as a value.","B":"Use Istio's fault injection on the particular microservice whose faulty behavior you want to simulate.","C":"Destroy one of the nodes of the Kubernetes cluster to observe the behavior.","D":"Configure Istio's traffic management features to steer the traffic away from a crashing microservice."},"answer":["B"],"explanation":"Explanation: Microservice runs on all nodes. The Micro service runs on Pod, Pod runs on Nodes. Nodes is nothing but Virtual machines. Once deployed the application microservices will get deployed across all Nodes . Destroying one node may not mimic the behaviour of microservice crashing as it may be running in other nodes. link: https://istio.io/latest/docs/tasks/traffic-management/fault-injection/ "},{"id":173,"topic":"Altostrat Media Case Study","question":"Your company is building a new architecture to support its data-centric business focus. You are responsible for setting up the network. Your company's mobile and web-facing applications will be deployed on- premises, and all data analysis will be conducted in GCP. The plan is to process and load 7 years of archived . csv files totaling 900 TB of data and then continue loading 10 TB of data daily. You currently have an existing 100-MB internet connection. What actions will meet your company's needs?","options":{"A":"Compress and upload both achieved files and files uploaded daily using the qsutil -m option.","B":"Lease a Transfer Appliance, upload archived files to it, and send it, and send it to Google to transfer archived data to Cloud Storage. Establish a connection with Google using a Dedicated Interconnect or Direct Peering connection and use it to upload files daily.","C":"Lease a Transfer Appliance, upload archived files to it, and send it, and send it to Google to transfer archived data to Cloud Storage. Establish one Cloud VPN Tunnel to VPC networks over the public internet, and compares and upload files daily using the gsutil -m option.","D":"Lease a Transfer Appliance, upload archived files to it, and send it to Google to transfer archived data to Cloud Storage. Establish a Cloud VPN Tunnel to VPC networks over the public internet, and compress and upload files daily."},"answer":["B"],"explanation":"Explanation: https://cloud.google.com/interconnect/docs/how-to/direct-peering"},{"id":174,"topic":"Altostrat Media Case Study","question":"Your company has a stateless web API that performs scientific calculations. The web API runs on a single Google Kubernetes Engine (GKE) cluster. The cluster is currently deployed in us- central1. Your company has expanded to offer your API to customers in Asia. You want to reduce the latency for the users in Asia. What should you do?","options":{"A":"Use a global HTTP(s) load balancer with Cloud CDN enabled","B":"Create a second GKE cluster in asia-southeast1, and expose both API's using a Service of type Load Balancer. Add the public Ips to the Cloud DNS zone","C":"Increase the memory and CPU allocated to the application in the cluster","D":"Create a second GKE cluster in asia-southeast1, and use kubemci to create a global HTTP(s) load balancer"},"answer":["D"],"explanation":"Explanation: https://cloud.google.com/kubernetes-engine/docs/concepts/multi-cluster-ingress#how_works https://github.com/GoogleCloudPlatform/k8s-multicluster-ingress https://cloud.google.com/blog/produ cts/gcp/how-to-deploy-geographically-distributed-services-on- kubernetes-engine-with-kubemci"},{"id":175,"topic":"Altostrat Media Case Study","question":"You have a Python web application with many dependencies that requires 0.1 CPU cores and 128 MB of memory to operate in production. You want to monitor and maximize machine utilization. You also to reliably deploy new versions of the application. Which set of steps should you take?","options":{"A":"Perform the following: 1) Create a managed instance group with f1-micro type machines. 2) Use a startup script to clone the repository, check out the production branch, install the dependencies, and start the Python app. 3) Restart the instances to automatically deploy new production releases.","B":"Perform the following: 1) Create a managed instance group with n1-standard-1 type machines. 2) Build a Compute Engine image from the production branch that contains all of the dependencies and automatically starts the Python app. 3) Rebuild the Compute Engine image, and update the instance template to deploy new production releases.","C":"Perform the following: 1) Create a Kubernetes Engine cluster with n1-standard-1 type machines. 2) Build a Docker image from the production branch with all of the dependencies, and tag it with the version number. 3) Create a Kubernetes Deployment with the imagePullPolicy set to \"IfNotPresent\" in the staging namespace, and then promote it to the production namespace after testing.","D":"Perform the following: 1) Create a Kubernetes Engine (GKE) cluster with n1-standard-4 type machines. 2) Build a Docker image from the master branch will all of the dependencies, and tag it with \"latest\". 3) Create a Kubernetes Deployment in the default namespace with the imagePullPolicy set to \"Always\".Restart the pods to automatically deploy new production releases."},"answer":["D"],"explanation":"Explanation: https://cloud.google.com/compute/docs/instance-templates"},{"id":176,"topic":"Altostrat Media Case Study","question":"Your company has multiple on-premises systems that serve as sources for reporting. The data has not been maintained well and has become degraded over time. You want to use Google- recommended practices to detect anomalies in your company data. What should you do?","options":{"A":"Upload your files into Cloud Storage. Use Cloud Datalab to explore and clean your data.","B":"Upload your files into Cloud Storage. Use Cloud Dataprep to explore and clean your data.","C":"Connect Cloud Datalab to your on-premises systems. Use Cloud Datalab to explore and clean your data.","D":"Connect Cloud Dataprep to your on-premises systems. Use Cloud Dataprep to explore and clean your data."},"answer":["B"],"explanation":"Explanation: https://cloud.google.com/dataprep/"},{"id":177,"topic":"Altostrat Media Case Study","question":"Your company has an application that is running on multiple instances of Compute Engine. It generates 1 TB per day of logs. For compliance reasons, the logs need to be kept for at least two years. The logs need to be available for active query for 30 days. After that, they just need to be retained for audit purposes. You want to implement a storage solution that is compliant, minimizes costs, and follows Google-recommended practices. What should you do?","options":{"A":"1. Install the Cloud Ops agent on all instances. 2. Create a sink to export logs into a partitioned BigQuery table. 3. Set a time_partitioning_expiration of 30 days.","B":"1. Install the Cloud Ops agent on all instances. 2. Create a sink to export logs into a regional Cloud Storage bucket. 3. Create an Object Lifecycle rule to move files into a Coldline Cloud Storage bucket after one month. 4. Configure a retention policy at the bucket level to create a lock.","C":"1. Create a daily cron job, running on all instances, that uploads logs into a partitioned BigQuery table. 2. Set a time_partitioning_expiration of 30 days.","D":"1. Write a daily cron job, running on all instances, that uploads logs into a Cloud Storage bucket. 2. Create a sink to export logs into a regional Cloud Storage bucket. 3. Create an Object Lifecycle rule to move files into a Coldline Cloud Storage bucket after one month."},"answer":["B"],"explanation":"Explanation: The practice for managing logs generated on Compute Engine on Google Cloud is to install the Cloud Logging agent and send them to Cloud Logging. The sent logs will be aggregated into a Cloud Logging sink and exported to Cloud Storage. The reason for using Cloud Storage as the destination for the logs is that the requirement in question requires setting up a lifecycle based on the storage period. In this case, the log will be used for active queries for 30 days after it is saved, but after that, it needs to be stored for a longer period of time for auditing purposes. If the data is to be used for active queries, we can use BigQuery ' s Cloud Storage data query feature and move the data past 30 days to Coldline to build a cost-optimal solution. Therefore, the correct answer is as follows 1. Install the Cloud Logging agent on all instances. Create a sync that exports the logs to the region ' s Cloud Storage bucket. 3. Create an Object Lifecycle rule to move the files to the Coldline Cloud Storage bucket after one month. 4. 4. set up a bucket-level retention policy using bucket locking. \""},{"id":178,"topic":"Altostrat Media Case Study","question":"Your organization has decided to restrict the use of external IP addresses on instances to only approved instances. You want to enforce this requirement across all of your Virtual Private Clouds (VPCs). What should you do?","options":{"A":"Remove the default route on all VPCs. Move all approved instances into a new subnet that has a default route to an internet gateway.","B":"Create a new VPC in custom mode. Create a new subnet for the approved instances, and set a default route to the internet gateway on this new subnet.","C":"Implement a Cloud NAT solution to remove the need for external IP addresses entirely.","D":"Set an Organization Policy with a constraint on constraints/compute.vmExternalIpAccess. List the approved instances in the allowedValues list."},"answer":["D"],"explanation":"Reference: https://cloud.google.com/compute/docs/ip-addresses/reserve-static-external-ip-address https://cloud.google.com/compute/docs/ ip-addresses/reserve-static-external-ip- address#disableexternalip you might want to restrict external IP address so that only specific VM instances can use them. This option can help to prevent data exfiltration or maintain network isolation. Using an Organization Policy, you can restrict external IP addresses to specific VM instances with constraints to control use of external IP addresses for your VM instances within an organization or a project."},{"id":179,"topic":"Altostrat Media Case Study","question":"You are planning to migrate your on-premises compute and SAP workloads to Google Cloud. You want to follow Google-recommended practices to quickly create a cost estimate for running these workloads in Google Cloud. What should you do?","options":{"A":"Leverage Cloud Asset Inventory to gather data and generate a cost estimate.","B":"Engage with a Google Cloud partner to perform a comprehensive assessment and provide a customized cost estimate.","C":"Use the Google Cloud pricing calculator, and input the estimated resource to generate a cost estimate","D":"Gather data about your current environment, and leverage Google Cloud Migration Center to generate a cost estimate"},"answer":["D"],"explanation":"Explanation: Migrating enterprise workloads like SAP requires a more nuanced approach than a simple virtual machine estimate. Google Cloud now recommends Migration Center (Option D) as the unified platform for assessment and planning. * Google-Recommended Practice: Migration Center is specifically designed to handle discovery and estimation. It features a specialized SAP-specific calculator that understands SAP-certified machine types, high-memory requirements, and licensing considerations. * Efficiency: Unlike the manual Pricing Calculator (Option C), which requires you to know every technical detail (vCPU, RAM, Disk type) beforehand, Migration Center allows you to import data from your current environment or use \" rapid \" estimation templates based on your workload size (Small, Medium, Large). * Why not B? While a partner assessment is comprehensive, the question asks for a way to quickly create an estimate following Google ' s own tools and practices. Migration Center is the automated, first- party path to achieving this."},{"id":180,"topic":"Altostrat Media Case Study","question":"You are developing an application using different microservices that should remain internal to the cluster. You want to be able to configure each microservice with a specific number of replicas. You also want to be able to address a specific microservice from any other microservice in a uniform way, regardless of the number of replicas the microservice scales to. You need to implement this solution on Google Kubernetes Engine. What should you do?","options":{"A":"Deploy each microservice as a Deployment. Expose the Deployment in the cluster using a Service, and use the Service DNS name to address it from other microservices within the cluster.","B":"Deploy each microservice as a Deployment. Expose the Deployment in the cluster using an Ingress, and use the Ingress IP address to address the Deployment from other microservices wit
