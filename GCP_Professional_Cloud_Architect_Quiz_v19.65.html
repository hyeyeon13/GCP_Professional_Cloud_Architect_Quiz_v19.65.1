hin the cluster.","C":"Deploy each microservice as a Pod. Expose the Pod in the cluster using a Service, and use the Service DNS name to address the microservice from other microservices within the cluster.","D":"Deploy each microservice as a Pod. Expose the Pod in the cluster using an Ingress, and use the Ingress IP address name to address the Pod from other microservices within the cluster."},"answer":["A"],"explanation":"Explanation: https://kubernetes.io/docs/concepts/services-networking/ingress /"},{"id":181,"topic":"Altostrat Media Case Study","question":"You have deployed an application to Kubernetes Engine, and are using the Cloud SQL proxy container to make the Cloud SQL database available to the services running on Kubernetes. You are notified that the application is reporting database connection issues. Your company policies require a post-mortem. What should you do?","options":{"A":"Use gcloud sql instances restart.","B":"Validate that the Service Account used by the Cloud SQL proxy container still has the Cloud Build Editor role.","C":"In the GCP Console, navigate to Stackdriver Logging. Consult logs for Kubernetes Engine and Cloud SQL.","D":"In the GCP Console, navigate to Cloud SQL. Restore the latest backup. Use kubect1 to restart all pods."},"answer":["C"],"explanation":""},{"id":182,"topic":"Altostrat Media Case Study","question":"Your company is designing its application landscape on Compute Engine. Whenever a zonal outage occurs, the application should be restored in another zone as quickly as possible with the latest application data. You need to design the solution to meet this requirement. What should you do?","options":{"A":"Create a snapshot schedule for the disk containing the application data. Whenever a zonal outage occurs, use the latest snapshot to restore the disk in the same zone.","B":"Configure the Compute Engine instances with an instance template for the application, and use a regional persistent disk for the application data. Whenever a zonal outage occurs, use the instance template to spin up the application in another zone in the same region. Use the regional persistent disk for the application data.","C":"Create a snapshot schedule for the disk containing the application data. Whenever a zonal outage occurs, use the latest snapshot to restore the disk in another zone within the same region.","D":"Configure the Compute Engine instances with an instance template for the application, and use a regional persistent disk for the application data. Whenever a zonal outage occurs, use the instance template to spin up the application in another region. Use the regional persistent disk for the application data,"},"answer":["B"],"explanation":"Explanation: Regional persistent disk is a storage option that provides synchronous replication of data between two zones in a region. Regional persistent disks can be a good building block to use when you implement HA services in Compute Engine. https://cloud.google.com/compute/docs/disks/high- availability-regional-persistent-disk"},{"id":183,"topic":"Altostrat Media Case Study","question":"You are a cloud architect for a financial services company that is subject to strict regulatory compliance for data residency and business continuity. Your primary transaction processing application runs on a Compute Engine instance in europe-west3, and its critical data is stored on the attached regional Persistent Disk. To meet business continuity requirements, you must ensure the application can be recovered in a different region with minimal data loss in the event of a regional outage and follow Google-recommended best practices. What should you do? 100","options":{"A":"Create a snapshot schedule for the Persistent Disk that copies the snapshots to a different region.","B":"Use Backup and DR Service to create backups, and store them in a different zone within the same source region.","C":"Configure the regional Persistent Disk for synchronous replication.","D":"Create a custom image from the instance, and configure it to be stored in a multi-regional location."},"answer":["A"],"explanation":"Explanation: Regional Persistent Disks provide synchronous data replication across two distinct zones within a single Google Cloud region. While this mitigates local zonal failures, it provides zero protection against a full regional outage. To ensure cross-region business continuity and comply with data residency boundaries, backup data must be stored externally in a distinct target region. Google-recommended best practice for cross-region block storage recovery involves implementing automated Snapshot Schedules. Snapshots are incremental by nature, capturing disk deltas to reduce overhead, and they can be configured to replicate to a specific, custom secondary region. This satisfies data residency requirements by keeping data confined to pre-approved regulatory boundaries while decoupling the data from the source region ' s infrastructure. In a disaster scenario, these snapshots can quickly provision new Persistent Disks in the target region. Custom images only capture boot configurations rather than dynamic application state data, and local zone backups fail the regional resiliency test. References: Cloud Architect (GCP) Study Guide topics: \" Storage Resiliency \" , \" Persistent Disk Snapshots Architecture \" , \" Cross-Region Disaster Recovery \" , and \" Data Residency Compliance \" ."},{"id":184,"topic":"Altostrat Media Case Study","question":"Your company has an application running on a deployment in a GKE cluster. You have a separate cluster for development, staging and production. You have discovered that the team is able to deploy a Docker image to the production cluster without first testing the deployment in development and then staging. You want to allow the team to have autonomy but want to prevent this from happening. You want a Google Cloud solution that can be implemented quickly with minimal effort. What should you do?","options":{"A":"Create a Kubernetes admission controller to prevent the container from starting if it is not approved for usage in the given environment","B":"Configure a Kubernetes lifecycle hook to prevent the container from starting if it is not approved for usage in the given environment","C":"Implement a corporate policy to prevent teams from deploying Docker image to an environment unless the Docker image was tested in an earlier environment","D":"Configure the binary authorization policies for the development, staging and production clusters. Create attestations as part of the continuous integration pipeline\""},"answer":["D"],"explanation":"Explanation: https://cloud.google.com/architecture/prep-kubernetes-engine-for-prod#binary-authorization The most common Binary Authorization use cases involve attestations. An attestation certifies that a specific image has completed a previous stage, as described previously. You configure the Binary Authorization policy to verify the attestation before allowing the image to be deployed. At deploy time, instead of redoing activities that were completed in earlier stages, Binary Authorization only needs to verify the attestation. https://cloud.google.com/binary-authorization/docs/overview"},{"id":185,"topic":"Altostrat Media Case Study","question":"Your company has a Google Cloud project that uses BlgQuery for data warehousing There are some tables that contain personally identifiable information (PI!) Only the compliance team may access the PH. The other information in the tables must be available to the data science team. You want to minimize cost and the time it takes to assign appropriate access to the tables What should you do?","options":{"A":"1 From the dataset where you have the source data, create views of tables that you want to share, excluding Pll 2 Assign an appropriate project-level IAM role to the members of the data science team 3 Assign access controls to the dataset that contains the view","B":"1 From the dataset where you have the source data, create materialized views of tables that you want to share excluding Pll 2 Assign an appropriate project-level IAM role to the members of the data science team 3. Assign access controls to the dataset that contains the view.","C":"1 Create a dataset for the data science team 2 Create views of tables that you want to share excluding Pll 3 Assign an appropriate project-level IAM role to the members of the data science team 4 Assign access controls to the dataset that contains the view 5 Authorize the view to access the source dataset","D":"1. Create a dataset for the data science team. 2. Create materialized views of tables that you want to share, excluding Pll 3. Assign an appropriate project-level IAM role to the members of the data science team 4 Assign access controls to the dataset that contains the view 5 Authorize the view to access the source dataset"},"answer":["C"],"explanation":"Explanation: This option can help minimize cost and time by using views and authorized datasets. Views are virtual tables defined by a SQL query that can exclude PII columns from the source tables. Views do not incur storage costs and do not duplicate data. Authorized datasets are datasets that have access to another dataset's data without granting direct access to individual users or groups. By creating a dataset for the data science team and creating views of tables that exclude PII, you can share only the relevant information with the team. By assigning an appropriate project-level IAM role to the members of the data science team, you can grant them access to the BigQuery service and resources. By assigning access controls to the dataset that contains the view, you can grant them access to query the views. By authorizing the view to access the source dataset, you can enable the view to read data from the source tables without exposing PII. The other options are not optimal for this scenario, because they either use materialized views instead of views, which incur storage costs and duplicate data (B, D), or do not create a separate dataset for the data science team, which makes it harder to manage access controls (A). References: * https://cloud.google.com/bigquery/docs/views * https://cloud.google.com/bigquery/docs/authorized-datasets"},{"id":186,"topic":"Altostrat Media Case Study","question":"Your company has an application running on App Engine that allows users to upload music files and share them with other people. You want to allow users to upload files directly into Cloud Storage from their browser session. The payload should not be passed through the backend. What 102 should you do?","options":{"A":"1. Set a CORS configuration in the target Cloud Storage bucket where the base URL of the App Engine application is an allowed origin. 2. Use the Cloud Storage Signed URL feature to generate a POST URL.","B":"1. Set a CORS configuration in the target Cloud Storage bucket where the base URL of the App Engine application is an allowed origin. 2. Assign the Cloud Storage WRITER role to users who upload files.","C":"1. Use the Cloud Storage Signed URL feature to generate a POST URL. 2. Use App Engine default credentials to sign requests against Cloud Storage.","D":"1. Assign the Cloud Storage WRITER role to users who upload files. 2. Use App Engine default credentials to sign requests against Cloud Storage."},"answer":["B"],"explanation":""},{"id":187,"topic":"Altostrat Media Case Study","question":"You want to create a private connection between your instances on Compute Engine and your on-premises data center. You require a connection of at least 20 Gbps. You want to follow Google-recommended practices. How should you set up the connection?","options":{"A":"Create a VPC and connect it to your on-premises data center using Dedicated Interconnect.","B":"Create a VPC and connect it to your on-premises data center using a single Cloud VPN.","C":"Create a Cloud Content Delivery Network (Cloud CDN) and connect it to your on-premises data center using Dedicated Interconnect.","D":"Create a Cloud Content Delivery Network (Cloud CDN) and connect it to your on-premises datacenter using a single Cloud VPN."},"answer":["A"],"explanation":"Reference: https://cloud.google .com/compu te/docs/instances/connecting-advanced"},{"id":188,"topic":"Altostrat Media Case Study","question":"A retail company ' s most critical application is its online payment processing system. The business has a requirement that the system must be able to survive a complete zonal outage while minimizing cost. You need a design solution that can handle a zonal failure. What should you do?","options":{"A":"Deploy the application in an active-active configuration using managed instance groups (MIGs) in two different regions, fronted by a global external HTTP(S) Load Balancer and backed by a multi- regional database like Spanner.","B":"Deploy the application on a regional MIG to provide high availability across multiple zones in the primary region.","C":"Configure the regional MIG to use only Spot VMs to aggressively minimize operational costs while maintaining high availability.","D":"Deploy the application on Compute Engine instances across multiple regions, and rely on daily snapshots for recovery to achieve the lowest possible cost."},"answer":["B"],"explanation":"Explanation: The Google Cloud Architecture Framework: Reliability section emphasizes that for applications requiring protection against zonal failures , the most cost-effective solution is a Regional Managed Instance Group (MIG) . A Regional MIG automatically distributes VM instances across multiple zones within a single region. If one zone fails, the MIG's auto-healing and cross-zone load balancing ensure that instances in the remaining healthy zones continue to serve traffic. Option B is the correct choice because it satisfies the \" survive a zonal outage \" requirement while \" minimizing cost. \" Multi-region deployments (Option A) provide higher availability (surviving regional outages) but significantly increase costs due to inter-region data transfer and the expense of multi- region database configurations like Spanner. Spot VMs (Option C) are unsuitable for a \" critical payment processing system \" because they can be preempted at any time, risking transaction failures. Snapshot recovery (Option D) results in high Recovery Time Objectives (RTO), failing the performance expectations of a critical retail application. By using a Regional MIG with a regional database (like Cloud SQL with High Availability enabled), the company achieves robust zonal resilience at a much lower price point than a global multi-region architecture."},{"id":189,"topic":"Altostrat Media Case Study","question":"Your customer is moving their corporate applications to Google Cloud Platform. The security team wants detailed visibility of all projects in the organization. You provision the Google Cloud Resource Manager and set up yourself as the org admin. What Google Cloud Identity and Access Management (Cloud IAM) roles should you give to the security team ' ?","options":{"A":"Org viewer, project owner","B":"Org viewer, project viewer","C":"Org admin, project browser","D":"Project owner, network admin"},"answer":["B"],"explanation":"Explanation: https://cloud.google.com/iam/docs/using-iam-securely"},{"id":190,"topic":"Altostrat Media Case Study","question":"You want to enable your running Google Container Engine cluster to scale as demand for your application changes. What should you do?","options":{"A":"Add additional nodes to your Container Engine cluster using the following command: gcloud container clusters resize CLUSTER_NAME --size 10","B":"Add a tag to the instances in the cluster with the following command: gcloud compute instances add-tags INSTANCE --tags enable --autoscaling max-nodes-10","C":"Update the existing Container Engine cluster with the following command: gcloud alpha container clusters update mycluster --enable-autoscaling --min-nodes=1 --max-nodes=10","D":"Create a new Container Engine cluster with the following command: gcloud alpha container clusters create mycluster --enable-autocaling --min-nodes=1 --max-nodes=10 and redeploy your application."},"answer":["B"],"explanation":"Explanation: https://cloud.google.com/kubernetes-engine/docs/concepts/cluster-autoscaler Cluster autoscaling --enable-autoscaling Enables autoscaling for a node pool. Enables autoscaling in the node pool specified by --node-pool or the default node pool if --node-pool is not provided. Where: --max-nodes=MAX_NODES Maximum number of nodes in the node pool. Maximum number of nodes to which the node pool specified by --node-pool (or default node pool if unspecified) can scale. References: https://cloud.google.com/sdk/gcloud/reference/container/clusters/create"},{"id":191,"topic":"Altostrat Media Case Study","question":"Your company has sensitive data in Cloud Storage buckets. Data analysts have Identity Access Management (IAM) permissions to read the buckets. You want to prevent data analysts from retrieving the data in the buckets from outside the office network. What should you do?","options":{"A":"1. Create a VPC Service Controls perimeter that includes the projects with the buckets. 2. Create an access level with the CIDR of the office network.","B":"1. Create a firewall rule for all instances in the Virtual Private Cloud (VPC) network for source range. 2. Use the Classless Inter-domain Routing (CIDR) of the office network.","C":"1. Create a Cloud Function to remove IAM permissions from the buckets, and another Cloud Function to add IAM permissions to the buckets. 2. Schedule the Cloud Functions with Cloud Scheduler to add permissions at the start of business and remove permissions at the end of business.","D":"1. Create a Cloud VPN to the office network. 2. Configure Private Google Access for on-premises hosts."},"answer":["A"],"explanation":"Explanation: For all Google Cloud services secured with VPC Service Controls, you can ensure that: Resources within a perimeter are accessed only from clients within authorized VPC networks using Private Google Access with either Google Cloud or on-premises. https://cloud.google.com/vpc-service- controls/docs/overview https://cloud.google.com/vpc-service-controls/docs/overview. You create a service control across your VPC and any cloud bucket or any project resource to restrict access. Anything outside of it can ' t access the resources within service control perimeter"},{"id":192,"topic":"Altostrat Media Case Study","question":"You are migrating a critical, on-premises, three-tier ecommerce application to Google Cloud. The application has tightly coupled dependencies between its web, application, and database tiers. The business has strict performance and availability requirements and is concerned about the risks associated with an \" all-at-once \" migration. You want to follow Google-recommended practices to create a migration plan that systematically addresses application dependencies and validates post- migration performance before the final production cutover What should you do?","options":{"A":"Redesign the application to be cloud-native using microservices before migration to eliminate dependencies and simplify workload testing.","B":"Plan a \" lift and shift \" migration for all application tiers to be executed simultaneously over a single weekend to minimize downtime.","C":"Use dependency mapping to group application components into waves, create a phased migration plan, and incorporate performance testing for each wave.","D":"Prioritize the establishment of a high-bandwidth, low-latency Cloud Interconnect connection, and then plan to migrate the database servers first."},"answer":["C"],"explanation":"Explanation: According to the Google Cloud Migration Framework , the recommended approach for migrating complex, tightly coupled applications is to follow a structured process: Discover, Assess, Plan, and Migrate . For high- risk environments, a \" Big Bang \" migration (Option B) is discouraged because it provides no room for validation and creates a high probability of failure. By using dependency mapping (often via tools like Migration Center ), Altostrat can identify which components must move together. Grouping these into \" waves \" allows for a phased migration . This strategy mitigates risk by moving non-critical or less complex parts first to build confidence. Most importantly, it allows for rigorous performance testing after each wave to ensure that the hybrid connectivity and cloud infrastructure meet the strict ecommerce performance requirements before the final cutover. Option A (refactoring) adds too much time and risk before the migration even begins, and Option D ignores the application-layer dependencies that could break if the database is moved in isolation."},{"id":193,"topic":"Altostrat Media Case Study","question":"You are using Cloud CDN to deliver static HTTP(S) website content hosted on a Compute Engine instance group. You want to improve the cache hit ratio. What should you do?","options":{"A":"Customize the cache keys to omit the protocol from the key.","B":"Shorten the expiration time of the cached objects.","C":"Make sure the HTTP(S) header \"Cache-Region\" points to the closest region of your users.","D":"Replicate the static content in a Cloud Storage bucket. Point CloudCDN toward a load balancer on that bucket."},"answer":["A"],"explanation":"Explanation: Reference https://cloud.google.com/cdn/docs/bestpractices# using_custom_cache_keys_to_improve_cache_hit_ratio"},{"id":194,"topic":"Altostrat Media Case Study","question":"You want to optimize the performance of an accurate, real-time, weather-charting application. The data comes from 50,000 sensors sending 10 readings a second, in the format of a timestamp and sensor reading. Where should you store the data?","options":{"A":"Google BigQuery","B":"Google Cloud SQL","C":"Google Cloud Bigtable","D":"Google Cloud Storage"},"answer":["C"],"explanation":"Explanation: It is time-series data, So Big Table. https://cloud.google.com/bigtable/docs/schema-design-time-series Google Cloud Bigtable is a scalable, fully-managed NoSQL wide-column database that is suitable for both real-time access and analytics workloads. Good for: * Low-latency read/write access * High-throughput analytics * Native time series support * Common workloads: * IoT, finance, adtech * Personalization, recommendations * Monitoring * Geospatial datasets * Graphs References: https://cloud.google.com/storage-options/"},{"id":195,"topic":"Altostrat Media Case Study","question":"You want to make a copy of a production Linux virtual machine in the US-Central region. You want to manage and replace the copy easily if there are changes on the production virtual machine. You will deploy the copy as a new instances in a different project in the US-East region. What steps must you take?","options":{"A":"Use the Linux dd and netcat command to copy and stream the root disk contents to a new virtual machine instance in the US-East region.","B":"Create a snapshot of the root disk and select the snapshot as the root disk when you create a new virtual machine instance in the US-East region.","C":"Create an image file from the root disk with Linux dd command, create a new disk from the image file, and use it to create a new virtual machine instance in the US-East region","D":"Create a snapshot of the root disk, create an image file in Google Cloud Storage from the snapshot, and create a new virtual machine instance in the US-East region using the image file for the root disk."},"answer":["D"],"explanation":"Explanation: https://stackoverflow.com/questions/36441423/migr ate-google-compute-engine-instance-to-a- different-region"},{"id":196,"topic":"Altostrat Media Case Study","question":"Your company uses the Firewall Insights feature in the Google Network Intelligence Center. You have several firewall rules applied to Compute Engine instances. You need to evaluate the efficiency of the applied firewall ruleset. When you bring up the Firewall Insights page in the Google Cloud Console, you notice that there are no log rows to display. What should you do to troubleshoot the issue?","options":{"A":"Enable Virtual Private Cloud (VPC) flow logging.","B":"Enable Firewall Rules Logging for the firewall rules you want to monitor.","C":"Verify that your user account is assigned the compute.networkAdmin Identity and Access Management (IAM) role.","D":"Install the Google Cloud SDK, and verify that there are no Firewall logs in the command line output."},"answer":["B"],"explanation":"Reference: https://cloud.google.com/network-intelligence-center/docs/firewall-insights/how- to/using-firewall- insights"},{"id":197,"topic":"Altostrat Media Case Study","question":"You need to set up Microsoft SQL Server on GCP. Management requires that there's no downtime in case of a data center outage in any of the zones within a GCP region. What should you do?","options":{"A":"Configure a Cloud SQL instance with high availability enabled.","B":"Configure a Cloud Spanner instance with a regional instance configuration.","C":"Set up SQL Server on Compute Engine, using Always On Availability Groups using Windows Failover Clustering. Place nodes in different subnets.","D":"Set up SQL Server Always On Availability Groups using Windows Failover Clustering. Place nodes in different zones."},"answer":["D"],"explanation":"Explanation: https://cloud.google.com/sql/docs/sqlserver/configure-ha"},{"id":198,"topic":"Altostrat Media Case Study","question":"Your organization has stored sensitive data in a Cloud Storage bucket. For regulatory reasons, your company must be able to rotate the encryption key used to encrypt the data in the bucket. The data will be processed in Dataproc. You want to follow Google-recommended practices for security What should you do?","options":{"A":"Create a key with Cloud Key Management Service (KMS) Encrypt the data using the encrypt method of Cloud KMS.","B":"Create a key with Cloud Key Management Service (KMS). Set the encryption key on the bucket to the Cloud KMS key.","C":"Generate a GPG key pair. Encrypt the data using the GPG key. Upload the encrypted data to the bucket.","D":"Generate an AES-256 encryption key. Encrypt the data in the bucket using the customer-supplied encryption keys feature."},"answer":["A","D"],"explanation":"Explanation: https://cloud.google.com/storage/docs/encryption/using-customer-managed-keys#add-object-key https://cloud.google.com/storage/docs/encryption/using-customer-managed-keys"},{"id":199,"topic":"Altostrat Media Case Study","question":"Your web application must comply with the requirements of the European Union's General Data Protection Regulation (GDPR). You are responsible for the technical architecture of your web application. What should you do?","options":{"A":"Ensure that your web application only uses native features and services of Google Cloud Platform, because Google already has various certifications and provides \"pass-on\" compliance when you use native features.","B":"Enable the relevant GDPR compliance setting within the GCPConsole for each of the services in use within your application.","C":"Ensure that Cloud Security Scanner is part of your test planning strategy in order to pick up any compliance gaps.","D":"Define a design for the security of data in your web application that meets GDPR requirements."},"answer":["D"],"explanation":"Explanation: http s://cloud.google.com/security/gdpr/?tab=tab4 Reference: https://www.mobiloud.com/blog/gdpr-compliant-mobile-app/"},{"id":200,"topic":"Altostrat Media Case Study","question":"An application development team believes their current logging tool will not meet their needs for their new cloud-based product. They want a bettor tool to capture errors and help them analyze their historical log data. 108 You want to help them find a solution that meets their needs, what should you do?","options":{"A":"Direct them to download and install the Google StackDriver logging agent.","B":"Send them a list of online resources about logging best practices.","C":"Help them define their requirements and assess viable logging tools.","D":"Help them upgrade their current tool to take advantage of any new features."},"answer":["C"],"explanation":"Explanation: Help them define their requirements and assess viable logging tools. They know the requirements and the existing tools ' problems. While it ' s true StackDriver Logging and Error Reporting possibly meet all their requirements, there might be other tools also meet their need. They need you to provide expertise to make assessment for new tools, specifically, logging tools that can \" capture errors and help them analyze their historical log data \" . References: https://cloud.google.com/logging/docs/agent/installati on"},{"id":201,"topic":"Altostrat Media Case Study","question":"Your company acquired a healthcare startup and must retain its customers' medical information for up to 4 more years, depending on when it was created. Your corporate policy is to securely retain this data, and then delete it as soon as regulations allow. Which approach should you take?","options":{"A":"Store the data in Google Drive and manually delete records as they expire.","B":"Anonymize the data using the Cloud Data Loss Prevention API and store it indefinitely.","C":"Store the data using the Cloud Storage and use lifecycle management to delete files when they expire.","D":"Store the data in Cloud Storage and run a nightly batch script that deletes all expired datA."},"answer":["C"],"explanation":"Explanation: https://cloud.google.com/stor age/docs/lifecycle"},{"id":202,"topic":"Altostrat Media Case Study","question":"Your company is building containerized applications as pan of their CI ' CD pipeline. To improve the security and maintainability of the build process, you need to: * Identify potential vulnerabilities within your container images. * Generate verifiable metadata about the builds for auditing and compliance. * Create a comprehensive inventory of your application ' s dependencies. What should you do?","options":{"A":"Use Cloud Build to build container images, and then trigger Artifact Analysis on images pushed to Artifact Registry.","B":"Use Cloud Build to build container images, trigger Binary Authorization, and use Security Command Center for tracking and analysis","C":"Use Cloud Build to build container images, push the images to Artifact Registry, and use Security Command Center for tracking and analysis","D":"Use Cloud Build to build container images, trigger Binary Authorization, and use Cloud Asset Inventory for tracking and analysis."},"answer":["A"],"explanation":"Explanation: The core of this question lies in three specific requirements: scanning for vulnerabilities, generating verifiable metadata, and creating a dependency inventory. Artifact Analysis (integrated with Artifact Registry) is the purpose-built Google Cloud service for these tasks. When an image is pushed, Artifact Analysis automatically performs a vulnerability scan against known CVE databases. It also generates build provenance (verifiable metadata) that proves the image was built by Cloud Build, which is essential for Binary Authorization to ensure only \" trusted \" images are deployed. Finally, it generates a Software Bill of Materials (SBOM) , which satisfies the requirement for a comprehensive inventory of dependencies. While Security Command Center (Option C) is a great dashboard for viewing risks, it is not the service that generates the metadata or performs the deep container analysis; it merely reports what Artifact Analysis finds."},{"id":203,"topic":"Altostrat Media Case Study","question":"Your BigQuery project has several users. For audit purposes, you need to see how many queries each user ran in the last month.","options":{"A":"Connect Google Data Studio to BigQuery. Create a dimension for the users and a metric for the amount of queries per user.","B":"In the BigQuery interface, execute a query on the JOBS table to get the required information.","C":"Use 'bq show' to list all jobs. Per job, use 'bq Is' to list job information and get the required information.","D":"Use Cloud Audit Logging to view Cloud Audit Logs, and create a filter on the query operation to get the required information."},"answer":["C"],"explanation":"Explanation: http s://cloud.google.com/bigquery/docs/managing-jobs"},{"id":204,"topic":"Altostrat Media Case Study","question":"You have an application that makes HTTP requests to Cloud Storage. Occasionally the requests fail with HTTP status codes of 5xx and 429. How should you handle these types of errors?","options":{"A":"Use gRPC instead of HTTP for better performance.","B":"Implement retry logic using a truncated exponential backoff strategy.","C":"Make sure the Cloud Storage bucket is multi-regional for geo-redundancy.","D":"Monitor https://status.cloud.google.com/feed.atom and only make requests if Cloud Storage is not reporting an incident."},"answer":["A"],"explanation":"Explanation: Reference https://cloud.google.com/storage/docs/json_api/v1/status-codes"},{"id":205,"topic":"Altostrat Media Case Study","question":"You are working at an institution that processes medical data. You are migrating several workloads onto Google Cloud. Company policies require all workloads to run on physically separated hardware, and workloads from different clients must also be separated You created a sole-tenant node group and added a node for each client. You need to deploy the workloads on these dedicated hosts. What should you do?","options":{"A":"Add the node group name as a network tag when creating Compute Engine instances in order to host each workload on the correct node group.","B":"Add the node name as a network tag when creating Compute Engine instances in order to host each workload on the correct node.","C":"Use node affinity labels based on the node group name when creating Compute Engine instances in order to host each workload on the correct node group","D":"Use node affinity labels based on the node name when creating Compute Engine instances in order to host each workload on the correct node."},"answer":["D"],"explanation":"Explanation: htt ps://cloud.google.com/compute/docs/nodes/provisioning-sole-tenant-vms#provision_a_sole- tenant_vm https://cloud.google.com/compute/docs/nodes/provisioning-sol e-tenant-vms#gcloud_2 When you create a VM, you request sole-tenancy by specifying node affinity or anti-affinity, referencing one or more node affinity labels. You specify custom node affinity labels when you create a node template, and Compute Engine automatically includes some default affinity labels on each node. By specifying affinity when you create a VM, you can schedule VMs together on a specific node or nodes in a node group. By specifying anti-affinity when you create a VM, you can ensure that certain VMs are not scheduled together on the same node or nodes in a node group."},{"id":206,"topic":"Altostrat Media Case Study","question":"You are developing a retail application on Vertex AI that uses a large language model to give customers real- time product recommendations. The app uses text, code, images, audio, and video prompts to communicate with customers. You need to minimize the application ' s latency to ensure a responsive and delightful user experience. What should you do?","options":{"A":"Enable streaming responses from the model to process the output in real time.","B":"Increase the temperature parameter.","C":"Avoid using the max_output_tokens parameter to prevent overly long responses.","D":"Avoid using system instructions to prevent overly long responses."},"answer":["A"],"explanation":"Explanation: According to Google Cloud Vertex AI documentation on Generative AI , Streaming is the recommended technique to reduce perceived latency in user-facing applications. When using large language models (LLMs), generating the full response can take several seconds depending on the complexity and length. By enabling streaming, the model sends the output in chunks (tokens) as they are generated, rather than waiting for the entire sequence to complete. This allows the application UI to display text to the customer progressively, creating a \" real-time \" feel and a more responsive experience. Options B, C, and D do not directly address latency in a reliable or architectural way. Increasing temperature (Option B) affects the randomness and creativity of the output but not the speed of generation. While setting a lower max_output_tokens (Option C) might technically result in shorter (and thus faster) responses, \" avoiding \" the parameter altogether gives the model more freedom to produce long, slow responses, which is counterproductive. Similarly, avoiding system instructions (Option D) sacrifices the quality and safety of the model ' s behavior without providing a predictable latency benefit. For a high-quality \" conversational commerce \" experience as defined in the Cymbal Retail case study, streaming is the standard architectural pattern for performance."},{"id":207,"topic":"Altostrat Media Case Study","question":"You want to enable your running Google Kubernetes Engine cluster to scale as demand for your application changes. What should you do?","options":{"A":"Add additional nodes to your Kubernetes Engine cluster using the following command:gcloud container clusters resizeCLUSTER_Name - -size 10","B":"Add a tag to the instances in the cluster with the following command:gcloud compute instances add- tagsINSTANCE - -tags enable-autoscaling max-nodes-10","C":"Update the existing Kubernetes Engine cluster with the following command:gcloud alpha container clustersupdate mycluster - -enable-autoscaling - -min-nodes=1 - -max-nodes=10","D":"Create a new Kubernetes Engine cluster with the following command:gcloud alpha container clusterscreate mycluster - -enable-autoscaling - -min-nodes=1 - -max-nodes=10and redeploy yo ur application"},"answer":["C"],"explanation":"Explanation: https://clo ud.google.com/kubernetes-engine/docs/concepts/cluster-autoscaler To enable autoscaling for an existing node pool, run the following command: gcloud container clusters update [CLUSTER_NAME] --enable-autoscaling \\ --min-nodes 1 --max-nodes 10 --zone [COMPUTE_ZONE] --node-pool default -pool"},{"id":208,"topic":"Altostrat Media Case Study","question":"Your company is running its application workloads on Compute Engine. The applications have been deployed in production, acceptance, and development environments. The production environment is business-critical and is used 24/7, while the acceptance and development environments are only critical during office hours. Your CFO has asked you to optimize these environments to achieve cost savings during idle times. What should you do?","options":{"A":"Create a shell script that uses the gcloud command to change the machine type of the development and acceptance instances to a smaller machine type outside of office hours. Schedule the shell script on one of the production instances to automate the task.","B":"Use Cloud Scheduler to trigger a Cloud Function that will stop the development and acceptance environments after office hours and start them just before office hours.","C":"Deploy the development and acceptance applications on a managed instance group and enable autoscaling.","D":"Use regular Compute Engine instances for the production environment, and use preemptible VMs for the acceptance and development environments."},"answer":["B"],"explanation":"Reference: https://cloud.google.com/blog/products/it-ops/best-practices-for-optimizing-your-cloud- costs"},{"id":209,"topic":"Altostrat Media Case Study","question":"You need to design a solution for global load balancing based on the URL path being requested. You need to ensure operations reliability and end-to-end in-transit encryption based on Google best practices. What should you do?","options":{"A":"Create a cross-region load balancer with URL Maps.","B":"Create an HTTPS load balancer with URL maps.","C":"Create appropriate instance groups and instances. Configure SSL proxy load balancing.","D":"Create a global forwarding rule. Configure SSL proxy balancing."},"answer":["B"],"explanation":"Explanation: Reference https://cloud.google.com/load-balancing/docs/https/url-map"},{"id":210,"topic":"Altostrat Media Case Study","question":"You need to deploy an application on Google Cloud that must run on a Debian Linux environment. The application requires extensive configuration in order to operate correctly. You want to ensure that you can install Debian distribution updates with minimal manual intervention whenever they become available. What should you do?","options":{"A":"Create a Compute Engine instance template using the most recent Debian image. Create an instance from this template, and install and configure the application as part of the startup script. Repeat this process whenever a new Google-managed Debian image becomes available.","B":"Create a Debian-based Compute Engine instance, install and configure the application, and use OS patch management to install available updates.","C":"Create an instance with the latest available Debian image. Connect to the instance via SSH, and install and configure the application on the instance. Repeat this process whenever a new Google- managed Debian image becomes available.","D":"Create a Docker container with Debian as the base image. Install and configure the application as part of the Docker image creation process. Host the container on Google Kubernetes Engine and restart the container whenever a new update is available."},"answer":["B"],"explanation":"Reference: https://cloud.google.com/compute/docs/os-patch-management"},{"id":211,"topic":"Altostrat Media Case Study","question":"A rapidly growing online gaming company wants to establish a secure and reliable connection between their on-premises data center and Google Cloud VPC network. They want to achieve a 99.99% availability SLA and keep initial costs down. They need you to quickly implement a solution to support an upcoming game launch, and you must ensure that all traffic in transit is encrypted. What should you do?","options":{"A":"Implement a Classic VPN connection.","B":"Implement an HA VPN connection.","C":"Configure a Partner Interconnect connection.","D":"Provision a Dedicated Interconnect connection."},"answer":["B"],"explanation":"Explanation: Google Cloud HA (High Availability) VPN is a cloud-native, managed IPsec VPN service designed to deliver a 99.99% network availability SLA. Unlike legacy Classic VPN, HA VPN utilizes an architecture that deploys two external IP addresses assigned to two independent interfaces on a single gateway instance, operating across multiple underlying availability zones. This architecture ensures complete hardware and path redundancy. Interconnect solutions (Dedicated and Partner) provide dedicated physical layer paths that require extensive provisioning timelines, physical hardware cross-connect setups, and higher upfront capital investments, making them incompatible with the need for rapid deployment before a pending launch. Furthermore, Interconnect traffic is unencrypted by default unless layered with Cloud VPN over Interconnect. HA VPN satisfies the encryption-in-transit mandate via native IPsec suites, avoids high initial costs by using the public internet as transport, and installs via automated configurations. References: Cloud Architect (GCP) Study Guide topics: \" Cloud VPN Topologies \" , \" HA VPN Architecture and SLAs \" , \" IPsec Encryption Standards \" , and \" Rapid Deployment Hybrid Networking \". "},{"id":212,"topic":"Altostrat Media Case Study","question":"You need to migrate Hadoop jobs for your company's Data Science team without modifying the underlying infrastructure. You want to minimize costs and infrastructure management effort. What should you do?","options":{"A":"Create a Dataproc cluster using standard worker instances.","B":"Create a Dataproc cluster using spot worker instances.","C":"Manually deploy a Hadoop cluster on Compute Engine using standard instances.","D":"Manually deploy a Hadoop cluster on Compute Engine using preemptible instances."},"answer":["B"],"explanation":"Reference: https://cloud.google.com/architecture/hadoop/hadoop-gcp-migration-jobs"},{"id":213,"topic":"Altostrat Media Case Study","question":"Your company has decided to build a backup replica of their on-premises user authentication PostgreSQL database on Google Cloud Platform. The database is 4 TB, and large updates are frequent. Replication requires private address space communication. Which networking approach should you use?","options":{"A":"Google Cloud Dedicated Interconnect","B":"Google Cloud VPN connected to the data center network","C":"A NAT and TLS translation gateway installed on-premises","D":"A Google Compute Engine instance with a VPN server installed connected to the data center network"},"answer":["A"],"explanation":"Explanation: https://cloud.goo g le.com/docs/enterprise/best-practices-for-enterprise-organizations Google Cloud Dedicated Interconnect provides direct physical connections and RFC 1918 communication between your on-premises network and Google's network. Dedicated Interconnect enables you to transfer large amounts of data between networks, which can be more cost effective than purchasing additional bandwidth over the public Internet or using VPN tunnels. Benefits: * Traffic between your on-premises network and your VPC network doesn ' t traverse the public Internet. Traffic traverses a dedicated connection with fewer hops, meaning there are less points of failure where traffic might get dropped or disrupted. * Your VPC network ' s internal (RFC 1918) IP addresses are directly accessible from your on-premises network. You don ' t need to use a NAT device or VPN tunnel to reach internal IP addresses. Currently, you can only reach internal IP addresses over a dedicated connection. To reach Google external IP addresses, you must use a separate connection. * You can scale your connection to Google based on your needs. Connection capacity is delivered over one or more 10 Gbps Ethernet connections, with a maximum of eight connections (80 Gbps total per interconnect). * The cost of egress traffic from your VPC network to your on-premises network is reduced. A dedicated connection is generally the least expensive method if you have a high-volume of traffic to and from Google's network. References: https://cloud.google.com/interconnect/docs/details/dedicated"},{"id":214,"topic":"Altostrat Media Case Study","question":"You are deploying a PHP App Engine Standard service with SQL as the backend. You want to 114 minimize the number of queries to the database. What should you do?","options":{"A":"Set the memcache service level to dedicated. Create a key from the hash of the query, and return database values from memcache before issuing a query to Cloud SQL.","B":"Set the memcache service level to dedicated. Create a cron task that runs every minute to populate the cache with keys containing query results.","C":"Set the memcache service level to shared. Create a cron task that runs every minute to save all expected queries to a key called \"cached-queries\".","D":"Set the memcache service level to shared. Create a key called \"cached-queries\", and return database values from the key before using a query to Cloud SQL."},"answer":["A"],"explanation":"Explanation: https://cloud.google.com/appengine/docs/stand ard/php/memcache/using"},{"id":215,"topic":"Altostrat Media Case Study","question":"Your customer wants to do resilience testing of their authentication layer. This consists of a regional managed instance group serving a public REST API that reads from and writes to a Cloud SQL instance. What should you do?","options":{"A":"Engage with a security company to run web scrapes that look your users' authentication data om malicious websites and notify you if any if found.","B":"Deploy intrusion detection software to your virtual machines to detect and log unauthorized access.","C":"Schedule a disaster simulation exercise during which you can shut off all VMs in a zone to see how your application behaves.","D":"Configure a red replica for your Cloud SQL instance in a different zone than the master, and then manually trigger a failover while monitoring KPIs for our REST API."},"answer":["C"],"explanation":""},{"id":216,"topic":"Altostrat Media Case Study","question":"You are designing a Data Warehouse on Google Cloud and want to store sensitive data in BigQuery. Your company requires you to generate encryption keys outside of Google Cloud. You need to implement a solution. What should you do?","options":{"A":"Generate a new key in Cloud Key Management Service (Cloud KMS). Store all data in Cloud Storage using the customer-managed key option and select the created key. Set up a Dataflow pipeline to decrypt the data and to store it in a BigQuery dataset.","B":"Generate a new key in Cloud Key Management Service (Cloud KMS). Create a dataset in BigQuery using the customer-managed key option and select the created key","C":"Import a key in Cloud KMS. Store all data in Cloud Storage using the customer-managed key option and select the created key. Set up a Dataflow pipeline to decrypt the data and to store it in a new BigQuery dataset.","D":"Import a key in Cloud KMS. Create a dataset in BigQuery using the customer-supplied key option and select the created key."},"answer":["D"],"explanation":"Explanation: https://cloud .google.com/bigquery/docs/customer-managed-encryption "},{"id":217,"topic":"Altostrat Media Case Study","question":"Your company has a support ticketing solution that uses App Engine Standard. The project that contains the App Engine application already has a Virtual Private Cloud(VPC) network fully connected to the company's on-premises environment through a Cloud VPN tunnel. You want to enable App Engine application to communicate with a database that is running in the company's on- premises environment. What should you do?","options":{"A":"Configure private services access","B":"Configure private Google access for on-premises hosts only","C":"Configure serverless VPC access","D":"Configure private Google access"},"answer":["A"],"explanation":"Explanation: https://cloud.google.com/appengine/docs/standard/python3/connecting-vpc https://cloud.google.com/appengine/docs/flexible/python/using-third-party-databases#on_premises"},{"id":218,"topic":"Altostrat Media Case Study","question":"You need to reduce the number of unplanned rollbacks of erroneous production deployments in your company ' s web hosting platform. Improvement to the QA/Test processes accomplished an 80% reduction. Which additional two approaches can you take to further reduce the rollbacks? Choose 2 answers","options":{"A":"Introduce a green-blue deployment model.","B":"Replace the QA environment with canary releases.","C":"Fragment the monolithic platform into microservices.","D":"Reduce the platform ' s dependency on relational database systems.","E":"Replace the platform ' s relational database systems with a NoSQL database."},"answer":["A","C"],"explanation":""},{"id":219,"topic":"Altostrat Media Case Study","question":"Your company has a project in Google Cloud with three Virtual Private Clouds (VPCs). There is a Compute Engine instance on each VPC. Network subnets do not overlap and must remain separated. The network configuration is shown below. Instance #1 is an exception and must communicate directly with both Instance #2 and Instance #3 via internal IPs. How should you accomplish this?","options":{"A":"Create a cloud router to advertise subnet #2 and subnet #3 to subnet #1.","B":"Add two additional NICs to Instance #1 with the following configuration: * NIC1 # VPC: VPC #2 # SUBNETWORK: subnet #2 * NIC2 # VPC: VPC #3 # SUBNETWORK: subnet #3 Update firewall rules to enable traffic between instances.","C":"Create two VPN tunnels via CloudVPN: * 1 between VPC #1 and VPC #2. * 1 between VPC #2 and VPC #3. Update firewall rules to enable traffic between the instances.","D":"Peer all three VPCs: * Peer VPC #1 with VPC #2. * Peer VPC #2 with VPC #3. Update firewall rules to enable traffic between the instances."},"answer":["B"],"explanation":"Explanation: As per GCP documentation: \" By default, every instance in a VPC network has a single network interface. Use these instructions to create additional network interfaces. Each interface is attached to a different VPC network, giving that instance access to different VPC networks in Google Cloud. You cannot attach multiple network interfaces to the same VPC network. \" Refer to: https://cloud.google.com/vpc/docs/create-use- multiple-interfaces https://cloud.google.com/vpc/docs/create-use-multiple- interfaces#i_am_not_able_to_connect_to_secondary_interfaces_i nternal_ip"},{"id":220,"topic":"Altostrat Media Case Study","question":"Your company ' s test suite is a custom C++ application that runs tests throughout each day on Linux virtual machines. The full test suite takes several hours to complete, running on a limited number of on premises servers reserved for testing. Your company wants to move the testing infrastructure to the cloud, to reduce the amount of time it takes to fully test a change to the system, while changing the tests as little as possible. Which cloud infrastructure should you recommend?","options":{"A":"Google Compute Engine unmanaged instance groups and Network Load Balancer","B":"Google Compute Engine managed instance groups with auto-scaling","C":"Google Cloud Dataproc to run Apache Hadoop jobs to process each test","D":"Google App Engine with Google Stackdriver for logging"},"answer":["B"],"explanation":"Explanation: https://cloud.google.com/compute/d ocs/instance-groups/ Google Compute Engine enables users to launch virtual machines (VMs) on demand. VMs can be launched from the standard images or custom images created by users. Managed instance groups offer autoscaling capabilities that allow you to automatically add or remove instances from a managed instance group based on increases or decreases in load. Autoscaling helps your applications gracefully handle increases in traffic and reduces cost when the need for resources is lower."},{"id":221,"topic":"Altostrat Media Case Study","question":"Your company is moving 75 TB of data into Google Cloud. You want to use Cloud Storage and follow Googlerecommended practices. What should you do?","options":{"A":"Move your data onto a Transfer Appliance. Use a Transfer Appliance Rehydrator to decrypt the data into Cloud Storage.","B":"Move your data onto a Transfer Appliance. Use Cloud Dataprep to decrypt the data into Cloud Storage.","C":"Install gsutil on each server that contains data. Use resumable transfers to upload the data into Cloud Storage.","D":"Install gsutil on each server containing data. Use streaming transfers to upload the data into Cloud Storage."},"answer":["A"],"explanation":"Explanation: https://cloud.google.com/transfer-appliance/docs/2.0/faq"},{"id":222,"topic":"Altostrat Media Case Study","question":"You need to evaluate your team readiness for a new GCP project. You must perform the evaluation and create a skills gap plan incorporates the business goal of cost optimization. Your team has deployed two GCP projects successfully to date. What should you do?","options":{"A":"Allocate budget for team training. Set a deadline for the new GCP project.","B":"Allocate budget for team training. Create a roadmap for your team to achieve Google Cloud certification based on job role.","C":"Allocate budget to hire skilled external consultants. Set a deadline for the new GCP project.","D":"Allocate budget to hire skilled external consultants. Create a roadmap for your team to achieve Google Cloud certification based on job role."},"answer":["B"],"explanation":"Explanation: https://services.google.com/fh/file s/misc/cloud_center_of_excellence.pdf"},{"id":223,"topic":"Altostrat Media Case Study","question":"Your company uses Google Kubernetes Engine (GKE) as a platform for all workloads. Your company has a single large GKE cluster that contains batch, stateful, and stateless workloads. The GKE cluster is config ured with a single node pool with 200 nodes. Your company needs to reduce the cost of this cluster but does not want to compromise availability. What should you do?","options":{"A":"Create a second GKE cluster for the batch workloads only. Allocate the 200 original nodes across both clusters.","B":"Configure a HorizontalPodAutoscaler for all stateless workloads and for all compatible stateful workloads. Configure the cluster to use node auto scaling.","C":"Configure CPU and memory limits on the namespaces in the cluster. Configure all Pods to have a CPU and memory limits.","D":"Change the node pool to use spot VMs."},"answer":["C"],"explanation":"Explanation: One way to reduce the cost of a Google Kubernetes Engine (GKE) cluster without compromising availability is to use horizontal pod autoscalers (HPA) and node auto scaling. HPA allows you to automatically scale the number of Pods in a deployment based on the resource usage of the Pods. By configuring HPA for stateless workloads and for compatible stateful workloads, you can ensure that the number of Pods is automatically adjusted based on the actual resource usage, which can help to reduce costs. Node auto scaling allows you to automatically add or remove nodes from the node pool based on the resource usage of the cluster. By configuring node auto scaling, you can ensure that the cluster has the minimum number of nodes needed to meet the resource requirements of the workloads, which can also help to reduce costs."},{"id":224,"topic":"Altostrat Media Case Study","question":"Your company pushes batches of sensitive transaction data from its application server VMs to Cloud Pub/Sub for processing and storage. What is the Google-recommended way for your application to authenticate to the required Google Cloud services?","options":{"A":"Ensure that VM service accounts are granted the appropriate Cloud Pub/Sub IAM roles.","B":"Ensure that VM service accounts do not have access to Cloud Pub/Sub, and use VM access scopes to grant the appropriate Cloud Pub/Sub IAM roles.","C":"Generate an OAuth2 access token for accessing Cloud Pub/Sub, encrypt it, and store it in Cloud Storage for access from each VM.","D":"Create a gateway to Cloud Pub/Sub using a Cloud Function, and grant the Cloud Function service account the appropriate Cloud Pub/Sub IAM roles."},"answer":["A"],"explanation":""},{"id":225,"topic":"Altostrat Media Case Study","question":"Your company wants to start using Google Cloud resources but wants to retain their on- premises Active Directory domain controller for identity management. What should you do?","options":{"A":"Use the Admin Directory API to authenticate against the Active Directory domain controller.","B":"Use Google Cloud Directory Sync to synchronize Active Directory usernames with cloud identities and configure SAML SSO.","C":"Use Cloud Identity-Aware Proxy configured to use the on-premises Active Directory domain controller as an identity provider.","D":"Use Compute Engine to create an Active Directory (AD) domain controller that is a replica of the onpremises AD domain controller using Google Cloud Directory Sync."},"answer":["B"],"explanation":"Explanation: https://cloud.google.com/solutions/federating-gcp-with-active-d irectory- introduction#implementing_federation"},{"id":226,"topic":"Altostrat Media Case Study","question":"Your company creates rendering software which users can download from the company website. Your company has customers all over the world. You want to minimize latency for all your customers. You want to follow Google-recommended practices. How should you store the files?","options":{"A":"Save the files in a Multi-Regional Cloud Storage bucket.","B":"Save the files in a Regional Cloud Storage bucket, one bucket per zone of the region.","C":"Save the files in multiple Regional Cloud Storage buckets, one bucket per zone per region.","D":"Save the files in multiple Multi-Regional Cloud Storage buckets, one bucket per multi-region."},"answer":["A"],"explanation":"Explanation: https://cloud.google.com/storage/docs/locations#location-mr"},{"id":227,"topic":"Altostrat Media Case Study","question":"You are using Cloud SQL as the database backend for a large CRM deployment. You want to scale as usage increases and ensure that you don't run out of storage, maintain 75% CPU usage cores, and keep replication lag below 60 seconds. What are the correct steps to meet your requirements?","options":{"A":"1) Enable automatic storage increase for the instance. 2) Create a Stackdriver alert when CPU usage exceeds 75%, and change the instance type to reduce CPU usage. 3) Create a Stackdriver alert for replication lag, and shard the database to reduce replication time.","B":"1) Enable automatic storage increase for the instance. 2) Change the instance type to a 32-core machine type to keep CPU usage below 75%. 3) Create a Stackdriver alert for replication lag, and shard the database to reduce replication time.","C":"1) Create a Stackdriver alert when storage exceeds 75%, and increase the available storage on the instance to create more space. 2) Deploy memcached to reduce CPU load. 3) Change the instance type to a 32-core machine type to reduce replication lag.","D":"1) Create a Stackdriver alert when storage exceeds 75%, and increase the available storage on the instance to create more space. 2) Deploy memcached to reduce CPU load. 3) Create a Stackdriver alert for replication lag, and change the instance type to a 32-core machine type to reduce replication lag."},"answer":["A"],"explanation":""},{"id":228,"topic":"Altostrat Media Case Study","question":"You have created several preemptible Linux virtual machine instances using Google Compute Engine. You want to properly shut down your application before the virtual machines are preempted. What should you do?","options":{"A":"Create a shutdown script named k99.shutdown in the /etc/rc.6.d/ directory.","B":"Create a shutdown script registered as a xinetd service in Linux and configure a Stackdnver endpoint check to call the service.","C":"Create a shutdown script and use it as the value for a new metadata entry with the key shutdown- script in the Cloud Platform Console when you create the new virtual machine instance.","D":"Create a shutdown script, registered as a xinetd service in Linux, and use the gcloud compute instances add-metadata command to specify the service URL as the value for a new metadata entry with the key shutdown-script-url"},"answer":["C"],"explanation":""},{"id":229,"topic":"Altostrat Media Case Study","question":"A news teed web service has the following code running on Google App Engine. During peak load, users report that they can see news articles they already viewed. What is the most likely cause of this problem? 120","options":{"A":"The session variable is local to just a single instance.","B":"The session variable is being overwritten in Cloud Datastore.","C":"The URL of the API needs to be modified to prevent caching.","D":"The HTTP Expires header needs to be set to -1 to stop caching."},"answer":["A"],"explanation":"Explanation: https://stackoverflow.c om/questi ons/3164280/google-app-engine-cache-list-in- session -variable?rq=1"},{"id":230,"topic":"Altostrat Media Case Study","question":"You want to store critical business information in Cloud Storage buckets. The information is regularly changed but previous versions need to be referenced on a regular basis. You want to ensure that there is a record of all changes to any information in these buckets. You want to ensure that accidental edits or deletions can be easily roiled back. Which feature should you enable?","options":{"A":"Bucket Lock","B":"Object Versioning","C":"Object change notification","D":"Object Lifecycle Management"},"answer":["B"],"explanation":""},{"id":231,"topic":"Altostrat Media Case Study","question":"You have deployed an application on Anthos clusters (formerly Anthos GKE). According to the SRE practices at your company you need to be alerted if the request latency is above a certain threshold for a specified amount of time. What should you do?","options":{"A":"Enable the Cloud Trace API on your project and use Cloud Monitoring Alerts to send an alert based on the Cloud Trace metrics","B":"Configure Anthos Config Management on your cluster and create a yaml file that defines the SLO and alerting policy you want to deploy in your cluster","C":"Use Cloud Profiler to follow up the request latency. Create a custom metric in Cloud Monitoring based on the results of Cloud Profiler, and create an Alerting Policy in case this metric exceeds the threshold","D":"Install Anthos Service Mesh on your cluster. Use the Google Cloud Console to define a Service Level Objective (SLO)"},"answer":["D"],"explanation":"Explanation: https://cloud.google.com/service-mesh/docs/overview https://cloud.google.com/service-mesh/docs/observability/slo-overview"},{"id":232,"topic":"Altostrat Media Case Study","question":"You are working in a highly secured environment where public Internet access from the Compute Engine VMs is not allowed. You do not yet have a VPN connection to access an on-premises file server. You need to install specific software on a Compute Engine instance. How should you install the software?","options":{"A":"Upload the required installation files to Cloud Storage. Configure the VM on a subnet with a Private Google Access subnet. Assign only an internal IP address to the VM. Download the installation files to the VM using gsutil.","B":"Upload the required installation files to Cloud Storage and use firewall rules to block all traffic except the IP address range for Cloud Storage. Download the files to the VM using gsutil.","C":"Upload the required installation files to Cloud Source Repositories. Configure the VM on a subnet with a Private Google Access subnet. Assign only an internal IP address to the VM. Download the installation files to the VM using gcloud.","D":"Upload the required installation files to Cloud Source Repositories and use firewall rules to block all traffic except the IP address range for Cloud Source Repositories. Download the files to the VM using gsutil."},"answer":["A"],"explanation":"Explanation: https://cloud.google.com/vpc/docs/private-access-options#pga-supported"},{"id":233,"topic":"Altostrat Media Case Study","question":"You have an application that will run on Compute Engine. You need to design an architecture that takes into account a disaster recovery plan that requires your application to fail over to another region in case of a regional outage. What should you do?","options":{"A":"Deploy the application on two Compute Engine instances in the same project but in a different region. Use the first instance to serve traffic, and use the HTTP load balancing service to fail over to the standby instance in case of a disaster.","B":"Deploy the application on a Compute Engine instance. Use the instance to serve traffic, and use the HTTP load balancing service to fail over to an instance on your premises in case of a disaster.","C":"Deploy the application on two Compute Engine instance groups, each in the same project but in a different region. Use the first instance group to serve traffic, and use the HTTP load balancing service to fail over to the standby instance group in case of a disaster.","D":"Deploy the application on two Compute Engine instance groups, each in separate project and a different region. Use the first instance group to server traffic, and use the HTTP load balancing service to fail over to the standby instance in case of a disaster."},"answer":["C"],"explanation":""},{"id":234,"topic":"Altostrat Media Case Study","question":"A global media company is launching a new web application. The application backend is hosted on Compute Engine in us-central1 and serves both static assets (images, CSS, and JavaScript) and dynamic, user-specific content from a Cloud SQL database in the same region. Early user feedback from Europe and Asia indicates significant page load delays due to slow loading static content. You need to design a solution that minimizes latency for all global users accessing the static content. What should you do? Choose 2 answers.","options":{"A":"Create Cloud SQL read replicas in regions in Europe and Asia, and direct all database read traffic from those continents to their local replica.","B":"Use a regional external Network Load Balancer in us-central1 to better distribute the incoming global traffic.","C":"Enable Cloud CDN for the backend service that serves the static assets, and configure it as part of a global external HTTP(S) Load Balancer.","D":"Deploy the application frontend service to Compute Engine managed instance groups in regions in Europe and Asia. Use a global external HTTP(S) Load Balancer to route user traffic to the nearest region."},"answer":["C","D"],"explanation":"Explanation: According to Google Cloud ' s Architecture Framework for Performance Excellence , the most effective way to reduce latency for a global user base is to move content closer to the users. Option C (Cloud CDN) is the primary recommendation for static assets. By leveraging Cloud CDN with a Global External HTTP(S) Load Balancer , static content (images, CSS, JS) is cached at Google ' s edge points of presence (PoPs) globally. When a user in Europe or Asia requests an image, it is served from a nearby edge cache rather than traveling back to us-central1, drastically reducing the Time to First Byte (TTFB). Option D addresses the application logic (frontend) latency. By deploying Managed Instance Groups (MIGs) in Europe and Asia, the initial request processing happens locally. While the dynamic data might still rely on a central database, the frontend presentation and initial connection handshake are localized. Option A focuses on database read latency, which is helpful but does not solve the \" slow loading static content \" issue identified in the feedback. Option B is incorrect because a Regional Network Load Balancer cannot terminate SSL at the edge or support Cloud CDN. Vertically scaling (undisclosed option) is a \" brute force \" approach that does not solve the physical distance/speed-of-light issue inherent in global networking."},{"id":235,"topic":"Altostrat Media Case Study","question":"Your company is expanding its AI-powered operations nationwide and has chosen accelerator-based compute for the AI workloads. The batch image processing workloads are not time-sensitive and can tolerate interruptions. You need to rapidly deploy cost-effective accelerator nodes for these batch tasks, ensuring data persistence when necessary. What should you do?","options":{"A":"Deploy Cloud Run functions with ephemeral local SSD.","B":"Deploy standard VMs with configured accelerators and attached persistent disks.","C":"Deploy spot VMs with local SSD to reduce time for burst workloads.","D":"Deploy spot VMs with attached persistent disks and implement checkpoint mechanisms."},"answer":["D"],"explanation":"Explanation: For batch processing workloads that are \" not time-sensitive \" and \" can tolerate interruptions, \" Spot VMs (formerly Preemptible VMs) are the Google-recommended best practice for cost optimization. Spot VMs offer the same performance as standard VMs (including support for GPUs and TPUs) at a discount of up to 91% . However, because Spot VMs can be reclaimed by Google Cloud at any time, the architecture must be fault- tolerant . According to Vertex AI and Compute Engine best practices , using Persistent Disks (rather than Local SSDs, which are wiped upon VM termination) ensures that data is not lost when an instance is preempted. By implementing a checkpointing mechanism , the AI model periodically saves its state (weights, processed image metadata, etc.) to the persistent disk. When a new Spot VM is automatically provisioned by a Managed Instance Group to replace the preempted one, the application can resume from the last saved checkpoint rather than starting from the beginning. Option C is less ideal because Local SSD data does not persist through preemption/reclamation cycles. Option B uses standard VMs, which fails the requirement for \" cost-effective \" deployment. Option D perfectly balances the extreme cost savings of Spot provisioning with the reliability requirements of large- scale batch image processing."},{"id":236,"topic":"Altostrat Media Case Study","question":"Altostrat ' s development team is using a microservices architecture for their application. You need to select the most suitable testing approach to ensure that individual microservices function correctly in isolation. What should you do?","options":{"A":"Run unit testing.","B":"Use load testing.","C":"Perform end-to-end testing.","D":"Execute integration testing."},"answer":["A"],"explanation":"Explanation: According to the Google Cloud Architecture Framework: Software Development and Delivery section, unit testing is the foundational practice for verifying the smallest parts of an application-such as functions, classes, or individual microservices-in complete isolation . The requirement specifically asks for a method to ensure services function correctly \" in isolation, \" which is the primary definition of a unit test. In Altostrat's modernized CI/CD environment, unit tests are executed early in the pipeline (the \" left \" side of DevSecOps). They typically use \" mocks \" or \" stubs \" to simulate external dependencies like BigQuery, Cloud Storage, or other microservices. This ensures that the internal logic of a specific service-for instance, the metadata extraction logic or the pricing algorithm-is mathematically and logically sound before it interacts with the rest of the system. While Integration testing (Option D) is vital for ensuring services talk to each other correctly, it does not test them \" in isolation. \" End-to-end testing (Option C) validates the entire user journey but is slow and complex to debug. Load testing (Option B) focuses on performance under stress rather than functional correctness. To meet the technical requirement of \" Modernize CI/CD for containerized deployments, \" Altostrat must prioritize a robust suite of unit tests to provide developers with rapid feedback and ensure the high reliability of their operational workflows."},{"id":237,"topic":"Altostrat Media Case Study","question":"You want your Google Kubernetes Engine cluster to automatically add or remove nodes based on CPUload. What should you do?","options":{"A":"Configure a HorizontalPodAutoscaler with a target CPU usage. Enable the Cluster Autoscaler from the GCP Console.","B":"Configure a HorizontalPodAutoscaler with a target CPU usage. Enable autoscaling on the managed instance group for the cluster using the gcloud command.","C":"Create a deployment and set the maxUnavailable and maxSurge properties. Enable the Cluster Autoscaler using the gcloud command.","D":"Create a deployment and set the maxUnavailable and maxSurge properties. Enable autoscaling on the cluster managed instance group from the GCP Console."},"answer":["B"],"explanation":""},{"id":238,"topic":"Altostrat Media Case Study","question":"To reduce costs, the Director of Engineering has required all developers to move their development infrastructure resources from on-premises virtual machines (VMs) to Google Cloud Platform. These resources go through multiple start/stop events during the day and require state to persist. You have been asked to design the process of running a development environment in Google Cloud while providing cost visibility to the finance department. Which two steps should you take? Choose 2 answers","options":{"A":"Use the --no-auto-delete flag on all persistent disks and stop the VM.","B":"Use the -auto-delete flag on all persistent disks and terminate the VM.","C":"Apply VM CPU utilization label and include it in the BigQuery billing export.","D":"Use Google BigQuery billing export and labels to associate cost to groups.","E":"Store all state into local SSD, snapshot the persistent disks, and terminate the VM.","F":"Store all state in Google Cloud Storage, snapshot the persistent disks, and terminate the VM."},"answer":["A","D"],"explanation":"Explanation: https://cloud. google.com/billing/docs/how-to/export-data-bigquery"},{"id":239,"topic":"Altostrat Media Case Study","question":"A healthcare organization is migrating its patient data analytics platform to Google Cloud. The system runs on a large number of VMs and handles highly sensitive patient data. To comply with regulations, the data must be encrypted while in use. Additionally, a primary security requirement is to prevent data exfiltration by ensuring the platform ' s managed services can only be accessed from within a secure network boundary and are blocked from accessing other Google Cloud APIs. The 125 organization has a short timeline for the migration and wants to minimize downtime and is using Migrate to Virtual Machines for the migration. What should you do?","options":{"A":"Use Confidential VMs for the migrated workloads. Use Identity-Aware Proxy (IAP) to secure all SSH and RDP access to the VMs.","B":"Use Shielded VMs for the migrated workloads. Configure firewall rules to restrict access to the backend services. Configure a VPC Service Controls perimeter to protect the backend services.","C":"Use Migrate to Virtual Machines to create a runbook automation for a wave-based migration. Apply customer-managed encryption keys (CMEK) to the persistent disks of the target VMs. Configure a VPC Service Controls perimeter to protect the backend services.","D":"Use Confidential VMs for the migrated workloads. Configure a VPC Service Controls perimeter to protect the backend services."},"answer":["D"],"explanation":"Explanation: Regulatory compliance for encrypting data while in use necessitates the deployment of Confidential VMs. Confidential Computing leverages specialized hardware extensions (such as AMD SEV) to keep memory contents encrypted during CPU execution, protecting data from runtime inspection. Standard or Shielded VMs only encrypt data at rest and in transit, falling short of the in-use cryptographic security requirements. To address the data exfiltration risk and satisfy the secure network boundary requirement, a VPC Service Controls (VPC-SC) security perimeter must be wrapped around the Google Cloud managed services. VPC Service Controls establishes a logical perimeter that restricts access to supported API endpoints to requests originating from within specified VPC networks, effectively neutralizing data exfiltration attempts through unauthorized external APIs. Combining Confidential VMs for runtime memory encryption with VPC Service Controls for strict API perimeter containment directly satisfies both regulatory and technical goals. References: Cloud Architect (GCP) Study Guide topics: \" Confidential Computing Architecture \" , \" VPC Service Controls (VPC-SC) Perimeters \" , \" Data Exfiltration Prevention \" , and \" Data in Use Encryption \"."},{"id":240,"topic":"Altostrat Media Case Study","question":"Your company has hired an external auditing firm to perform a compliance audit. Your company ' s governance policy requires that external auditors be managed in a single Google Group that is granted temporary, read-only access to a Cloud Storage bucket named audit-evidence-bucket. Access must be traceable to the individual auditor ' s identi
