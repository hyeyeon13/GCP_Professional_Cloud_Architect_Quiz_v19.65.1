 best practices. Considering the EHR Healthcare business and technical requirements, what should you do to reduce the attack surface?","options":{"A":"Use a private cluster with a private endpoint with master authorized networks configured.","B":"Use a public cluster with firewall rules and Virtual Private Cloud (VPC) routes.","C":"Use a private cluster with a public endpoint with master authorized networks configured.","D":"Use a public cluster with master authorized networks enabled and firewall rules."},"answer":["B"],"explanation":"Explanation: https://cloud.google.com/kubernetes-engine/d ocs/concepts/private-cluster-concept#overview"},{"id":78,"topic":"EHR Health Care","question":"For this question, refer to the EHR Healthcare case study. You are responsible for ensuring that EHR ' s use of Google Cloud will pass an upcoming privacy compliance audit. What should you do? (Choose two.)","options":{"A":"Verify EHR ' s product usage against the list of compliant products on the Google Cloud compliance page.","B":"Advise EHR to execute a Business Associate Agreement (BAA) with Google Cloud.","C":"Use Firebase Authentication for EHR ' s user facing applications.","D":"Implement Prometheus to detect and prevent security breaches on EHR ' s web-based applications.","E":"Use GKE private clusters for all Kubernetes workloads."},"answer":["A"],"explanation":"Explanation: https://cloud.google.com/security/compliance/hipaa"},{"id":79,"topic":"EHR Health Care","question":"For this question, refer to the EHR Healthcare case study. You need to define the technical architecture for securely deploying workloads to Google Cloud. You also need to ensure that only verified containers are deployed using Google Cloud services. What should you do? (Choose two.)","options":{"A":"Enable Binary Authorization on GKE, and sign containers as part of a CI/CD pipeline.","B":"Configure Jenkins to utilize Kritis to cryptographically sign a container as part of a CI/CD pipeline.","C":"Configure Container Registry to only allow trusted service accounts to create and deploy containers from the registry.","D":"Configure Container Registry to use vulnerability scanning to confirm that there are no vulnerabilities before deploying the workload."},"answer":["A"],"explanation":"Explanation: Binary Authorization to ensure only verified containers are deployed To ensure deployment are secure and and consistent, automatically scan images for vulnerabilities with container analysis ( https://cloud.google.com /docs/ci-cd/overview?hl=en & skip_cache=true )"},{"id":80,"topic":"EHR Health Care","question":"For this question, refer to the EHR Healthcare case study. You need to define the technical architecture for hybrid connectivity between EHR ' s on-premises systems and Google Cloud. You want to follow Google ' s recommended practices for production-level applications. Considering the EHR Healthcare business and technical requirements, what should you do?","options":{"A":"Configure two Partner Interconnect connections in one metro (City), and make sure the Interconnect connections are placed in different metro zones.","B":"Configure two VPN connections from on-premises to Google Cloud, and make sure the VPN devices on-premises are in separate racks.","C":"Configure Direct Peering between EHR Healthcare and Google Cloud, and make sure you are peering at least two Google locations.","D":"Configure two Dedicated Interconnect connections in one metro (City) and two connections in another metro, and make sure the Interconnect connections are placed in different metro zones."},"answer":["D"],"explanation":"Explanation: based on the requirement of secure and high-performance connection between on-premises systems to Google Cloud https://cloud.google.com/network-connectivity/docs/interconnect/tutorials/partner-creating-9999- availability"},{"id":81,"topic":"Cymbal Retail case study","question":"For this question, refer to the Cymbal Retail case study. Cymbal wants you to design a cloud- first data storage infrastructure for the product catalog modernization project. You want to ensure efficient data access and high availability for Cymbals web application and virtual agents while minimizing operational costs. What should you do?","options":{"A":"Use AlloyDB for structured product data, and Cloud Storage for product images","B":"Use Spanner for the structured product data, and BigTable for product images","C":"Use Filestore for the structured product data and Cloud Storage for product images","D":"Use Cloud Storage for structured product data, and BigQuery for product images"},"answer":["A"],"explanation":"Explanation: A \" cloud-first \" modernization strategy for a retail product catalog typically involves moving from legacy relational databases to high-performance, managed services. AlloyDB for PostgreSQL is Google Cloud ' s premier choice for demanding transactional workloads. It offers superior performance (up to 4x faster than standard PostgreSQL) and built-in high availability, making it ideal for the low- latency requirements of web applications and AI virtual agents. Option A follows the architecturally sound pattern of separating structured data from unstructured assets. Cloud Storage is the industry standard for storing \" product images, \" providing massive scalability, high availability, and low cost through lifecycle management. Option B is less ideal because Bigtable is not designed for storing binary image blobs efficiently, and Spanner can be significantly more expensive and complex to manage if global multi-region consistency is not a strict requirement for the \" minimizing operational costs \" goal. Option C is incorrect because Filestore (NFS) is not a suitable primary database for a modern web application catalog. Option D is technically flawed as Cloud Storage is not an efficient primary database for structured application queries, and BigQuery is an analytical warehouse, not an image store. By combining AlloyDB and Cloud Storage, Cymbal achieves a performant, scalable, and cost-optimized foundation for their digital transformation."},{"id":82,"topic":"Cymbal Retail case study","question":"For this question, refer to the Cymbal Retail case study. Cymbal has a centralized project that supports large video files for Vertex Al model training. Standard storage costs have suddenly increased this month, and you need to determine why. What should you do?","options":{"A":"Investigate if the project owner disabled a soft-delete policy on the bucket holding the video files.","B":"Investigate if the project owner moved from dual-region storage to region storage","C":"Investigate If the project owner enabled a soft-delete policy on the bucket holding the video files.","D":"Investigate if the project owner moved from multi-region storage to region stotage."},"answer":["C"],"explanation":"Explanation: According to Google Cloud Storage documentation , the soft-delete policy is a feature enabled by default on new buckets (starting in 2024) to protect against accidental or malicious deletion. It retains deleted objects for a specified retention period (default is seven days). For workloads involving large files-such as the video files Cymbal uses for Vertex AI training-this policy can lead to unexpected cost spikes. When soft-delete is active, objects that are deleted are not immediately removed from the billing cycle; instead, they continue to incur charges at the same rate as \" live \" objects until the retention period expires. In an AI training environment where datasets are frequently updated, replaced, or temporary \" scratch \" files are created and deleted, the volume of soft-deleted bytes can quickly double or triple the effective storage footprint. Options B and D are incorrect because moving from dual-region or multi-region to a single region would actually reduce storage costs, as regional storage is priced lower. Option A is incorrect because disabling the policy would stop the retention of deleted bytes, thereby lowering the bill. Therefore, checking for an active or recently enabled soft-delete policy is the standard troubleshooting step for sudden increases in storage costs associated with high-churn, large-file datasets."},{"id":83,"topic":"Cymbal Retail case study","question":"For this question, refer to the Cymbal Retail case study Cymbal plans to migrate their existing on-premises systems to Google Cloud and implement Al-powered virtual agents to handle customer interactions You need to provision the compute resources that can scale for the Al-powered virtual agents What should you do?","options":{"A":"Use Cloud SQL to store the customer data and product catalog.","B":"Configure Cloud Build to call Al Applications (formerly Vertex Al Agent Builder).","C":"Deploy a Google Kubernetes Engine (GKE) cluster with autoscaling enabled","D":"Create a single, large Compute Engine VM instance with a high CPU allocation."},"answer":["C"],"explanation":"Explanation: According to the Google Cloud Architecture Framework for modernizing applications, Google Kubernetes Engine (GKE) is the most suitable compute platform for services requiring high scalability and availability. Cymbal's AI-powered virtual agents must handle \" anticipated growth \" and fluctuating customer demands from their web and mobile apps. GKE's Horizontal Pod Autoscaler (HPA) and Cluster Autoscaler ensure that the compute resources expand automatically during peak shopping hours and shrink during low- traffic periods to \" minimize costs. \" GKE is explicitly mentioned in Cymbal's \" Existing Technical Environment \" as their preferred platform for containerized applications. Leveraging GKE for the virtual agents allows the development team to use a microservices approach, isolating the agent ' s logic from other catalog enrichment tasks. Option D (Single large VM) is a \" legacy \" approach that creates a single point of failure and does not scale efficiently. Option A (Cloud SQL) is a database service, not a compute resource for running agent logic. While Vertex AI Agent Builder (Option B) is the tool used to create the agents, the underlying compute that hosts the integrated application and handles the traffic orchestration is best served by a managed Kubernetes environment like GKE, which aligns with their requirement for \" Scalability and Performance. \""},{"id":84,"topic":"Cymbal Retail case study","question":"You are migrating third-party applications from optimized on-premises virtual machines to Google Cloud. You are unsure about the optimum CPU and memory options. The application have a consistent usage patterns across multiple weeks. You want to optimize resource usage for the lowest cost. What should you do?","options":{"A":"Create a Compute engine instance with CPU and Memory options similar to your application's current on-premises virtual machine. Install the cloud monitoring agent, and deploy the third party application. Run a load with normal traffic levels on third party application and follow the Rightsizing Recommendations in the Cloud Console","B":"Create multiple Compute Engine instances with varying CPU and memory options. Install the cloud monitoring agent and deploy the third-party application on each of them. Run a load test with high traffic levels on the application and use the results to determine the optimal settings.","C":"Create an instance template with the smallest available machine type, and use an image of the third party application taken from the current on-premises virtual machine. Create a managed instance group that uses average CPU to autoscale the number of instances in the group. Modify the average CPU utilization threshold to optimize the number of instances running.","D":"Create an App Engine flexible environment, and deploy the third party application using a Docker file and a custom runtime. Set CPU and memory options similar to your application's current on- premises virtual machine in the app.yaml file."},"answer":["A"],"explanation":""},{"id":85,"topic":"Cymbal Retail case study","question":"For this question, refer to the Cymbal Retail case study. Cymbal ' s generative Al models require high- performance storage for temporary files generated during model training and inference. These files are ephemeral and frequently accessed and modified You need to select a storage solution that minimizes latency and cost and maximizes performance for generative Al workloads. What should you do?","options":{"A":"Use a Cloud Storage bucket in the same region as your virtual machines Configure lifecycle policies to delete files after processing","B":"Use Filestore to store temporary files","C":"Use performance persistent disks.","D":"Use Local SSDs attached to the VMs running the generative Al models"},"answer":["D"],"explanation":"Explanation: According to the Google Cloud Architecture Framework: Performance Excellence , Local SSDs are the optimal choice for \" scratch \" space, temporary files, and workloads requiring the lowest possible latency and highest IOPS. Unlike Persistent Disks (Option C) or Filestore (Option B), which are network-attached, Local SSDs are physically attached to the server that hosts the virtual machine instance. This physical proximity eliminates network latency, providing sub-millisecond access times which are critical for \" frequently accessed and modified \" temporary files during AI training and inference. For generative AI, where data shuffling and checkpointing are intensive, the high throughput of Local SSDs prevents the storage layer from becoming a bottleneck for the expensive GPU/TPU accelerators . While the data on Local SSDs is ephemeral (lost if the VM is deleted or undergoes certain maintenance events), this perfectly matches Cymbal ' s requirement for \" temporary files. \" Furthermore, Local SSDs can be more cost-effective than provisioning high-performance Persistent Disks of equivalent speed, as their performance is not tied to the disk size. Cloud Storage (Option A) is unsuitable for this specific use case due to the significantly higher latency of object-based storage compared to block-based local storage."},{"id":86,"topic":"Cymbal Retail case study","question":"For this question, refer to the Cymbal Retail case study. Cymbal wants you to connect their on-premises systems to Google Cloud while maintaining secure communication between their on- premises and cloud environments You want to follow Google ' s recommended approach to ensure the most secure and manageable solution. What should you do?","options":{"A":"Use a bastion host to provide secure access lo Google Cloud resources from Cymbal ' s on- premises systems.","B":"Configure a static VPN connection using SSH tunnels to connect the on-premises systems to Google Cloud","C":"Configure a Cloud VPN gateway and establish a VPN tunnel Configure firewall rules to restrict access to specific resources and services based on IP addresses and ports.","D":"Use Google Cloud ' s VPC peering to connect Cymbal ' s on-premises network to Google Cloud."},"answer":["C"],"explanation":"Explanation: According to Google Cloud Hybrid Connectivity documentation, Cloud VPN is the standard and recommended solution for establishing a secure, encrypted connection over the public internet between an on- premises network and a Google Cloud VPC. This aligns with Cymbal's requirement for \" secure communication \" while maintaining manageability. Unlike SSH tunnels (Option B), which are fragile and difficult to scale at an enterprise level, Cloud VPN utilizes IPsec protocols to create a stable and encrypted site-to-site tunnel. +1 To satisfy the \" secure and manageable \" criteria, the implementation must include strictly defined VPC Firewall Rules . This ensures the principle of least privilege is applied, restricting on-premises systems to only the necessary cloud resources and ports required for their specific business functions. VPC Peering (Option D) is technically incorrect here as it is designed for connecting two VPCs within the cloud, not for on- premises to cloud connectivity. A Bastion Host (Option A) provides a secure gateway for administrative login (SSH/RDP) but does not provide the transparent, network- level connectivity required for the automated \" legacy file-based integrations \" and \" data transfers \" mentioned in Cymbal's environment. By using Cloud VPN with granular firewalling, Cymbal achieves a secure extension of their data center into Google Cloud."},{"id":87,"topic":"Cymbal Retail case study","question":"For this question, refer to the Cymbal Retail case study. Cymbal wants to migrate their 52 product catalog management processes to Google Cloud. You need to ensure a smooth migration with proper change management to minimize disruption and risks to the business. You want to follow Google-recommended practices to automate product catalog enrichment, improve product discoverability, increase customer engagement, and minimize costs. What should you do?","options":{"A":"Design a migration plan to move all of Cymbal ' s data to Cloud Storage, and use Compute Engine for all business logic","B":"Design a migration plan to move all of Cymbal ' s data to Cloud Storage, and use Cloud Run functions for all business logic","C":"Design a migration plan, starting with a pilot project focusing on a specific product category, and gradually expand to other categories.","D":"Design a migration plan with a scheduled window to move all components at once Perform extensive testing to ensure a successful migration."},"answer":["C"],"explanation":"Explanation: According to the Google Cloud Migration Framework , a phased approach (also known as a Phased Migration ) is the highly recommended best practice for complex enterprise workloads like Cymbal ' s product catalog. This strategy minimizes business risk and operational disruption by avoiding the \" Big Bang \" approach (Option D), which is often cited in the Google Cloud Architecture Framework as being high- risk for large-scale migrations. By starting with a pilot project focused on a specific product category, Cymbal can validate the technical architecture of their new generative AI tools-such as Vertex AI Search and Retail API -in a controlled environment. This allows the team to refine the Human-in-the-Loop (HITL) review processes and ensure that the AI-generated attributes and descriptions meet their accuracy standards before a global rollout. This \" crawl-walk-run \" methodology aligns with the Google Cloud Adoption Framework , specifically the \" Scale \" and \" Learn \" themes, by allowing the organization to build expertise and adjust governance policies based on real-world results from the pilot. Furthermore, a gradual expansion helps in managing costs effectively, as Cymbal can optimize resource allocation (like moving from on-premises databases to Cloud Spanner or Cloud SQL ) based on the performance metrics observed during the initial phase. Options A and B are too prescriptive regarding specific compute choices without first establishing a successful migration pattern and do not address the primary requirement of \" proper change management \" and risk mitigation."},{"id":88,"topic":"Cymbal Retail case study","question":"For this question, refer to the TerramEarth case study. TerramEarth plans to connect all 20 million vehicles in the field to the cloud. This increases the volume to 20 million 600 byte records a second for 40 TB an hour. How should you design the data ingestion?","options":{"A":"Vehicles continue to write data using the existing system (FTP).","B":"Vehicles stream data directly to Google BigQuery.","C":"Vehicles write data directly to GCS.","D":"Vehicles write data directly to Google Cloud Pub/Sub."},"answer":["D"],"explanation":""},{"id":89,"topic":"Cymbal Retail case study","question":"For this question, refer to the Cymbal Retail case study. Cymbal wants to migrate its diverse 53 database environment to Google Cloud while ensuring high availability and performance for online customers. The company also wants to efficiently store and access large product images These images typically stay In the catalog for more than 90 days and are accessed less and less frequently. You need to select the appropriate Google Cloud services for each database. You also need to design a storage solution for the product images that optimizes cost and performance What should you do?","options":{"A":"Migrate all databases to Spanner for consistency, and use Cloud Storage Standard for image storage","B":"Migrate all databases to self-managed instances on Compute Engino. and use a persistent disk for image storage.","C":"Migrate MySQL and SQL Server to Spanner. Redis to Memorystore. and MongoDB to Firestore Use Cloud Storage Standard for image storage, and move images to Cloud Storage Nearline storage when products become less popular.","D":"Migrate MySQL to Cloud SQL. SQL Server to Cloud SQL. Redis to Memorystore. and MongoDB to Firestore. Use Cloud Storage Standard for image storage, and move images to Cloud Storage Coldline storage when products become less popular"},"answer":["D"],"explanation":"Explanation: The Google Cloud database migration path follows a \" like-for-like \" managed service strategy. Cloud SQL is the recommended destination for MySQL and SQL Server workloads that do not require the massive horizontal scale of Spanner, fitting Cymbal's \" Technical Stack Modernization \" goals. Memorystore is the managed service for Redis, and Firestore is the native NoSQL replacement for MongoDB. For the image storage requirement, Cloud Storage Coldline is the mathematically correct choice for data accessed \" less and less frequently \" with a retention period exceeding 90 days . According to Cloud Storage documentation , Coldline is specifically designed for data accessed at most once a quarter (90 days). Using Object Lifecycle Management to move images from Standard to Coldline allows Cymbal to \" reduce costs \" while keeping images \" immediately accessible \" (unlike Archive storage, which may have different trade- offs). Option C is less optimal because Nearline is intended for 30-day access patterns; given the images stay for 90+ days and usage drops significantly, the deeper savings of Coldline are preferred. Option A is over- engineered (Spanner for all) and expensive, while Option B contradicts the requirement to \" reduce costs \" by increasing operational overhead"},{"id":90,"topic":"Altostrat Media Case Study","question":"You are managing an application deployed on Cloud Run for Anthos, and you need to define a strategy for deploying new versions of the application. You want to evaluate the new code with a subset of production traffic to decide whether to proceed with the rollout. What should you do?","options":{"A":"Deploy a new revision to Cloud Run with the new version. Configure traffic percentage between revisions.","B":"Deploy a new service to Cloud Run with the new version. Add a Cloud Load Balancing instance in front of both services.","C":"In the Google Cloud Console page for Cloud Run, set up continuous deployment using Cloud Build for the development branch. As part of the Cloud Build trigger, configure the substitution variable TRAFFIC_PERCENTAGE with the percentage of traffic you want directed to a new version.","D":"In the Google Cloud Console, configure Traffic Director with a new Service that points to the new version of the application on Cloud Run. Configure Traffic Director to send a small percentage of traffic to the new version of the application."},"answer":["A"],"explanation":"Explanation: https://cloud.google.com/run/docs/rollouts-rollbacks-traffic-migration"},{"id":91,"topic":"Altostrat Media Case Study","question":"You are deploying an application to Google Cloud. The application is part of a system. The application in Google Cloud must communicate over a private network with applications in a non- Google Cloud environment. The expected average throughput is 200 kbps. The business requires: * 99.99% system availability * cost optimization You need to design the connectivity between the locations to meet the business requirements. What should you provision?","options":{"A":"A Classic Cloud VPN gateway connected with one tunnel to an on-premises VPN gateway.","B":"A Classic Cloud VPN gateway connected with two tunnels to an on-premises VPN gateway.","C":"An HA Cloud VPN gateway connected with two tunnels to an on-premises VPN gateway.","D":"Two HA Cloud VPN gateways connected to two on-premises VPN gateways. Configure each HA Cloud VPN gateway to have two tunnels, each connected to different on-premises VPN gateways."},"answer":["B"],"explanation":"Explanation: https://cloud.google.com/network-connectivity/docs/vpn/concepts /topologies#configurations_that_support_9999_availability"},{"id":92,"topic":"Altostrat Media Case Study","question":"You are managing several projects on Google Cloud and need to interact on a daily basis with BigQuery, Bigtable and Kubernetes Engine using the gcloud CLI tool You are travelling a lot and work on different workstations during the week You want to avoid having to manage the gcloud CLI manually What should you do?","options":{"A":"Use a package manager to install gcloud on your workstations instead of installing it manually","B":"Create a Compute Engine instance and install gcloud on the instance Connect to this instance via SSH to always use the same gcloud installation when interacting with Google Cloud","C":"Install gcloud on all of your workstations Run the command gcloud components auto-update on each workstation","D":"Use Google Cloud Shell in the Google Cloud Console to interact with Google Cloud"},"answer":["C"],"explanation":"Explanation: This option allows you to use the gcloud CLI tool without having to install or manage it manually on different workstations. Google Cloud Shell is a browser-based command-line tool that provides you with a temporary Compute Engine virtual machine instance preloaded with the Cloud SDK, including the gcloud CLI tool. You can access Google Cloud Shell from any web browser and use it to interact with BigQuery, Bigtable and Kubernetes Engine using the gcloud CLI tool. The other options are not optimal for this scenario, because they either require installing and updating the gcloud CLI tool on multiple workstations (A, C), or creating and maintaining a Compute Engine instance for the sole purpose of using the gcloud CLI tool (B). References: * https://cloud.google.com/shell/docs/overview * https://cloud.google.com/sdk/gcloud/"},{"id":93,"topic":"Altostrat Media Case Study","question":"You are using Cloud Shell and need to install a custom utility for use in a few weeks. Where can you store the file so it is in the default execution path and persists across sessions?","options":{"A":"~/bin","B":"Cloud Storage","C":"/google/scripts","D":"/usr/local/bin"},"answer":["D"],"explanation":"Explanation: https://medium.com/googl e-cloud/no-localhost-no-problem-using-google-cloud-shell-as-my-full- time-development-environment-22d5a1942439"},{"id":94,"topic":"Altostrat Media Case Study","question":"You have been engaged by your client to lead the migration of their application infrastructure to GCP. One of their current problems is that the on-premises high performance SAN is requiring frequent and expensive upgrades to keep up with the variety of workloads that are identified as follows: 20TB of log archives retained for legal reasons; 500 GB of VM boot/data volumes and templates; 500 GB of image thumbnails; 200 GB of customer session state data that allows customers to restart sessions even if off-line for several days. Which of the following best reflects your recommendations for a cost-effective storage allocation?","options":{"A":"Local SSD for customer session state datA. Lifecycle-managed Cloud Storage for log archives, thumbnails, and VM boot/data volumes.","B":"Memcache backed by Cloud Datastore for the customer session state datA. Lifecycle- managed Cloud Storage for log archives, thumbnails, and VM boot/data volumes.","C":"Memcache backed by Cloud SQL for customer session state datA. Assorted local SSD-backed instances for VM boot/data volumes. Cloud Storage for log archives and thumbnails.","D":"Memcache backed by Persistent Disk SSD storage for customer session state datA. Assorted local SSDbacked instances for VM boot/data volumes. Cloud Storage for log archives and thumbnails."},"answer":["D"],"explanation":"Explanation: https://cloud.google.co m/compute/docs/disks"},{"id":95,"topic":"Altostrat Media Case Study","question":"You are designing a large distributed application with 30 microservices. Each of your distributed microservices needs to connect to a database back-end. You want to store the credentials securely. Where should you store the credentials?","options":{"A":"In the source code","B":"In an environment variable","C":"In a secret management system","D":"In a config file that has restricted access through ACLs"},"answer":["C"],"explanation":"Explanation: https://cloud.google.com/docs/authentication/p roduction#providing_credentials_to_your_application "},{"id":96,"topic":"Altostrat Media Case Study","question":"Your architecture calls for the centralized collection of all admin activity and VM system logs within your project. How should you collect these logs from both VMs and services?","options":{"A":"All admin and VM system logs are automatically collected by Stackdriver.","B":"Stackdriver automatically collects admin activity logs for most services. The Stackdriver Logging agent must be installed on each instance to collect system logs.","C":"Launch a custom syslogd compute instance and configure your GCP project and VMs to forward all logs to it.","D":"Install the Stackdriver Logging agent on a single compute instance and let it collect all audit and access logs for your environment."},"answer":["B"],"explanation":"Explanation: https://cloud.google.com/logging/docs/agent/defau lt-logs"},{"id":97,"topic":"Altostrat Media Case Study","question":"You are migrating a large, on-premises application to Google Cloud. The application consists of several interconnected virtual machines. You want to create a detailed migration plan to ensure a smooth migration with minimal effort. You need to understand the existing environment, identify dependencies, and estimate the total cost of ownership (TCO) in the cloud. What should you do?","options":{"A":"Use Config Connector to declare the desired state of your Google Cloud resources in Kubernetes- style manifests.","B":"Use the Google Cloud Migration Center to perform an automated discovery and assessment of the on- premises environment.","C":"Use the Google Cloud pricing calculator to input the specifications of your on-premises servers and receive a TCO estimate.","D":"Write a custom script to query the vSphere API for virtual machine information and then import it into BigQuery for analysis."},"answer":["B"],"explanation":"Explanation: The Google Cloud Migration Center is the unified platform for end-to-end migration. According to the Cloud Migration Framework , the \" Assess \" phase is the most critical step for a successful migration. The Migration Center provides automated discovery tools (like the mDiscovery tool) that scan your on- premises environment (vSphere, physical servers, etc.) to collect hardware specs, performance data, and network dependencies . It then generates a TCO (Total Cost of Ownership) report comparing your current costs with optimized Google Cloud sizing. This replaces manual processes like Option D and Option C (which requires you to already know the specs). Option A (Config Connector) is used for managing existing cloud resources, not for assessing on-premises environments for migration."},{"id":98,"topic":"Altostrat Media Case Study","question":"You are migrating your on-premises solution to Google Cloud in several phases. You will use Cloud VPN to maintain a connection between your on-premises systems and Google Cloud until the migration is completed. You want to make sure all your on-premises systems remain reachable during this period. How should you organize your networking in Google Cloud?","options":{"A":"Use the same IP range on Google Cloud as you use on-premises","B":"Use the same IP range on Google Cloud as you use on-premises for your primary IP range and use a secondary range that does not overlap with the range you use on-premises","C":"Use an IP range on Google Cloud that does not overlap with the range you use on-premises","D":"Use an IP range on Google Cloud that does not overlap with the range you use on-premises for your primary IP range and use a secondary range with the same IP range as you use on-premises"},"answer":["C"],"explanation":""},{"id":99,"topic":"Altostrat Media Case Study","question":"Your customer support tool logs all email and chat conversations to Cloud Bigtable for retention and analysis. What is the recommended approach for sanitizing this data of personally identifiable information or payment card information before initial storage?","options":{"A":"Hash all data using SHA256","B":"Encrypt all data using elliptic curve cryptography","C":"De-identify the data with the Cloud Data Loss Prevention API","D":"Use regular expressions to find and redact phone numbers, email addresses, and credit card numbers"},"answer":["A"],"explanation":"Reference: https://cloud.google.com/solutions/pci-dss-compliance-ingcp#"},{"id":100,"topic":"Altostrat Media Case Study","question":"You are moving an application that uses MySQL from on-premises to Google Cloud. The application will run on Compute Engine and will use Cloud SQL. You want to cut over to the Compute Engine deployment of the application with minimal downtime and no data loss to your customers. You want to migrate the application with minimal modification. You also need to determine the cutover strategy. What should you do?","options":{"A":"1. Set up Cloud VPN to provide private network connectivity between the Compute Engine application and the on-premises MySQL server. 2. Stop the on-premises application. 3. Create a mysqldump of the on-premises MySQL server. 4. Upload the dump to a Cloud Storage bucket. 5. Import the dump into Cloud SQL. 6. Modify the source code of the application to write queries to both databases and read from its local database. 7. Start the Compute Engine application. 8. Stop the on-premises application.","B":"1. Set up Cloud SQL proxy and MySQL proxy. 2. Create a mysqldump of the on-premises MySQL server. 3. Upload the dump to a Cloud Storage bucket. 4. Import the dump into Cloud SQL. 5. Stop the on-premises application. 6. Start the Compute Engine application.","C":"1. Set up Cloud VPN to provide private network connectivity between the Compute Engine application and the on-premises MySQL server. 2. Stop the on-premises application. 3. Start the Compute Engine application, configured to read and write to the on-premises MySQL server. 4. Create the replication configuration in Cloud SQL. 5. Configure the source database server to accept connections from the Cloud SQL replica. 6. Finalize the Cloud SQL replica configuration. 7. When replication has been completed, stop the Compute Engine application. 8. Promote the Cloud SQL replica to a standalone instance. 9. Restart the Compute Engine application, configured to read and write to the Cloud SQL standalone instance.","D":"1. Stop the on-premises application. 2. Create a mysqldump of the on-premises MySQL server. 3. Upload the dump to a Cloud Storage bucket. 4. Import the dump into Cloud SQL. 5. Start the application on Compute Engine."},"answer":["C"],"explanation":"Explanation: External replica promotion migration In the migration strategy of external replica promotion, you create an external database replica and synchronize the existing data to that replica. This can happen with minimal downtime to the existing database. When you have a replica database, the two databases have different roles that are referred to in this document as primary and replica. After the data is synchronized, you promote the replica to be the primary in order to move the management layer with minimal impact to database uptime. In Cloud SQL, an easy way to accomplish the external replica promotion is to use the automated migration workflow. This process automates many of the steps that are needed for this type of migration. https://cloud.google.com/architecture/migrating-mysql-to-cloudsql-concept - The best option for migrating your MySQL database is to use an external replica promotion. In this strategy, you create a replica database and set your existing database as the primary. You wait until the two databases are in sync, and you then promote your MySQL replica database to be the primary. This process minimizes database downtime related to the database migration. - https://cloud.google.com/architecture/migrating-mysql- to-cloudsql -concept#external_replica_promotion_migration"},{"id":101,"topic":"Altostrat Media Case Study","question":"To improve governance and security, your organization has structured the Google Cloud environment using folders for different business units. Each Business unit folder has subfolders for development, staging, and production environments, which must comply with internal security controls. You need to design a scalable and enforceable model that blocks internet ingress traffic to the production folders while selectively allowing direct HTTPS traffic to the necessary virtual machines. You must also ensure that individual project teams cannot overwrite these controls. What should you do?","options":{"A":"Mandate the application teams to deploy a Terraform module to create VPC firewall rules in each project that deny ingress and allow HTTPS.","B":"At each production folder, use an organization policy to block all external IPs and require teams to use external HTTPS load balancers.","C":"At each production folder, apply a hierarchical firewall policy to deny all ingress except for HTTPS to tagged VMs.","D":"At the organization root, apply a hierarchical firewall policy to deny all ingress except for HTTPS to tagged VMs."},"answer":["C"],"explanation":"Explanation: According to Google Cloud Networking best practices, Hierarchical Firewall Policies are the definitive tool for enforcing security at scale. Unlike standard VPC firewall rules, which are managed at the project level and can be deleted or modified by project owners, hierarchical policies are applied at the Folder or Organization level and are inherited by all child projects. By applying the policy at the Production folder level (Option C), you ensure that the rules apply specifically to production workloads without affecting development or staging environments (which might need more permissive access). The policy can contain a high-priority \" deny all \" ingress rule and a higher-priority \" allow \" rule specifically for port 443 (HTTPS) targeted at specific network tags . Because these rules are enforced by the folder administrator, project-level teams cannot \" overwrite \" them, satisfying the security and governance requirements. Option D is too broad as it would apply to all environments (including dev), and Option B is too restrictive and complex for simple direct VM access."},{"id":102,"topic":"Altostrat Media Case Study","question":"Your company has a Google Cloud project that uses BigQuery for data warehousing They have a VPN tunnel between the on-premises environment and Google Cloud that is configured with Cloud VPN. The security team wants to avoid data exfiltration by malicious insiders, compromised code, and accidental oversharing. What should they do?","options":{"A":"Configure Private Google Access for on-premises only.","B":"Perform the following tasks: 1) Create a service account. 2) Give the BigQuery JobUser role and Storage Reader role to the service account. 3) Remove all other IAM access from the project.","C":"Configure VPC Service Controls and configure Private Google Access.","D":"Configure Private Google Access."},"answer":["C"],"explanation":"Explanation: https://cloud.google.com/vpc-service-controls/docs/overview VPC Service Controls improves your ability to mitigate the risk of data exfiltration from Google Cloud services such as Cloud Storage and BigQuery."},{"id":103,"topic":"Altostrat Media Case Study","question":"You are using a GitHub repository for your application s source code. You want to set up an efficient and secure continuous deployment process to automatically build and deploy the application to Cloud Run whenever a pull request is merged What should you do?","options":{"A":"Create a GitHub Enterprise trigger in Cloud Build Once a pull request is merged, trigger Cloud Build to build and deploy the application to Cloud Run. Save the deployment credential to Secret Manager","B":"Create a workflow using GitHub Actions to build and deploy the application to Cloud Run once a pull request is merged. The workflow will use a service account key checked in with your source code for deployment permission","C":"Create a GitHub webhook trigger in Cloud Build. Once a pull request is merged, trigger Cloud Build to build a container image and save it In Artifact Registry Use Config Sync to deploy the application to Cloud Run","D":"Connect your repository using the Cloud Build GitHub app. Create a trigger in Cloud Build. Once a pull request is merged, trigger Cloud Build to build and deploy the application to Cloud Run."},"answer":["D"],"explanation":"Explanation: In modern DevOps on Google Cloud, the Cloud Build GitHub App (Option D) is the gold standard for integration. It is more secure and feature-rich than older webhook methods because it uses short- lived tokens and provides direct feedback (checks) within the GitHub UI. A critical part of this question is the security of credentials. Option B suggests checking a service account key into source code, which is a massive security \" anti-pattern \" and a common distractor in Google Cloud exams. Option D is the most efficient because Cloud Build handles the deployment to Cloud Run natively using its built-in service account permissions, eliminating the need for manual secret management or external configuration tools like Config Sync (Option C) for a simple application deployment."},{"id":104,"topic":"Altostrat Media Case Study","question":"Your company has a Google Cloud project that uses BigQuery for data warehousing on a pay-per-use basis. You want to monitor queries in real time to discover the most costly queries and which users spend the most. What should you do?","options":{"A":"1. Create a Cloud Logging sink to export BigQuery data access logs to Cloud Storage. 2. Develop a Dataflow pipeline to compute the cost of queries split by users.","B":"1. Create a Cloud Logging sink to export BigQuery data access logs to BigQuery. 2. Perform a BigQuery query on the generated table to extract the information you need.","C":"1. Activate billing export into BigQuery. 2. Perform a BigQuery query on the billing table to extract the information you need.","D":"1. In the BigQuery dataset that contains all the tables to be queried, add a label for each user that can launch a query. 2. Open the Billing page of the project. 3. Select Reports. 4. Select BigQuery as the product and filter by the user you want to check."},"answer":["C"],"explanation":"Explanation: https://cloud.google.com/blog/products/data-analytics/taking-a-practical-approach-to-bigquery- cost-monitoring"},{"id":105,"topic":"Altostrat Media Case Study","question":"All compute Engine instances in your VPC should be able to connect to an Active Directory server on specific ports. Any other traffic emerging from your instances is not allowed. You want to enforce this using VPC firewall rules. How should you configure the firewall rules?","options":{"A":"Create an egress rule with priority 1000 to deny all traffic for all instances. Create another egress rule with priority 100 to allow the Active Directory traffic for all instances.","B":"Create an egress rule with priority 100 to deny all traffic for all instances. Create another egress rule with priority 1000 to allow the Active Directory traffic for all instances.","C":"Create an egress rule with priority 1000 to allow the Active Directory traffic. Rely on the implied deny egress rule with priority 100 to block all traffic for all instances.","D":"Create an egress rule with priority 100 to allow the Active Directory traffic. Rely on the implied deny egress rule with priority 1000 to block all traffic for all instances."},"answer":["B"],"explanation":"Explanation: https://clo ud.google.com/vpc/d ocs/firewalls"},{"id":106,"topic":"Altostrat Media Case Study","question":"A recent audit that a new network was created in Your GCP project. In this network, a GCE instance has an SSH port open the world. You want to discover this network ' s origin. What should you do?","options":{"A":"Search for Create VM entry in the Stackdriver alerting console.","B":"Navigate to the Activity page in the Home section. Set category to Data Access and search for Create VM entry.","C":"In the logging section of the console, specify GCE Network as the logging section. Search for the Create Insert entry.","D":"Connect to the GCE instance using project SSH Keys. Identify previous logins in system logs, and match these with the project owners list."},"answer":["C"],"explanation":""},{"id":107,"topic":"Altostrat Media Case Study","question":"Your company has an application running on Google Cloud that is collecting data from thousands of physical devices that are globally distributed. Data is publish to Pub/Sub and streamed in real time into an SSO Cloud Bigtable cluster via a Dataflow pipeline. The operations team informs you that your Cloud Bigtable cluster has a hot-spot and queries are taking longer man expected You need to resolve the problem and prevent it from happening in the future What should you do?","options":{"A":"Advise your clients to use HBase APIs instead of NodeJS APIs.","B":"Review your RowKey strategy and ensure that keys are evenly spread across the alphabet.","C":"Delete records older than 30 days.","D":"Double the number of nodes you currently have."},"answer":["B"],"explanation":""},{"id":108,"topic":"Altostrat Media Case Study","question":"Your ecommerce platform uses a regional Cloud SQL for PostgreSQL database to store critical order information. The business requests a recovery time objective (RTO) of less than 10 minutes and a recovery point objective (RPO) of 2 minutes to ensure business continuity in the event of a full regional outage. You need to design a disaster recovery strategy tor the Cloud SQL database that meets the business ' s strict RTO and RPO requirements. Your design must avoid operational complexity. What should you do?","options":{"A":"Schedule hourly automated backups of the Cloud SQL instance to a multi-regional Cloud Storage bucket. In a disaster, restore the latest backup to a new instance in a different region.","B":"Configure the primary instance for high availability (HA). In the event of a regional outage, trigger a failover to the standby instance.","C":"Configure the Cloud SQL instance with a cross-region read replica. In a disaster, promote the read replica to a standalone, primary instance.","D":"Use Database Migration Service to continuously replicate the database to another instance in a different region. In a disaster, redirect application traffic to the replica."},"answer":["C"],"explanation":"Explanation: To meet an RTO of < 10 minutes and an RPO of 2 minutes during a full regional outage , you must have data already present in a second region. Regional High Availability (HA) (Option B) only protects against a single zone failure within one region; if the whole region goes down, HA fails. Cross-region read replicas (Option C) solve this by asynchronously replicating data to a distant region. The \" lag \" (RPO) is typically seconds, fitting the 2-minute requirement. In a disaster, the promotion of the replica to a primary instance is a metadata change that takes only a few minutes, satisfying the RTO. Using backups (Option A) would fail the RTO because restoring a multi-terabyte database from Cloud Storage into a new instance usually takes much longer than 10 minutes."},{"id":109,"topic":"Altostrat Media Case Study","question":"Your company is using Google Cloud. You have two folders under the Organization: Finance and Shopping. The members of the development team are in a Google Group. The development team group has been assigned the Project Owner role on the Organization. You want to prevent the development team from creating resources in projects in the Finance folder. What should you do?","options":{"A":"Assign the development team group the Project Viewer role on the Finance folder, and assign the development team group the Project Owner role on the Shopping folder.","B":"Assign the development team group only the Project Viewer role on the Finance folder.","C":"Assign the development team group the Project Owner role on the Shopping folder, and remove the development team group Project Owner role from the Organization.","D":"Assign the development team group only the Project Owner role on the Shopping folder."},"answer":["C"],"explanation":"Explanation: https://cloud.google.com/resource-manager/docs/cloud-platform -resource-hierarchy \" Roles are always inherited, and there is no way to explicitly remove a permission for a lower-level resource that is granted at a higher level in the resource hierarchy. Given the above example, even if you were to remove the Project Editor role from Bob on the \" Test GCP Project \" , he would still inherit that role from the \" Dept Y \" folder, so he would still have the permissions for that role on \" Test GCP Project \" . \" Reference: https://cloud.google.com/resource-manager/docs/creating-managing-folders"},{"id":110,"topic":"Altostrat Media Case Study","question":"Your company has an application running on Compute Engine mat allows users to play their favorite music. There are a fixed number of instances Files are stored in Cloud Storage and data is streamed directly to users. Users are reporting that they sometimes need to attempt to play popular songs multiple times before they are successful. You need to improve the performance of the application. What should you do?","options":{"A":"1. Copy popular songs into CloudSQL as a blob 2. Update application code to retrieve data from CloudSQL when Cloud Storage is overloaded","B":"1. Create a managed instance group with Compute Engine instances 2. Create a global toad balancer and configure ii with two backbends * Managed instance group * Cloud Storage bucket 3. Enable Cloud CDN on the bucket backend","C":"1. Mount the Cloud Storage bucket using gcsfuse on all backend Compute Engine instances 2. Serve muse files directly from the backend Compute Engine instance","D":"1. Create a Cloud Filestore NFS volume and attach it to the backend Compute Engine instances 2. Download popular songs in Cloud Filestore 3. Serve music Wes directly from the backend Compute Engine instance"},"answer":["B"],"explanation":""},{"id":111,"topic":"Altostrat Media Case Study","question":"Your company has an application deployed on Anthos clusters (formerly Anthos GKE) that is running multiple microservices. The cluster has both Anthos Service Mesh and Anthos Config Management configured. End users inform you that the application is responding very slowly. You want to identify the microservice that is causing the delay. What should you do?","options":{"A":"Use the Service Mesh visualization in the Cloud Console to inspect the telemetry between the microservices.","B":"Use Anthos Config Management to create a ClusterSelector selecting the relevant cluster. On the Google Cloud Console page for Google Kubernetes Engine, view the Workloads and filter on the cluster. Inspect the configurations of the filtered workloads.","C":"Use Anthos Config Management to create a namespaceSelector selecting the relevant cluster namespace. On the Google Cloud Console page for Google Kubernetes Engine, visit the workloads and filter on the namespace. Inspect the configurations of the filtered workloads.","D":"Reinstall istio using the default istio profile in order to collect request latency. Evaluate the telemetry between the microservices in the Cloud Console."},"answer":["A"],"explanation":"Explanation: The Anthos Service Mesh pages in the Google Cloud Console provide both summary and in-depth metrics, charts, and graphs that enable you to observe service behavior. You can monitor the overall health of your services, or drill down on a specific service to set a service level objective (SLO) or troubleshoot an issue. https://cloud.google.com/service-mesh/docs/observability/explore-dashboard https://cloud.google.com/anthos/service-mesh"},{"id":112,"topic":"Altostrat Media Case Study","question":"Your company is running AI/ML workloads on graphics processing units (GPUs) within Google Kubernetes Engine (GKE). These workloads are deployed across production and development projects, with the production environment being business critical and operating 24/7. You need to ensure that the GPU capacity is always available during scaling events, without being limited by overall GPU availability. You also need the ability to shift unused GPU capacity from production to development projects as needed. You want to follow Google-recommended best practices. What should you do?","options":{"A":"Create a reservation in the production project, and then create a separate reservation in the development project to secure capacity.","B":"Create a reservation in the production project, and then transfer the reservation to the development project when needed.","C":"Create an owner project with shared reservations, and then configure the production project and development project as consumer projects to consume capacity.","D":"Create a shared reservation in the production project, and then add the development project as a consumer project to move capacity when needed."},"answer":["C"],"explanation":"Explanation: According to Compute Engine documentation on Shared Reservations , the most flexible and manageable way to handle capacity across multiple projects is to use a centralized Owner Project . This is a dedicated project used to create and manage the reservation, which is then shared with \" Consumer Projects \" (in this case, your GKE production and development projects). This architecture specifically addresses the requirement to \" ensure GPU capacity is always available \" by securing the resources at the organizational level. Because the reservation is shared , the GPU capacity is not \" locked \" into a single project. If the production environment scales down and leaves unused capacity in the shared pool, the development project can immediately consume those reserved GPUs for its own scaling needs without requiring manual transfers or new configurations. Google ' s Best Practices for Shared Reservations recommend that the owner project should only own the reservation and not necessarily consume it, which simplifies billing and quota management. Option D is technically possible but less \" manageable \" at scale than a centralized owner project. Options A and B lack the automated, fluid capacity shifting required by the AI/ML workload ' s dynamic scaling needs. The following solutions are based on Google Cloud Architect documents and industry-standard best practices for global content delivery, data migration, and high-performance file access."},{"id":113,"topic":"Altostrat Media Case Study","question":"Your company sends all Google Cloud logs to Cloud Logging. Your security team wants to monitor the logs. You want to ensure that the security team can react quickly if an anomaly such as an unwanted firewall change or server breach is detected. You want to follow Google-recommended practices. What should you do?","options":{"A":"Schedule a cron job with Cloud Scheduler. The scheduled job queries the logs every minute for the relevant events.","B":"Export logs to BigQuery, and trigger a query in BigQuery to process the log data for the relevant events.","C":"Export logs to a Pub/Sub topic, and trigger Cloud Function with the relevant log events.","D":"Export logs to a Cloud Storage bucket, and trigger Cloud Run with the relevant log events."},"answer":["C"],"explanation":"Explanation: https://cloud.google.com/blog/products/management-tools/automate-your-response-to-a-cloud- logging-event"},{"id":114,"topic":"Altostrat Media Case Study","question":"Your company wants to migrate their 10-TB on-premises database export into Cloud Storage You want to minimize the time it takes to complete this activity, the overall cost and database load. The bandwidth between the on-premises environment and Google Cloud is 1 Gbps. You want to follow Google- recommended practices What should you do?","options":{"A":"Use the Data Transfer appliance to perform an offline migration","B":"Use a commercial partner ETL solution to extract the data from the on-premises database and upload it into Cloud Storage","C":"Develop a Dataflow job to read data directly from the database and write it into Cloud Storage","D":"Compress the data and upload it with gsutii -m to enable multi-threaded copy"},"answer":["A"],"explanation":"Explanation: The Data Transfer appliance is a Google-provided hardware device that can be used to transfer large amounts of data from on-premises environments to Cloud Storage. It is suitable for scenarios where the bandwidth between the on-premises environment and Google Cloud is low or insufficient, and the data size is large. The Data Transfer appliance can minimize the time it takes to complete the migration, the overall cost and database load, by avoiding network bottlenecks and reducing bandwidth consumption. The Data Transfer appliance also encrypts the data at rest and in transit, ensuring data security and privacy. The other options are not optimal for this scenario, because they either require a high-bandwidth network connection (B, C, D), or incur additional costs and complexity (B, C). References: * https://cloud.google.com/data-transfer-appliance/docs/overview * https://cloud.google.com/blog/products/storage-data-transfer/introducing-storage-transfer- service-for- on-premises-data"},{"id":115,"topic":"Altostrat Media Case Study","question":"You are creating an App Engine application that uses Cloud Datastore as its persistence layer. You need to retrieve several root entities for which you have the identifiers. You want to minimize the overhead in operations performed by Cloud Datastore. What should you do?","options":{"A":"Create the Key object for each Entity and run a batch get operation","B":"Create the Key object for each Entity and run multiple get operations, one operation for each entity","C":"Use the identifiers to create a query filter and run a batch query operation","D":"Use the identifiers to create a query filter and run multiple query operations, one operation for each entity"},"answer":["C"],"explanation":"Explanation: https://cloud.google.com/datastore/docs/concepts/entitie s#datastore-datastore-batch-upsert- nodejs"},{"id":116,"topic":"Altostrat Media Case Study","question":"Refer to the Altostrat Media case study for the following solution regarding the performance analysis of their media processing pipeline. Altostrat needs to analyze the performance of its media processing pipeline running on Java-based Cloud Run function. You need to select the most effective tool for the task. What should you do?","options":{"A":"Query logs in Cloud Logging.","B":"Analyze the data via Cloud Profiler.","C":"Instrument the code to use Cloud Trace.","D":"Inspect data from Snapshot Debugger."},"answer":["B"],"explanation":"Explanation: According to Google Cloud documentation on Application Performance Management (APM) , Cloud Profiler is the most effective tool for identifying resource-intensive parts of an application ' s source code. For Altostrat ' s Java-based media processing pipeline, which likely involves CPU-intensive tasks such as metadata extraction or transcoding, understanding exactly which methods or lines of code consume the most CPU or memory is critical. Cloud Profiler is a statistical, low-overhead profiler that continuously gathers performance data (CPU usage, heap allocation, etc.) from production applications with less than 0.5% impact on performance. It presents this data in an interactive flame graph , allowing developers to pinpoint bottlenecks in the media processing logic. While Cloud Trace (Option C) is excellent for monitoring latency across distributed services, it primarily tracks the \" outer shell \" of the request-showing how long a function took to execute or how long an external API call lasted-but does not provide the deep, code-level insight into internal Java method execution that Profiler does. Cloud Logging (Option A) is useful for troubleshooting specific events but is not a performance analysis tool, and Snapshot Debugger (Option D) is designed for inspecting variables at specific execution points rather than aggregate performance profiling. Given Altostrat ' s goal to \" Optimize cloud storage costs \" and \" Accelerate... operational workflows, \" using Cloud Profiler to create more efficient, less resource-hungry processing code is the architecturally sound choice."},{"id":117,"topic":"Altostrat Media Case Study","question":"Your company runs a critical, revenue-generating ecommerce application that is served by a regional managed instance group (MIG) behind an external HTTP(S) Load Balancer. The operations team is currently overwhelmed with low-priority notifications. Your team ' s service level objective (SLO) is to maintain 99.9% availability. You want to minimize noise from non-critical events and ensure that the team is only notified of issues that are actionable and threaten the SLO. What should you do?","options":{"A":"Focus on cause-based alerts, creating alerting policies with thresholds for the Compute Engine instances, including CPU utilization, memory usage, disk I/O, and network traffic.","B":"Configure alerts based on predictive metrics. Use the instance count of the MIG as the primary metric to trigger an alert.","C":"Implement an error budget policy based on the availability of the SLO. Create a \" page \" alert that triggers only when the rate of burn of the error budget predicts a full exhaustion within the next 24 hours.","D":"Create log-based alerts for only the WARN and ERROR log entries generated by the application to ensure that no potential issue is missed."},"answer":["C"],"explanation":"Explanation: According to the Google SRE Handbook , modern monitoring should focus on Symptom-based alerting rather than Cause-based alerting. Option A (Cause-based) leads to \" alert fatigue \" because high CPU or memory usage may not actually be impacting the user experience if the application is still responding successfully. The most effective way to protect a 99.9% availability SLO is to use Error Budgets and Burn Rate Alerting . An error budget is the amount of unreliability your service can tolerate (0.1% for a 99.9% SLO). By implementing an alert that triggers when the burn rate is high enough to exhaust the budget within 24 hours (Option C), the team is only \" paged \" for significant, persistent issues that actually threaten the business goal. Smaller, momentary spikes that don ' t meaningfully impact the long-term SLO can be addressed during normal business hours as \" low-priority tickets. \" This approach significantly reduces noise, improves the signal- to-noise ratio, and ensures that when the team is notified, the issue is critical and requires immediate action to preserve revenue and customer trust."},{"id":118,"topic":"Altostrat Media Case Study","question":"You are designing a central, automated infrastructure deployment process tor your organization using Terraform and Cloud Build The security team prohibits the use of long-lived, static service account keys in any CI/CD pipeline Additionally, while developers can propose infrastructure 68 changes for peer review, they must not have permissions to directly apply changes in the production project. You need to design a secure and automated workflow for applying Terraform changes that meets the security team ' s requirements and ensures proper governance. What should you do?","options":{"A":"Configure the Cloud Build pipeline to use service account impersonation. Set up a trigger that automatically runs terraform apply when a pull request is merged.","B":"Create a privileged service account and store its JSON key in Secret Manager Configure the Cloud Build pipeline to fetch this key during execution to authenticate Terraform.","C":"Configure the pipeline to only run terraform plan. After a pull request Is approved, have an authorized developer run terraform apply from a secured workstation","D":"Use service account impersonation in Cloud Build. Configure the pipeline to run terraform plan on pull requests, and require manual approval before running terraform apply."},"answer":["D"],"explanation":"Explanation: Security best practices in Google Cloud dictate that you should avoid static JSON keys at all costs. * Impersonation: By using Service Account Impersonation (Option D), the Cloud Build service account \" acts as \" a more privileged Terraform service account only during the build. This uses short- lived tokens that expire automatically. * Governance: Running terraform plan on a pull request allows peers to review the exact changes before they happen. Requiring a manual approval step for terraform apply ensures that a human gatekeeper validates the change before it impacts the production environment."},{"id":119,"topic":"Altostrat Media Case Study","question":"The operations team in your company wants to save Cloud VPN log events (or one year You need to configure the cloud infrastructure to save the logs What should you do?","options":{"A":"Set up a filter in Cloud Logging and a topic in Pub/Sub to publish the logs","B":"Set up a Cloud Logging Dashboard titled Cloud VPN Logs, and then add a chart that queries for the VPN metrics over a one-year time period","C":"Enable the Compute Engine API and then enable logging on the firewall rules that match the traffic you want to save","D":"Set up a filter in Cloud Logging and a Cloud Storage bucket as an export target for the logs you want to save"},"answer":["D"],"explanation":""},{"id":120,"topic":"Altostrat Media Case Study","question":"You are onboarding a new developer to your team for a new analytics project. The developer needs to store and manage large Avro files that will be analyzed with BigQuery. You must grant them the ability to read, write, and delete these objects while following the principle of least privilege to ensure they do not have access to any other data or resources in the Google Cloud project. What should you do?","options":{"A":"Create a new Cloud Storage bucket. Grant the developer the roles/storage.objectAdmin IAM role on the bucket.","B":"Create a new Cloud Storage bucket. Grant the developer the roles/storage.objectAdmin IAM role at the project level.","C":"Create a new BigQuery dataset. Grant the developer the roles/bigquery.dataOwner IAM role on the dataset.","D":"Create a new Filestore instance. Grant the developer the roles/file.editor IAM role on the project."},"answer":["A"],"explanation":"Explanation: To adhere to the principle of least privilege, Identity and Access Management (IAM) permissions should be scoped to the smallest resource level necessary. Large Avro source data files intended for ingestion or external processing via BigQuery are stored within Cloud Storage buckets. The roles/storage.objectAdmin role provides the permissions required to create, read, and delete objects within a bucket. Applying this role at the specific resource level (the individual bucket) isolates the developer ' s administrative capabilities to that specific storage boundary. Applying the role at the project level would grant administrative control over every bucket within the project, which violates security best practices. Since the task specifies managing the source Avro files themselves rather than managing native database tables or network file shares, applying Storage Object Admin to the target bucket is the correct solution. References: Cloud Architect (GCP) Study Guide topics: \" IAM Policy Binding Hierarchy \" , \" Cloud Storage IAM Roles \" , \" Principle of Least Privilege Implementation \" , and \" BigQuery External Data Sources \" ."},{"id":121,"topic":"Altostrat Media Case Study","question":"Your marketing department wants to send out a promotional email campaign. The development team wants to minimize direct operation management. They project a wide range of possible customer responses, from 100 to 500,000 click-throughs per day. The link leads to a simple website that explains the promotion and collects user information and preferences. Which infrastructure should you recommend? (CHOOSE TWO)","options":{"A":"Use Google App Engine to serve the website and Google Cloud Datastore to store user data.","B":"Use a Google Container Engine cluster to serve the website and store data to persistent disk.","C":"Use a managed instance group to serve the website and Google Cloud Bigtable to store user data.","D":"Use a single compute Engine virtual machine (VM) to host a web server, backed by Google Cloud SQL."},"answer":["A","C"],"explanation":"Reference: https://cloud.google.com/storage-options/ References: https://cloud.google.com/storage-options/"},{"id":122,"topic":"Altostrat Media Case Study","question":"Your company is running its application workloads on Compute Engine. The applications have been deployed in production, acceptance, and development environments. The production environment is business-critical and is used 24/7, while the acceptance and development environments are only critical during office hours. Your CFO has asked you to optimize these environments to achieve cost savings during idle times . What should you do?","options":{"A":"Use regular Compute Engine instances for the production environment, and use Spot VMs for the acceptance and development environments.","B":"Deploy the development and acceptance applications on a managed instance group and enable autoscaling.","C":"Create a shell script that uses the gcloud command to change the machine type of the development and acceptance instances to a smaller machine type outside of office hours. Schedule the shell script on one of the production instances to automate the task.","D":"Use Instance Schedules to stop the development and acceptance environments after office hours, and start them just before office hours."},"answer":["D"],"explanation":"Explanation: Comprehensive and Detailed Explanation From Exact Extract: The most effective way to achieve significant cost savings for non-production environments that are only needed during business hours is to stop the instances when they are idle. When an instance is stopped, you are only charged for the persistent disks and not for the CPU/RAM. Instance Schedules are the native, managed Google Cloud feature designed specifically for this purpose: automating the starting and stopping of Compute Engine instances on a recurring schedule. * Option D (Use Instance Schedules to stop the development and acceptance environments after office hours, and start them just before office hours) directly addresses the need for cost optimization during idle times with the recommended native solution. * Option A (Spot VMs) are cheap but can be preempted at any time, which isn ' t suitable for critical during office hours environments. * Option B (Autoscaling) scales down when demand is low, but typically won ' t scale completely to zero instances, and will still incur minimum running costs. * Option C (Custom Shell Script) is a manual, non-native solution that requires maintenance and is more complex than the built-in Instance Schedules. Exact Extract Principle: From the Google Cloud documentation on Compute Engine Cost Optimization : \" Instance schedules allow you to schedule when Compute Engine virtual machine instances start and stop. Use instance schedules to automatically start and stop your instances at predefined times. This is a highly recommended practice for cost optimization of non-production environments (development, testing, or staging) that are not needed 24/7, as you are not billed for the instance ' s machine type when it is stopped. \" Reference: Google Cloud Compute Engine Instance Schedules Documentation and Compute Engine Pricing /Cost Optimization Guide."},{"id":123,"topic":"Altostrat Media Case Study","question":"You need to deploy an application to Google Cloud. The application receives traffic via TCP and reads and writes data to the filesystem. The application does not support horizontal scaling. The application process requires full control over the data on the file system because concurrent access causes corruption. The business is willing to accept a downtime when an incident occurs, but the application must be available 24/7 to support their business operations. You need to design the architecture of this application on Google Cloud. What should you do?","options":{"A":"Use a managed instance group with instances in multiple zones, use Cloud Filestore, and use an HTTP load balancer in front of the instances.","B":"Use a managed instance group with instances in multiple zones, use Cloud Filestore, and use a network load balancer in front of the instances.","C":"Use an unmanaged instance group with an active and standby instance in different zones, use a regional persistent disk, and use an HTTP load balancer in front of the instances.","D":"Use an unmanaged instance group with an active and standby instance in different zones, use a regional persistent disk, and use a network load balancer in front of the instances."},"answer":["D"],"explanation":"Reference: https://cloud.google.com/compute/docs/instance-groups"},{"id":124,"topic":"Altostrat Media Case Study","question":"You are tasked with building an online analytical processing (OLAP) marketing analytics and reporting tool. This requires a relational database that can operate on hundreds of terabytes of data. What is the Google recommended tool for such applications?","options":{"A":"Cloud Spanner, because it is globally distributed","B":"Cloud SQL, because it is a fully managed relational database","C":"Cloud Firestore, because it offers real-time synchronization across devices","D":"BigQuery, because it is designed for large-scale processing of tabular data"},"answer":["A"],"explanation":"Reference: https://cloud.google.com/files/BigQueryTechnicalWP.pdf"},{"id":125,"topic":"Altostrat Media Case Study","question":"Your operations team has asked you to help diagnose a performance issue in a production application that runs on Compute Engine. The application is dropping requests that reach it when under heavy load. The process list for affected instances shows a single application process that is consuming all available CPU, and autoscaling has reached the upper limit of instances. There is no abnormal load on any other related systems, including the database. You want to allow production traffic to be served again as quickly as possible. Which action should you recommend?","options":{"A":"Change the autoscaling metric to agent.googleapis.com/memory/percent_used.","B":"Restart the affected instances on a staggered schedule.","C":"SSH to each instance and restart the application process.","D":"Increase the maximum number of instances in the autoscaling group."},"answer":["D"],"explanation":"Reference: https://cloud.google.com/blog/products/sap-google-cloud/best-practices-for-sap-app- server- autoscaling-on-google-cloud"},{"id":126,"topic":"Altostrat Media Case Study","question":"The development team has provided you with a Kubernetes Deployment file. You have no infrastructure yet and need to deploy the application. What should you do?","options":{"A":"Use gcloud to create a Kubernetes cluster. Use Deployment Manager to create the deployment.","B":"Use gcloud to create a Kubernetes cluster. Use kubect1 to create the deployment.","C":"Use kubect1 to create a Kubernetes cluster. Use Deployment Manager to create the deployment.","D":"Use kubect1 to create a Kubernetes cluster. Use kubect1 to create the deployment."},"answer":["B"],"explanation":"Explanation: https://cloud.google.com/ kubernetes-engine/docs/how-to/creating-a-cluster"},{"id":127,"topic":"Altostrat Media Case Study","question":"You deploy your custom Java application to Google App Engine. It fails to deploy and gives you the following stack trace. What should you do?","options":{"A":"Upload missing JAR files and redeploy your application.","B":"Digitally sign all of your JAR files and redeploy your application","C":"Recompile the CLoakedServlet class using and MD5 hash instead of SHA1"},"answer":["B"],"explanation":""},{"id":128,"topic":"Altostrat Media Case Study","question":"Your company is planning to upload several important files to Cloud Storage. After the upload is completed, they want to verify that the upload content is identical to what they have on- premises. You want to minimize the cost and effort of performing this check. What should you do?","options":{"A":"1) Use gsutil -m to upload all the files to Cloud Storage. 2) Use gsutil cp to download the uploaded files 3) Use Linux diff to compare the content of the files","B":"1) Use gsutil -m to upload all the files to Cloud Storage. 2) Develop a custom Java application that computes CRC32C hashes 3) Use gsutil ls -L gs://[YOUR_BUCKET_NAME] to collect CRC32C hashes of the uploaded files 4) Compare the hashes","C":"1) Use Linux shasum to compute a digest of files you want to upload 2) Use gsutil -m to upload all the files to the Cloud Storage 3) Use gsutil cp to download the uploaded files 4) Use Linux shasum to compute a digest of the downloaded files 5.Compre the hashes","D":"1) Use gsutil -m to upload all the files to Cloud Storage. 2) Use gsutil hash -c FILE_NAME to generate CRC32C hashes of all on-premises files 3) Use gsutil ls -L gs://[YOUR_BUCKET_NAME] to collect CRC32C hashes of the uploaded files 4) Compare the hashes"},"answer":["D"],"explanation":"Explanation: https://cloud.google.com/storage/docs/gsutil/commands/hash"},{"id":129,"topic":"Altostrat Media Case Study","question":"You are running a cluster on Kubernetes Engine to serve a web application. Users are reporting that a specific part of the application is not responding anymore. You notice that all pods of your deployment keep restarting after 2 seconds. The application writes logs to standard output. You want to inspect the logs to find the cause of the issue. Which approach can you take?","options":{"A":"Review the Stackdriver logs for each Compute Engine instance that is serving as a node in the cluster.","B":"Review the Stackdriver logs for the specific Kubernetes Engine container that is serving the unresponsive part of the application.","C":"Connect to the cluster using gcloud credentials and connect to a container in one of the pods to read the logs.","D":"Review the Serial Port logs for each Compute Engine instance that is serving as a node in the cluster."},"answer":["B"],"explanation":""},{"id":130,"topic":"Altostrat Media Case Study","question":"You are developing a deep learnin
