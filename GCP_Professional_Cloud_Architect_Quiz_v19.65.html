ty and be active only for the duration of the audit engagement, which runs the entire month of October. You need a secure access control strategy that avoids administrative overhead and complies with your company ' s governance policy. What should you do?","options":{"A":"Use Workforce Identity Federation to map the auditors ' group to the Google Group. Bind the roles /storage.objectViewer role to this Google Group. Configure a 1-month session duration on the provider.","B":"Use Cloud Scheduler to run a Cloud Run functions script that adds the IAM binding of roles/storage. objectViewer to the Google Group on October 1 and another that removes the IAM binding on November 1.","C":"Create a service account, and grant it the roles/storage.objectViewer role on the bucket. Generate and share Signed URLs for each object in the bucket with an expiration date of November 1.","D":"Apply an IAM policy binding that grants the roles/storage.objectViewer role to the Google Group. Configure this binding with a time-based IAM Condition that automatically grants access from October 1 to November 1."},"answer":["D"],"explanation":"Explanation: According to Google Cloud IAM documentation , IAM Conditions are the recommended way to grant temporary, time-bound access without the need for manual intervention or custom automation scripts. By applying a condition to the IAM binding for the Google Group, you can specify an expression that evaluates the current timestamp. If the request occurs between October 1 and November 1, the access is granted; otherwise, it is denied. This satisfies all requirements: * Traceability: Access is tied to the Google Group (and thus individual corporate identities), and all activity is recorded in Cloud Audit Logs. * Temporary Access: It is automatically enforced by the Google Cloud IAM engine without requiring a \" cleanup \" task. * Low Overhead: It avoids the complexity of writing and maintaining scripts (Option B) or managing individual signed URLs (Option C). Option A (Workforce Identity Federation) is used for external identity provider integration but does not inherently manage resource-level access timing as elegantly or simply as an IAM Condition."},{"id":241,"topic":"Altostrat Media Case Study","question":"You need to upload files from your on-premises environment to Cloud Storage. You want the files to be encrypted on Cloud Storage using customer-supplied encryption keys. What should you do?","options":{"A":"Supply the encryption key in a .boto configuration file. Use gsutil to upload the files.","B":"Supply the encryption key using gcloud config. Use gsutil to upload the files to that bucket.","C":"Use gsutil to upload the files, and use the flag --encryption-key to supply the encryption key.","D":"Use gsutil to create a bucket, and use the flag --encryption-key to supply the encryption key. Use gsutil to upload the files to that bucket."},"answer":["A"],"explanation":"Explanation: https://cloud.google.com/storage/docs/encryption/custome r-supplied-ke ys#gsutil"},{"id":242,"topic":"Altostrat Media Case Study","question":"You are building a continuous deployment pipeline for a project stored in a Git source repository and want to ensure that code changes can be verified deploying to production. What should you do?","options":{"A":"Use Spinnaker to deploy builds to production using the red/black deployment strategy so that changes can easily be rolled back.","B":"Use Spinnaker to deploy builds to production and run tests on production deployments.","C":"Use Jenkins to build the staging branches and the master branch. Build and deploy changes to production for 10% of users before doing a complete rollout.","D":"Use Jenkins to monitor tags in the repository. Deploy staging tags to a staging environment for testing.After testing, tag the repository for production and deploy that to the production environment."},"answer":["D"],"explanation":"Reference: https://github.com/GoogleCloudPlatform/continuous-deployment-on- kubernetes/blob/master/ README.md"},{"id":243,"topic":"Altostrat Media Case Study","question":"You are configuring the cloud network architecture for a newly created project m Google Cloud that will host applications in Compote Engine Compute Engine virtual machine instances will be created in two different subnets (sub-a and sub-b) within a single region * Instances in sub-a win have public IP addresses * Instances in sub-b will have only private IP addresses To download updated packages, instances must connect to a public repository outside the boundaries of Google Cloud You need to allow sub-b to access the external repository. What should you do?","options":{"A":"Enable Private Google Access on sub-b","B":"Configure Cloud NAT and select sub b m the NAT mapping section","C":"Configure a bastion host instance in sub a to connect to instances in sub-b","D":"Enable Identity Aware Proxy for TCP forwarding for instances in sub-b"},"answer":["B"],"explanation":"* Cloud NAT (network address translation) lets Google Cloud virtual machine (VM) instances without external IP addresses and private Google Kubernetes Engine (GKE) clusters send outbound packets to the internet and receive any corresponding established inbound response packets 1 . By configuring Cloud NAT and selecting sub-b in the NAT mapping section, you can allow instances in sub-b to access the external repository without exposing them to the internet 1 ."},{"id":244,"topic":"Altostrat Media Case Study","question":"Your company has an application running as a Deployment in a Google Kubernetes Engine (GKE) cluster When releasing new versions of the application via a rolling deployment, the team has been causing outages The root cause of the outages is misconfigurations with parameters that are only used in production You want to put preventive measures for this in the platform to prevent outages What should you do?","options":{"A":"Configure liveness and readiness probes in the Pod specification","B":"Configure an uptime alert in Cloud Monitoring","C":"Create a Scheduled Task to check whether the application is available","D":"Configure health checks on the managed instance group"},"answer":["D"],"explanation":"Explanation: This option can help prevent outages caused by misconfigurations with parameters that are only used in production. Liveness and readiness probes are mechanisms to check the health and availability of the Pods and containers in a GKE cluster. Liveness probes determine if a container is still running, and if not, restart it. Readiness probes determine if a container is ready to serve requests, and if not, remove it from the load balancer. By configuring liveness and readiness probes in the Pod specification, you can ensure that your application can handle traffic and recover from failures gracefully during a rolling update. The other options are not optimal for this scenario, because they either do not prevent outages, but only alert or monitor them (B, C), or do not apply to GKE clusters, but to Compute Engine instances (D). References: * https://cloud.google.com/kubernetes-engine/docs/how-to/updating-apps * https://cloud.google.com/blog/products/containers-kubernetes/kubernetes-best-practices-setting- up- health-checks-with-readiness-and-liveness-probes"},{"id":245,"topic":"Altostrat Media Case Study","question":"Your applications will be writing their logs to BigQuery for analysis. Each application should have its own table. Any logs older than 45 days should be removed. You want to optimize storage and follow Google recommended practices. What should you do?","options":{"A":"Configure the expiration time for your tables at 45 days","B":"Make the tables time-partitioned, and configure the partition expiration at 45 days","C":"Rely on BigQuery's default behavior to prune application logs older than 45 days","D":"Create a script that uses the BigQuery command line tool (bq) to remove records older than 45 days"},"answer":["B"],"explanation":"Explanation: https://cloud.google.co m/bigquery/docs/managing-partitioned-tables"},{"id":246,"topic":"Altostrat Media Case Study","question":"Your company has announced that they will be outsourcing operations functions. You want to allow developers to easily stage new versions of a cloud-based application in the production environment and allow the outsourced operations team to autonomously promote staged versions to production. You want to minimize the operational overhead of the solution. Which Google Cloud product should you migrate to?","options":{"A":"App Engine","B":"GKE On-Prem","C":"Compute Engine","D":"Google Kubernetes Engine"},"answer":["A"],"explanation":"Reference: https://cloud.google.com/security/compliance/eba-outsourcing-mapping-gcp"},{"id":247,"topic":"Altostrat Media Case Study","question":"Your company has successfully migrated to the cloud and wants to analyze their data stream to optimize operations. They do not have any existing code for this analysis, so they are exploring all their options. These options include a mix of batch and stream processing, as they are running some hourly jobs and live- processing some data as it comes in. Which technology should they use for this?","options":{"A":"Google Cloud Dataproc","B":"Google Cloud Dataflow","C":"Google Container Engine with Bigtable","D":"Google Compute Engine with Google BigQuery"},"answer":["B"],"explanation":"Explanation: Dataflow is for processing both the Batch and Stream. Cloud Dataflow is a fully-managed service for transforming and enriching data in stream (real time) and batch (historical) modes with equal reliability and expressiveness -- no more complex workarounds or compromises needed. References: https://cloud.google.com/dataflow/"},{"id":248,"topic":"Altostrat Media Case Study","question":"The application reliability team at your company has added a debug feature to their backend service to send all server events to Google Cloud Storage for eventual analysis. The event records are at least 50 KB and at most 15 MB and are expected to peak at 3,000 events per second. You want to minimize data loss. Which process should you implement?","options":{"A":"* Append metadata to file body. * Compress individual files. * Name files with serverName-Timestamp. * Create a new bucket if bucket is older than 1 hour and save individual files to the new bucket. Otherwise, save files to existing bucket","B":"* Batch every 10,000 events with a single manifest file for metadata. * Compress event files and manifest file into a single archive file. * Name files using serverName-EventSequence. * Create a new bucket if bucket is older than 1 day and save the single archive file to the new bucket. Otherwise, save the single archive file to existing bucket.","C":"* Compress individual files. * Name files with serverName-EventSequence. * Save files to one bucket * Set custom metadata headers for each object after saving.","D":"* Append metadata to file body. * Compress individual files. * Name files with a random prefix pattern. * Save files to one bucket"},"answer":["D"],"explanation":"Explanation: In order to maintain a high request rate, avoid using sequential names. Using completely random object names will give you the best load distribution. Randomness after a common prefix is effective under the prefix https://cloud.google.com/storage/docs/reque st-rate"},{"id":249,"topic":"Altostrat Media Case Study","question":"You need to develop procedures to test a disaster plan for a mission-critical application. You want to use Google-recommended practices and native capabilities within GCP. What should you do?","options":{"A":"Use Deployment Manager to automate service provisioning. Use Activity Logs to monitor and debug your tests.","B":"Use Deployment Manager to automate provisioning. Use Stackdriver to monitor and debug your tests.","C":"Use gcloud scripts to automate service provisioning. Use Activity Logs monitor and debug your tests.","D":"Use automated scripts to automate service provisioning. Use Activity Logs monitor and debug your tests."},"answer":["B"],"explanation":"Explanation: https://cloud.goo gle.com/solutions/dr-scenarios-planning-guide"},{"id":250,"topic":"Altostrat Media Case Study","question":"You want to automate the creation of a managed instance group and a startup script to install the OS package dependencies. You want to minimize the startup time for VMs in the instance group. What should you do?","options":{"A":"Use Terraform to create the managed instance group and a startup script to install the OS package dependencies.","B":"Create a custom VM image with all OS package dependencies. Use Deployment Manager to create the managed instance group with the VM image.","C":"Use Puppet to create the managed instance group and install the OS package dependencies.","D":"Use Deployment Manager to create the managed instance group and Ansible to install the OS package dependencies."},"answer":["B"],"explanation":"Explanation: \" Custom images are more deterministic and start more quickly than instances with startup scripts. However, startup scripts are more flexible and let you update the apps and settings in your instances more easily. \" https://cloud.google.com/compute/do cs/instance-templates/create-instance- templates#using_custom_or_pu blic_images_in_your_instance_temp lates"},{"id":251,"topic":"Altostrat Media Case Study","question":"You are designing a mobile chat application. You want to ensure people cannot spoof chat messages, by providing a message were sent by a specific user. What should you do","options":{"A":"Tag messages client side with the originating user identifier and the destination user.","B":"Encrypt the message client side using block-based encryption with a shared key.","C":"Use public key infrastructure (PKI) to encrypt the message client side using the originating user ' s private key.","D":"Use a trusted certificate authority to enable SSL connectivity between the client application and the server."},"answer":["C"],"explanation":""},{"id":252,"topic":"Altostrat Media Case Study","question":"You are creating a solution to remove backup files older than 90 days from your backup Cloud Storage bucket. You want to optimize ongoing Cloud Storage spend. What should you do?","options":{"A":"Write a lifecycle management rule in XML and push it to the bucket with gsutil.","B":"Write a lifecycle management rule in JSON and push it to the bucket with gsutil.","C":"Schedule a cron script using gsutil is -lr gs://backups/** to find and remove items older than 90 days.","D":"Schedule a cron script using gsutil ls -1 gs://backups/** to find and remove items older than 90 days and schedule it with cron."},"answer":["B"],"explanation":"Explanation: https://cloud.google.com/storage/docs/gsutil/commands/lifecycle "},{"id":253,"topic":"Altostrat Media Case Study","question":"Your customer wants to capture multiple GBs of aggregate real-time key performance indicators (KPIs) from their game servers running on Google Cloud Platform and monitor the KPIs with low latency. How should they capture the KPIs?","options":{"A":"Store time-series data from the game servers in Google Bigtable, and view it using Google Data Studio.","B":"Output custom metrics to Stackdriver from the game servers, and create a Dashboard in Stackdriver Monitoring Console to view them.","C":"Schedule BigQuery load jobs to ingest analytics files uploaded to Cloud Storage every ten minutes, and visualize the results in Google Data Studio.","D":"Insert the KPIs into Cloud Datastore entities, and run ad hoc analysis and visualizations of them in Cloud Datalab."},"answer":["A"],"explanation":"Explanation: https://cloud .google.com/mo nitoring/api/v3/metrics-details#metric-kinds"},{"id":254,"topic":"Altostrat Media Case Study","question":"Your solution is producing performance bugs in production that you did not see in staging and test environments. You want to adjust your test and deployment procedures to avoid this problem in the future. What should you do?","options":{"A":"Deploy fewer changes to production.","B":"Deploy smaller changes to production.","C":"Increase the load on your test and staging environments.","D":"Deploy changes to a small subset of users before rolling out to production."},"answer":["C"],"explanation":""},{"id":255,"topic":"Altostrat Media Case Study","question":"Your company has just recently activated Cloud Identity to manage users. The Google Cloud Organization has been configured as wed. The security learn needs to secure protects that will be part of the Organization. They want to prohibit IAM users outside the domain from gaining permissions from now on. What should they do?","options":{"A":"Configure an organization policy to restrict identities by domain","B":"Configure an organization policy to block creation of service accounts","C":"Configure Cloud Scheduler to trigger a Cloud Function every hour that removes all users that don ' t belong to the Cloud identity domain from all projects."},"answer":["A"],"explanation":"* An organization policy is a mechanism to configure constraints across your entire resource hierarchy 1 . By configuring an organization policy to restrict identities by domain, you can specify which domains are allowed or denied when granting IAM roles to users, groups, or service accounts 2 . This way, you can prohibit IAM users outside the domain from gaining permissions from now on 2 ."},{"id":256,"topic":"Altostrat Media Case Study","question":"Your development team has installed a new Linux kernel module on the batch servers in Google Compute Engine (GCE) virtual machines (VMs) to speed up the nightly batch process. Two days after the installation, 132 50% of web application deployed in the same nightly batch run. You want to collect details on the failure to pass back to the development team. Which three actions should you take? Choose 3 answers","options":{"A":"Use Stackdriver Logging to search for the module log entries.","B":"Read the debug GCE Activity log using the API or Cloud Console.","C":"Use gcloud or Cloud Console to connect to the serial console and observe the logs.","D":"Identify whether a live migration event of the failed server occurred, using in the activity log.","E":"Adjust the Google Stackdriver timeline to match the failure time, and observe the batch server metrics.","F":"Export a debug VM into an image, and run the image on a local server where kernel log messages will be displayed on the native screen."},"answer":["A","C","E"],"explanation":"Explanation: https://www.flexera.com/blog/cloud/2013/1 2/google-compute-engine-live-migration-passes-the- test/ \" With live migration, the virtual machines are moved without any downtime or noticeable service degradation \""},{"id":257,"topic":"Altostrat Media Case Study","question":"You want to allow your operations learn to store togs from all the production protects in your Organization, without during logs from other projects All of the production projects are contained in a folder. You want to ensure that all logs for existing and new production projects are captured automatically. What should you do?","options":{"A":"Create an aggregated export on the Production folder. Set the log sink to be a Cloud Storage bucket in an operations project","B":"Create an aggregated export on the Organization resource. Set the tog sink to be a Cloud Storage bucket in an operations project.","C":"Create log exports in the production projects. Set the log sinks to be a Cloud Storage bucket in an operations project.","D":"Create tog exports in the production projects. Set the tog sinks to be BigQuery datasets in the production projects and grant IAM access to the operations team to run queries on the datasets"},"answer":["A"],"explanation":"* An aggregated export is a type of sink that combines and routes log entries from the Google Cloud resources contained by an organization or folder 1 . By creating an aggregated export on the Production folder, you can capture all the logs from the existing and new production projects in that folder automatically 1 . * A log sink is a destination for log entries that match a filter 1 . By setting the log sink to be a Cloud Storage bucket in an operations project, you can store the log entries in Cloud Storage and allow your operations team to access them 1 ."},{"id":258,"topic":"Altostrat Media Case Study","question":"Your web application uses Google Kubernetes Engine to manage several workloads. One workload requires a consistent set of hostnames even after pod scaling and relaunches. Which feature of Kubernetes should you use to accomplish this?","options":{"A":"StatefulSets","B":"Role-based access control","C":"Container environment variables","D":"Persistent Volumes"},"answer":["A"],"explanation":"Explanation: https://kubernetes.io/docs/tutor ials/stateful-application/basic-stateful-set/"},{"id":259,"topic":"Altostrat Media Case Study","question":"A lead software engineer tells you that his new application design uses websockets and HTTP sessions that are not distributed across the web servers. You want to help him ensure his application will run property on Google Cloud Platform. What should you do?","options":{"A":"Help the engineer to convert his websocket code to use HTTP streaming.","B":"Review the encryption requirements for websocket connections with the security team.","C":"Meet with the cloud operations team and the engineer to discuss load balancer options.","D":"Help the engineer redesign the application to use a distributed user session service that does not rely on websockets and HTTP sessions."},"answer":["C"],"explanation":"Explanation: Google Cloud Platform (GCP) HTTP(S) load balancing provides global load balancing for HTTP(S) requests destined for your instances. The HTTP(S) load balancer has native support for the WebSocket protocol. References: https://cloud.google.com/compute/docs/load-balancing/http/"},{"id":260,"topic":"Altostrat Media Case Study","question":"Your ecommerce platform uses a regional Cloud SQL for PostgreSQL database to store critical order information. The business requests a recovery time objective (RTO) of less than 10 minutes and a recovery point objective (RPO) of 2 minutes to ensure business continuity in the event of a full regional outage. You need to design a disaster recovery strategy for the Cloud SQL database that meets the business ' s strict RTO and RPO requirements. Your design must avoid operational complexity. What should you do?","options":{"A":"Configure the Cloud SQL instance with a cross-region read replica. In a disaster, promote the read replica to a standalone, primary instance.","B":"Use Database Migration Service to continuously replicate the database to another instance in a different region. In a disaster, redirect application traffic to the replica.","C":"Schedule hourly automated backups of the Cloud SQL instance to a multi-regional Cloud Storage bucket. In a disaster, restore the latest backup to a new instance in a different region.","D":"Configure the primary instance for high availability (HA). In the event of a regional outage, trigger a failover to the standby instance."},"answer":["A"],"explanation":"Explanation: A full regional outage disables an entire Google Cloud region, including all internal availability zones. Standard High Availability (HA) configuration for Cloud SQL operates exclusively as an intra-region, cross- zone failover mechanism; it cannot survive a comprehensive regional disaster. Similarly, point -in-time recovery utilizing automated hourly backups cannot satisfy a strict 2-minute RPO requirement, as data generated between the last backup and the outage would be lost. To satisfy an RPO of 2 minutes and an RTO of under 10 minutes during a total regional loss, a cross- region read replica must be maintained. Cloud SQL uses asynchronous replication to update cross- region replicas, which continuously mirrors transactions with minimal lag, safely preserving data in a geographically separated region. When the primary region drops, administrative promotion of the cross-region read replica into a standalone read-write primary instance can be completed in minutes, successfully meeting both the availability goals and minimizing complexity. References: Cloud Architect (GCP) Study Guide topics: \" Cloud SQL High Availability vs Disaster Recovery \" , \" Cross-Region Replication Mechanics \" , and \" Promoting Read Replicas for Business Continuity \" ."},{"id":261,"topic":"Altostrat Media Case Study","question":"Your product learn is building a critical, customer-facing application on Google Cloud The development team wants to use Spanner for their database to take advantage of its horizontal scalability and low operational overhead However, the FinOps team is concerned about the direct monthly cost of Spanner and proposed using a self-managed PostgreSQL database on Compute Engine VMs instead. You need to resolve this conflict and ensure the project moves forward with an architecturally sound database choice that balances technical requirements with financial constraints. What should you do?","options":{"A":"Suggest using Cloud SQL for PostgreSQL as a compromise to get a managed service at a lower cost than Spanner.","B":"Develop a total cost of ownership (TCO) analysis that includes operational overhead, and present it m a workshop to facilitate a decision.","C":"Provide the development team with a reference architecture for deploying a highly available PostgreSQL cluster on a regional managed instance group (MIG).","D":"Cite the reliability and performance optimization pillars of the Google Cloud Well-Architected Framework to formally justify the use of Spanner."},"answer":["B"],"explanation":"Explanation: This question highlights the classic conflict between Sticker Price (direct cost) and Operational Expense (OpEx). While a Compute Engine VM running PostgreSQL (Option C) looks cheaper on a monthly bill, it ignores the cost of human labor. A Total Cost of Ownership (TCO) analysis (Option B) is the professional architectural approach to resolve this. It accounts for the salary of DBAs required to manage sharding, patching, and manual failovers-tasks that Spanner handles automatically. For a \" critical, customer-facing application \" requiring horizontal scale, the TCO will almost always show that Spanner is cheaper in the long run because it reduces the \" 900-hour time sink \" of manual database maintenance."},{"id":262,"topic":"Altostrat Media Case Study","question":"You are monitoring Google Kubernetes Engine (GKE) clusters in a Cloud Monitoring workspace. As a Site Reliability Engineer (SRE), you need to triage incidents quickly. What should you do?","options":{"A":"Navigate the predefined dashboards in the Cloud Monitoring workspace, and then add metrics and create alert policies.","B":"Navigate the predefined dashboards in the Cloud Monitoring workspace, create custom metrics, and install alerting software on a Compute Engine instance.","C":"Write a shell script that gathers metrics from GKE nodes, publish these metrics to a Pub/Sub topic, export the data to BigQuery, and make a Data Studio dashboard.","D":"Create a custom dashboard in the Cloud Monitoring workspace for each incident, and then add metrics and create alert policies."},"answer":["A"],"explanation":"Explanation: https://cloud.google.com/stackdriver/docs/solutions/gke/legacy-stackdriver/monitoring"},{"id":263,"topic":"Altostrat Media Case Study","question":"You created a pipeline that can deploy your source code changes to your infrastructure in instance groups for self healing. One of the changes negatively affects your key performance indicator. You are not sure how to fix it and investigation could take up to a week. What should you do","options":{"A":"Log in to a server, and iterate a fix locally","B":"Change the instance group template to the previous one, and delete all instances.","C":"Revert the source code change and rerun the deployment pipeline","D":"Log into the servers with the bad code change, and swap in the previous code"},"answer":["C"],"explanation":""},{"id":264,"topic":"Altostrat Media Case Study","question":"Your customer runs a web service used by e-commerce sites to offer product recommendations to users. The company has begun experimenting with a machine learning model on Google Cloud Platform to improve the quality of results. What should the customer do to improve their model's results over time?","options":{"A":"Export Cloud Machine Learning Engine performance metrics from Stackdriver to BigQuery, to be used to analyze the efficiency of the model.","B":"Build a roadmap to move the machine learning model training from Cloud GPUs to Cloud TPUs, which offer better results.","C":"Monitor Compute Engine announcements for availability of newer CPU architectures, and deploy the model to them as soon as they are available for additional performance.","D":"Save a history of recommendations and results of the recommendations in BigQuery, to be used as training data."},"answer":["D"],"explanation":"Explanation: https://cloud.google.c om/solutions/building-a-serverl ess-ml-model"},{"id":265,"topic":"Altostrat Media Case Study","question":"Refer to the Altostrat Media case study for the following solution regarding API management and cost control. Altostrat is using Apigee for API management and wants to ensure their APIs are protected from overuse and abuse. You need to implement an Apigee feature to control the total number of API calls for cost management. What should you do?","options":{"A":"Set up API key validation.","B":"Integrate OAuth 2.0 authorization.","C":"Configure Quota policies.","D":"Activate XML threat protection."},"answer":["C"],"explanation":"Explanation: According to the Apigee API Platform documentation , the Quota policy is the primary mechanism used to enforce business-level constraints by limiting the number of request messages an API proxy allows over a specific period of time (such as a minute, hour, day, week, or month). For a media company like Altostrat, which aims to \" unlock new revenue streams through targeted marketing \" and \" drive revenue growth, \" managing API consumption is critical for cost predictability and monetization strategies. Google Cloud distinguishes between Spike Arrest and Quota policies . While Spike Arrest is designed for operational safety-protecting backend systems from sudden traffic bursts-the Quota policy is specifically used to enforce business contracts, Service Level Agreements (SLAs), and cost management . By configuring a Quota policy, Altostrat can ensure that no single consumer or application exceeds the total volume of calls that would result in unexpected infrastructure costs or exceed the limits of their current subscription tier. Options A and B (API Key and OAuth) are essential for authentication and authorization -identifying who is making the call-but they do not inherently limit the volume of calls. Option D (XML threat protection) is a security measure to prevent malformed payload attacks. Therefore, to meet the specific business requirement of \" Reliability and cost management, \" implementing Quota policies within Apigee is the architecturally correct choice to prevent API abuse and manage operational expenditure."},{"id":266,"topic":"Altostrat Media Case Study","question":"Auditors visit your teams every 12 months and ask to review all the Google Cloud Identity and Access Management (Cloud IAM) policy changes in the previous 12 months. You want to streamline and expedite the analysis and audit process. What should you do?","options":{"A":"Create custom Google Stackdriver alerts and send them to the auditor.","B":"Enable Logging export to Google BigQuery and use ACLs and views to scope the data shared with the auditor.","C":"Use cloud functions to transfer log entries to Google Cloud SQL and use ACLS and views to limit an auditor ' s view.","D":"Enable Google Cloud Storage (GCS) log export to audit logs Into a GCS bucket and delegate access to the bucket."},"answer":["D"],"explanation":"Explanation: Export the logs to Google Cloud Storage bucket - Archive Storage, as it will not be used for 1 year, price for which is $0.004 per GB per Month. The price for long term storage in BigQuery is $0.01 per GB per Month (250% more). Also for analysis purpose, whenever Auditors are there(once per year), you can use BigQuery and use GCS bucket as external data source. BigQuery supports querying Cloud Storage data from these storage classes: Standard Nearline Coldline Archive"},{"id":267,"topic":"Altostrat Media Case Study","question":"Your company has an application running on multiple Compute Engine instances. You need to ensure that the application can communicate with an on-premises service that requires high throughput via internal IPs, while minimizing latency. What should you do?","options":{"A":"Use OpenVPN to configure a VPN tunnel between the on-premises environment and Google Cloud.","B":"Configure a direct peering connection between the on-premises environment and Google Cloud.","C":"Use Cloud VPN to configure a VPN tunnel between the on-premises environment and Google Cloud.","D":"Configure a Cloud Dedicated Interconnect connection between the on-premises environment and Google Cloud."},"answer":["D"],"explanation":"Explanation: Reference https://cloud.google.com/architecture/setting-up-private-access-to-cloud-apis-through- vpn-tunnels"},{"id":268,"topic":"Altostrat Media Case Study","question":"Your company is developing a web-based application. You need to make sure that production deployments are linked to source code commits and are fully auditable. What should you do?","options":{"A":"Make sure a developer is tagging the code commit with the date and time of commit","B":"Make sure a developer is adding a comment to the commit that links to the deployment.","C":"Make the container tag match the source code commit hash.","D":"Make sure the developer is tagging the commits with :latest"},"answer":["C"],"explanation":"Explanation: From: https://cloud.google.com/architecture/best-practices-for-building-containers Under: Tagging using the Git commit hash (bottom of page almost) \" In this case, a common way of handling version numbers is to use the Git commit SHA-1 hash (or a short version of it) as the version number. By design, the Git commit hash is immutable and references a specific version of your software. You can use this commit hash as a version number for your software, but also as a tag for the Docker image built from this specific version of your software. Doing so makes Docker images traceable: because in this case the image tag is immutable, you instantly know which specific version of your software is running inside a given container. \""},{"id":269,"topic":"Altostrat Media Case Study","question":"You are managing a multi-tenant SaaS application on Google Kubernetes Engine (GKE). Your platform team uses a GitOps workflow to manage all application deployments. For each new customer, you must provision an isolated set of Google Cloud resources, including a Cloud SQL database and a Pub/Sub topic. A key requirement is that the entire lifecycle of a customer ' s infrastructure must be tied directly to a corresponding Kubernetes object. When that object is deleted from the cluster, all of its associated cloud resources must be automatically de-provisioned. You also need to minimize operational complexity for the platform team. What should you do?","options":{"A":"Write a custom Kubernetes Operator in Go that directly calls the Google Cloud APIs to create or delete the required resources. Define a new Tenant Custom Resource Definition (CRD) that the operator will watch to trigger the provisioning or de-provisioning logic.","B":"Create a reusable Terraform module for the resources. Configure a Cloud Build pipeline with two triggers on your Git repository: one that runs terraform apply when a customer configuration file is added, and another that runs terraform destroy when the same file is deleted.","C":"Install the Terraform Operator in your cluster. Create a reusable Terraform module for the resources. For each customer, create a Terraform custom resource manifest that references this module, and manage its lifecycle via your GitOps process.","D":"Use Config Connector to install Google Cloud resource Custom Resource Definitions (CRDs) into your GKE cluster. Create a custom Helm chart that bundles the YAML manifests for the necessary resources. Manage the lifecycle of these resources by creating or deleting the Helm release in the cluster."},"answer":["D"],"explanation":"Explanation: Config Connector is an open-source Kubernetes add-on that allows operators to manage Google Cloud resources using native Kubernetes configuration files, APIs, and Custom Resource Definitions (CRDs). By deploying Config Connector within a GKE cluster, infrastructure components such as a Cloud SQL instance or Pub/Sub topics are declared natively as Kubernetes objects. This model aligns with GitOps delivery patterns (e.g., using ArgoCD or Flux). When a Helm release bundling these manifests is deleted or uninstalled from the cluster, the GKE control plane processes the deletion event, and the Config Connector controller automatically triggers downstream calls to delete the corresponding Google Cloud infrastructure. This design avoids the operational complexity of writing, maintaining, and debugging a custom Go-based operator. It also provides a cleaner, more native Kubernetes reconciliation loop compared to running externalized Terraform pipelines or wrappers inside the cluster. References: Cloud Architect (GCP) Study Guide topics: \" Config Connector Integration with GKE \" , \" Declarative Infrastructure Management \" , \" GitOps Implementation Patterns \" , and \" Custom Resource Definitions (CRDs) \" ."},{"id":270,"topic":"Altostrat Media Case Study","question":"As part of implementing their disaster recovery plan, your company is trying to replicate their production MySQL database from their private data center to their GCP project using a Google Cloud VPN connection. They are experiencing latency issues and a small amount of packet loss that is disrupting the replication. What should they do?","options":{"A":"Configure their replication to use UDP.","B":"Configure a Google Cloud Dedicated Interconnect.","C":"Restore their database daily using Google Cloud SQL.","D":"Add additional VPN connections and load balance them.","E":"Send the replicated transaction to Google Cloud Pub/Sub."},"answer":["B"],"explanation":""},{"id":271,"topic":"Altostrat Media Case Study","question":"Your company just finished a rapid lift and shift to Google Compute Engine for your compute needs. You have another 9 months to design and deploy a more cloud-native solution. Specifically, you want a system that is no-ops and auto-scaling. Which two compute products should you choose? Choose 2 answers","options":{"A":"Compute Engine with containers","B":"Google Kubernetes Engine with containers","C":"Google App Engine Standard Environment","D":"Compute Engine with custom instance types","E":"Compute Engine with managed instance groups"},"answer":["B","C"],"explanation":"Explanation: B: With Container Engine, Google will automatically deploy your cluster for you, update, patch, secure the nodes. Kubernetes Engine ' s cluster autoscaler automatically resizes clusters based on the demands of the workloads you want to run. C: Solutions like Datastore, BigQuery, AppEngine, etc are truly NoOps. App Engine by default scales the number of instances running up and down to match the load, thus providing consistent performance for your app at all times while minimizing idle instances and thus reducing cost. Note: At a high level, NoOps means that there is no infrastructure to build out and manage during usage of the platform. Typically, the compromise you make with NoOps is that you lose control of the underlying infrastructure. References: https://www.quora.com/How-well-does-Google-Container-Engine-support-Google- Cloud- Platform%E2 %80%99s-NoOps-claim"},{"id":272,"topic":"Altostrat Media Case Study","question":"Your company operates nationally and plans to use GCP for multiple batch workloads, including some that are not time-critical. You also need to use GCP services that are HIPAA-certified and manage service costs. How should you design to meet Google best practices?","options":{"A":"Provisioning preemptible VMs to reduce cost. Discontinue use of all GCP services and APIs that are not HIPAA-compliant.","B":"Provisioning preemptible VMs to reduce cost. Disable and then discontinue use of all GCP and APIs that are not HIPAA-compliant.","C":"Provision standard VMs in the same region to reduce cost. Discontinue use of all GCP services and APIs that are not HIPAA-compliant.","D":"Provision standard VMs to the same region to reduce cost. Disable and then discontinue use of all GCP services and APIs that are not HIPAA-compliant."},"answer":["B"],"explanation":"Explanation: https://cloud.google.com/security/co mpliance/hipaa/"},{"id":273,"topic":"Altostrat Media Case Study","question":"A production database virtual machine on Google Compute Engine has an ext4-formatted persistent disk for data files The database is about to run out of storage space How can you remediate the problem with the least amount of downtime?","options":{"A":"In the Cloud Platform Console, increase the size of the persistent disk and use the resize2fs command in Linux.","B":"Shut down the virtual machine, use the Cloud Platform Console to increase the persistent disk size, then restart the virtual machine.","C":"In the Cloud Platform Console, increase the size of the persistent disk and verify the new space is ready to use with the fdisk command in Linux.","D":"In the Cloud Platform Console, create a new persistent disk attached to the virtual machine, format and mount it, and configure the database service to move the files to the new disk.","E":"In the Cloud Platform Console, create a snapshot of the persistent disk, restore the snapshot to a new larger disk, unmount the old disk, mount the new disk, and restart the database service."},"answer":["A"],"explanation":"Explanation: On Linux instances, connect to your instance and manually resize your partitions and file systems to use the additional disk space that you added. Extend the file system on the disk or the partition to use the added space. If you grew a partition on your disk, specify the partition. If your disk does not have a partition table, specify only the disk ID. sudo resize2fs /dev/[DISK_ID] [PARTITION_NUMBER] where [DISK_ID] is the device name and [PARTITION_NUMBER] is the partition number for the device where you are resizing the file system. References: https://cloud.google.com/c ompute/docs/disks/add-persistent-disk"},{"id":274,"topic":"Altostrat Media Case Study","question":"You are designing a new insurance claims processing application that will be deployed on Google Kubernetes Engine (GKE). Your company ' s compliance team requires a complete and non- repudiable audit trail for all administrative actions from day one. Your application must capture who deploys a new container image, who modifies the GKE cluster ' s configuration, and who interacts with running pods or Kubernetes secrets using kubectl. What should you do?","options":{"A":"Enable Binary Authorization on the GKE cluster and create a policy that requires all deployed container images to be signed by a trusted attestor.","B":"Enable GKE Audit Logging to send Kubernetes API server logs to Cloud Logging, and ensure Cloud Audit Logs are enabled for the project.","C":"Activate the Security Command Center Premium tier to analyze GKE logs and detect threats, vulnerabilities, and misconfigurations in real time.","D":"Deploy a DaemonSet to every node in the GKE cluster that runs a logging agent to collect and forward all container logs to Cloud Logging."},"answer":["B"],"explanation":"Explanation: According to GKE Security documentation , Kubernetes API Server Audit Logging is the primary source of truth for administrative actions within a cluster. This feature captures every call made to the API server, including those made via kubectl, the Cloud Console, or automated controllers. By enabling GKE Audit Logging and ensuring Cloud Audit Logs (specifically Admin Activity and Data Access logs) are active, you fulfill the requirement for a non-repudiable trail. This log will contain: * Who: The identity of the caller (the IAM user or service account). * What: The action taken (e.g., create pod, get secret, patch deployment). * When: The timestamp of the operation. Option A (Binary Authorization) is a preventative control, not an audit logging tool. Option C (Security Command Center) is for threat detection, not for maintaining a raw audit trail. Option D (DaemonSet) collects application logs from within containers, but cannot capture administrative API calls like \" modifying cluster configuration \" or \" accessing secrets \" made through the Kubernetes control plane."},{"id":275,"topic":"Altostrat Media Case Study","question":"Your company has developed a monolithic, 3-tier application to allow external users to upload and share files. The solution cannot be easily enhanced and lacks reliability. The development team would like to re- architect the application to adopt microservices and a fully managed service approach, but they need to convince their leadership that the effort is worthwhile. Which advantage(s) should they highlight to leadership?","options":{"A":"The new approach will be significantly less costly, make it easier to manage the underlying infrastructure, and automatically manage the CI/CD pipelines.","B":"The monolithic solution can be converted to a container with Docker. The generated container can then be deployed into a Kubernetes cluster.","C":"The new approach will make it easier to decouple infrastructure from application, develop and release new features, manage the underlying infrastructure, manage CI/CD pipelines and perform A/B testing, and scale the solution if necessary.","D":"The process can be automated with Migrate for Compute Engine."},"answer":["C"],"explanation":"Explanation: The new approach will make it easier to decouple infrastructure from an application, develop and release new features, manage the underlying infrastructure, manage CI/CD pipelines and perform A/B testing, and scale the solution if necessary."},{"id":276,"topic":"Altostrat Media Case Study","question":"Your team plans to use Vertex AI to develop and deploy machine learning models for various use cases for fraud detection, product recommendations, and customer churn prediction. You want to enhance the security posture of the Vertex AI and Workbench environment by restricting data exfiltration. What should you do?","options":{"A":"Create a service perimeter and include ml.googleapis.com and document.googleapis.com as protected services.","B":"Enable VPC Flow Logs to monitor network traffic to and from Vertex AI services and to identify suspicious activity.","C":"Create a service perimeter and include aiplatform.googleapis.com and notebooks.googleapis.com as protected services.","D":"Enable Private Google Access for the VPC network to allow Vertex AI services to access public Google services without traversing the public internet."},"answer":["C"],"explanation":"Explanation: According to the Google Cloud Security Foundations Guide and VPC Service Controls (VPC-SC) documentation, the most effective way to prevent data exfiltration is to establish a service perimeter . This perimeter creates a virtual boundary that prevents sensitive data from being moved to unauthorized projects or outside the Google Cloud network. For the Vertex AI environment specifically, the two critical services that must be protected are aiplatform. googleapis.com (the core Vertex AI API) and notebooks.googleapis.com (which governs Vertex AI Workbench instances). Including these in a service perimeter ensures that data within the Cymbal Retail project cannot be copied to external Cloud Storage buckets or other unauthorized APIs, even if a user has valid IAM permissions. Option A is incorrect because ml.googleapis.com is the legacy AI Platform API, and document.googleapis. com (Document AI) does not cover the broader Vertex AI or Workbench environment. Option B (VPC Flow Logs) provides visibility but is a detective control, not a preventative one against exfiltration. Option D (Private Google Access) allows internal IPs to reach Google APIs but does not restrict where that data can go once the connection is made. Therefore, Option C provides the robust, enterprise- grade security required for sensitive data like fraud detection and customer churn models."},{"id":277,"topic":"Altostrat Media Case Study","question":"You manage a highly distributed, hybrid- and multi-cloud IT environment and your developers rely heavily on Prometheus for their workflows. You need a cloud-based, highly scalable, low-maintenance enterprise solution that supports Prometheus Query Language (PromQL) queries, quick metric viewing, and efficient issue diagnosis. What should you do?","options":{"A":"Deploy a Prometheus operator in your existing Kubernetes and Serverless setup across multi-cloud environments.","B":"Build a SaaS-based, Prometheus-compatible solution to display metrics for each cloud in a customizable way.","C":"Enable Google Cloud Managed Service for Prometheus to monitor and alert on your workloads at scale.","D":"Set up Cloud Monitoring as a single pane of glass across multi-cloud environments."},"answer":["C"],"explanation":"Explanation: According to Google Cloud ' s Observability documentation , Google Cloud Managed Service for Prometheus (GMP) is the recommended enterprise solution for monitoring multi-cloud and hybrid environments while maintaining full PromQL compatibility. GMP is a fully managed, multi-cloud solution that lets you monitor and alert on your workloads at scale without having to manually manage the storage, availability, or scaling of your Prometheus servers. It supports global aggregation of metrics, allowing developers to query data from multiple clusters and clouds (AWS, Azure, On-prem) using a single query interface. This satisfies the \" low- maintenance \" and \" scalable \" requirements while preserving the existing workflows developers are comfortable with. Option D is a general monitoring solution but doesn ' t offer the native, drop-in PromQL compatibility that GMP provides."},{"id":278,"topic":"Altostrat Media Case Study","question":"Altostrat stores a large library of media content, including sensitive interviews and documentaries, in Cloud Storage. They are concerned about the confidentiality of this content and want to protect it from unauthorized access. You need to implement a Google-recommended solution that is easy to integrate and provides Altostrat with control and auditability of the encryption keys. What should you do?","options":{"A":"Configure Cloud Storage to use server-side encryption with Google-managed encryption keys. Create a bucket policy to restrict access to only authorized Google groups and required service accounts.","B":"Use Cloud Storage default encryption at rest. Implement fine-grained access control using IAM roles and groups to restrict access to sensitive buckets.","C":"Implement client-side encryption before uploading it to Cloud Storage. Store the encryption keys in a HashiCorp Vault instance deployed on Google Kubernetes Engine (GKE). Implement fine-grained access control to sensitive Cloud Storage buckets using IAM roles.","D":"Use customer-managed encryption keys (CMEK) for all Cloud Storage buckets storing sensitive media content. Implement fine-grained access control using IAM roles and groups to restrict access to sensitive buckets."},"answer":["D"],"explanation":"Explanation: According to Google Cloud Architecture Framework and Cloud KMS documentation , when a customer requires direct control and auditability over the encryption keys used for data at rest, Customer-Managed Encryption Keys (CMEK) is the recommended path. While Google Cloud encrypts all data at rest by default using Google-managed keys (Option B), Altostrat specifically requires control and auditability . By using CMEK through Cloud Key Management Service (Cloud KMS) , Altostrat can manage the key rotation schedules, revoke access to keys immediately to \" kill \" access to the data, and view detailed logs in Cloud Audit Logs every time the key is used to encrypt or decrypt a media asset. Option D is superior to Option C because client-side encryption with a self-managed HashiCorp Vault adds significant operational overhead and complexity, contradicting the business requirement to \" Simplify infrastructure management . \" CMEK integrates natively with Cloud Storage, allowing for a seamless experience while meeting the strict security requirements for sensitive documentaries and interviews. Furthermore, the use of IAM roles and groups for fine-grained access control aligns with the principle of least privilege, ensuring that only authorized service accounts and users can access the sensitive buckets and the keys required to decrypt them."},{"id":279,"topic":"Altostrat Media Case Study","question":"Your team is developing a web application that will be deployed on Google Kubernetes Engine (GKE). Your CTO expects a successful launch and you need to ensure your application can handle the expected load of tens of thousands of users. You want to test the current deployment to ensure the latency of your application stays below a certain threshold. What should you do?","options":{"A":"Use a load testing tool to simulate the expected number of concurrent users and total requests to your application, and inspect the results.","B":"Enable autoscaling on the GKE cluster and enable horizontal pod autoscaling on your application deployments. Send curl requests to your application, and validate if the auto scaling works.","C":"Replicate the application over multiple GKE clusters in every Google Cloud region. Configure a global HTTP (S) load balancer to expose the different clusters over a single global IP address.","D":"Use Cloud Debugger in the development environment to understand the latency between the different microservices."},"answer":["A"],"explanation":""},{"id":280,"topic":"Altostrat Media Case Study","question":"You are a cloud architect for a healthcare organization that is running its containerized, stateless web applications on Google Kubernetes Engine (GKE) with Autoscaler enabled. These customer-facing services have a strict 99.5% availability requirement. You also run nightly batch processing jobs for data analysis that are fault-tolerant and can be stopped and restarted. You need to ensure the solution meets the availability SLA while minimizing compute costs wherever possible. What should you do?","options":{"A":"Create two separate GKE node pools. Use a node pool of Standard VMs for the web applications and another node pool of Spot VMs for the batch jobs.","B":"Create two separate GKE node pools using Standard VMs for both. Purchase one-year committed use discounts (CUDs) for the resources in the batch processing node pool.","C":"Configure the GKE cluster with a single node pool of Standard VMs to run both workloads.","D":"Create two separate GKE node pools. Use a node pool with Spot VMs for the web applications and a node pool with Standard VMs for the batch jobs."},"answer":["A"],"explanation":"Explanation: Optimizing infrastructure costs while maintaining workload availability requires matching application runtime characteristics with appropriate Compute Engine instance purchasing models. Stateless, customer-facing web applications require deterministic availability to meet a 99.5% SLA, making Standard VMs the required choice to prevent unexpected disruptions. Conversely, nightly batch processing jobs are fault-tolerant and capable of handling interruptions. Running these batch jobs on a separate node pool composed of Spot VMs allows the organization to take advantage of deeply discounted compute resources (up to 60-91% cheaper than on-demand pricing). Since Spot VMs can be reclaimed by Compute Engine at any time with a 30-second termination notice, they are ideal for stateless batch jobs, while remaining isolated from the critical web application node pool. This approach maximizes cost efficiency without introducing availability risks to customer-facing traffic. References: Cloud Architect (GCP) Study Guide topics: \" GKE Node Pool Optimization \" , \" Compute Engine Spot VM Lifecycles \" , \" Designing Cost-Optimized Architectures \" , and \" Workload Isolation Strategies \" ."},{"id":281,"topic":"Altostrat Media Case Study","question":"Your company provides a recommendation engine for retail customers. You are providing retail customers with an API where they can submit a user ID and the API returns a list of recommendations for that user. You are responsible for the API lifecycle and want to ensure stability for your customers in case the API makes backward-incompatible changes. You want to follow Google-recommended practices. What should you do?","options":{"A":"Create a distribution list of all customers to inform them of an upcoming backward-incompatible change at least one month before replacing the old API with the new API.","B":"Create an automated process to generate API documentation, and update the public API documentation as part of the CI/CD process when deploying an update to the API.","C":"Use a versioning strategy for the APIs that increases the version number on every backward- incompatible change.","D":"Use a versioning strategy for the APIs that adds the suffix \"DEPRECATED\" to the current API version number on every backward-incompatible change. Use the current version number for the new API."},"answer":["D"],"explanation":"Explanation: https://cloud.google.com/apis/design/versioning All Google API interfaces must provide a major version number, which is encoded at the end of the protobuf package, and included as the first part of the URI path for REST APIs. If an API introduces a breaking change, such as removing or renaming a field, it must increment its API version number to ensure that existing user code does not suddenly break."},{"id":282,"topic":"Altostrat Media Case Study","question":"The operations manager asks you for a list of recommended practices that she should consider when migrating a J2EE application to the cloud. Which three practices should you recommend? Choose 3 answers","options":{"A":"Port the application code to run on Google App Engine.","B":"Integrate Cloud Dataflow into the application to capture real-time metrics.","C":"Instrument the application with a monitoring tool like Stackdriver Debugger.","D":"Select an automation framework to reliably provision the cloud infrastructure.","E":"Deploy a continuous integration tool with automated testing in a staging environment.","F":"Migrate from MySQL to a managed NoSQL database like Google Cloud Datastore or Bigtable."},"answer":["A","E","F"],"explanation":"References: https://cloud.google.com/appengine/docs/standard/java/tools/uploadinganapp https://cloud.google.com/appengine/docs/standard/java/building-app/cloud-sql"},{"id":283,"topic":"Altostrat Media Case Study","question":"You are migrating third-party applications from optimized on-premises virtual machines to Google Cloud. 145 You are unsure about the optimum CPU and memory options. The application have a consistent usage patterns across multiple weeks. You want to optimize resource usage for the lowest cost. What should you do?","options":{"A":"Create a Compute engine instance with CPU and Memory options similar to your application's current on-premises virtual machine. Install the cloud monitoring agent, and deploy the third party application. Run a load with normal traffic levels on third party application and follow the Rightsizing Recommendations in the Cloud Console","B":"Create an App Engine flexible environment, and deploy the third party application using a Docker file and a custom runtime. Set CPU and memory options similar to your application's current on- premises virtual machine in the app.yaml file.","C":"Create an instance template with the smallest available machine type, and use an image of the third party application taken from the current on-premises virtual machine. Create a managed instance group that uses average CPU to autoscale the number of instances in the group. Modify the average CPU utilization threshold to optimize the number of instances running.","D":"Create multiple Compute Engine instances with varying CPU and memory options. Install the cloud monitoring agent and deploy the third-party application on each of them. Run a load test with high traffic levels on the application and use the results to determine the optimal settings."},"answer":["A"],"explanation":"Explanation: Create a Compute engine instance with CPU and Memory options similar to your application's current on- premises virtual machine. Install the cloud monitoring agent, and deploy the third party application. Run a load with normal traffic levels on third party application and follow the Rightsizing Recommendations in the Cloud Console https://cloud.google.com/migrate/compute-engine/docs/4.9/concepts/planning-a-migration/cloud- instance-rightsizing?hl=en"},{"id":284,"topic":"Altostrat Media Case Study","question":"You are leading a large-scale Google Cloud implementation project Your development teams need to deploy applications, but they lack deep expertise in cloud-native patterns. This leads to inconsistent and insecure deployments, such as GKE clusters without proper logging and overly permissive 1AM roles. You need to implement a system that empowers these teams to deploy complete, pre-approved architectural patterns in a self-service manner. The system must ensure security and consistency by default while maintaining high developer velocity and avoiding manual approval bottlenecks. What should you do?","options":{"A":"Create a central Cloud Monitoring dashboard and a set of custom alerts that fire whenever a non- compliant resource is detected","B":"Enforce a mandatory CI ' CD pipeline using Cloud Build that requires every Terraform deployment to be reviewed and approved before the Terraform apply step can run.","C":"Use Service Catalog to define, govern, and offer a portfolio of approved products Include Terraform scripts into Service Catalog items.","D":"Use a combination of organization policies to restrict resource configurations and 1AM recommender to periodically suggest improvements."},"answer":["C"],"explanation":"Explanation: The core challenge in this scenario is balancing developer velocity with security guardrails . When teams lack cloud expertise, they often create \" snowflake \" environments that are insecure (e.g., permissive IAM) or poorly configured (e.g., missing GKE logging). Service Catalog (Option C) is the specific Google Cloud solution designed for this \" Curated Self- Service \" model. It allows central IT or Platform teams to create a portfolio of pre-approved templates (using Terraform or Deployment Manager). * Security by Default: The Terraform scripts can be written to include hardened settings, such as private GKE clusters, mandatory logging, and \" Least Privilege \" IAM roles. * Velocity: Instead of waiting for manual reviews (which Option B proposes), developers simply select the \" Approved GKE Cluster \" from the catalog and click \" Deploy. \" * Why not D? Organization policies are essential \" guardrails \" that block bad actions, but they don ' t provide a way to deploy complex, multi-resource architectures. Service Catalog provides the \" building blocks \" rather than just the \" stop signs. \""},{"id":285,"topic":"Altostrat Media Case Study","question":"You deploy your custom java application to google app engine. It fails to deploy and gives you the following stack trace:","options":{"A":"Recompile the CLoakedServlet class using and MD5 hash instead of SHA1","B":"Digitally sign all of your JAR files and redeploy your application.","C":"Upload missing JAR files and redeploy your application"},"answer":["B"],"explanation":""},{"id":286,"topic":"Altostrat Media Case Study","question":"Your company wants to optimize Google Cloud costs for their development and staging environments. These environments are workstations used by developers Monday through Friday, 9:00 AM to 6:00 PM local time. Currently, the environments run on a fleet of n1-standard-4 Compute Engine instances that operate 24/7, leading to a high monthly cost for resources that are idle more than 70% of the time. You need to implement a solution that significantly reduces the monthly cost of these non-production environments without impacting the development team ' s productivity during work hours. What should you do?","options":{"A":"Upgrade all instances to the N2 machine series.","B":"Purchase three-year committed use discounts (CUDs) for the existing n1-standard-4 instances.","C":"Re-architect the environments to run on a regional managed instance group (MIG) with autoscaling enabled.","D":"Schedule the virtual machines to start and stop to match your team ' s work schedule."},"answer":["D"],"explanation":"Explanation: The most direct and impactful way to reduce costs for predictable, time-bound workloads is to stop resources when they are not in use . According to the Google Cloud Architecture Framework: Cost Optimization , Compute Engine instances are billed per second while running. By scheduling instances to run only from 9:00 AM to 6:00 PM on weekdays, the instances are active for only 45 hours out of a 168-hour week. This results in a cost reduction of approximately 73% . While Committed Use Discounts (CUDs) (Option B) provide significant savings (up to 57-70%), they require paying for the resources 24/7 for the duration of the commitment. Even with a 70% discount, paying for 24/7 usage is more expensive than paying full price for only 27% of the week. Autoscaling (Option C) is generally more effective for handling fluctuating traffic loads rather than developer workstations, which are often stateful or individual-specific. Instance Scheduling is a native Compute Engine feature that allows administrators to define start and stop operations automatically, ensuring that productivity is maintained by having the machines ready when developers start their day, while maximizing savings during off-hours."},{"id":287,"topic":"Altostrat Media Case Study","question":"Your company is forecasting a sharp increase in the number and size of Apache Spark and Hadoop jobs being run on your local datacenter You want to utilize the cloud to help you scale this upcoming demand with the least amount of operations work and code change. Which product should you use?","options":{"A":"Google Cloud Dataflow","B":"Google Cloud Dataproc","C":"Google Compute Engine","D":"Google Container Engine"},"answer":["B"],"explanation":"Explanation: Google Cloud Dataproc is a fast, easy-to-use, low-cost and fully managed service that lets you run the Apache Spark and Apache Hadoop ecosystem on Google Cloud Platform. Cloud Dataproc provisions big or small clusters rapidly, supports many popular job types, and is integrated with other Google Cloud Platform services, such as Google Cloud Storage and Stackdriver Logging, thus helping you reduce TCO. References: https://cloud.google.com/dataproc/docs/resources/faq"},{"id":288,"topic":"Altostrat Media Case Study","question":"Google Cloud Platform resources are managed hierarchically using organization, folders, and projects. When Cloud Identity and Access Management (IAM) policies exist at these different levels, what is the effective policy at a particular node of the hierarchy?","options":{"A":"The effective policy is determined only by the policy set at the node","B":"The effective policy is the policy set at the node and restricted by the policies of its ancestors","C":"The effective policy is the union of the policy set at the node and policies inherited from its ancestors","D":"The effective policy is the intersection of the policy set at the node and policies inherited from its ancestors"},"answer":["B"],"explanation":"Reference: https://cloud.google.com/resource-manager/docs/cloud-platform-resource-hierarchy l"},{"id":289,"topic":"Altostrat Media Case Study","question":"You team needs to create a Google Kubernetes Engine (GKE) cluster to host a newly built application that requires access to third-party services on the internet. Your company does not allow any Compute Engine instance to have a public IP address on Google Cloud. You need to create a deployment strategy that adheres to these guidelines. What should you do?","options":{"A":"Create a Compute Engine instance, and install a NAT Proxy on the instance. Configure all workloads on GKE to pass through this proxy to access third-party services on the Internet","B":"Configure the GKE cluster as a private cluster, and configure Cloud NAT Gateway for the cluster subnet","C":"Configure the GKE cluster as a route-based cluster. Configure Private Google Access on the Virtual Private Cloud (VPC)","D":"Configure the GKE cluster as a private cluster. Configure Private Google Access on the Virtual Private Cloud (VPC)"},"answer":["B"],"explanation":"Explanation: A Cloud NAT gateway can perform NAT for nodes and Pods in a private cluster, which is a type of VPC- native cluster. The Cloud NAT gateway must be configured to apply to at least the following subnet IP address ranges for the subnet that your cluster uses: Subnet primary IP address range (used by nodes) Subnet secondary IP address range used for Pods in the cluster Subnet secondary IP address range used for Services in the cluster The simplest way to provide NAT for an entire private cluster is to configure a Cloud NAT gateway to apply to all of the cluster ' s subnet ' s IP address ranges. https://cloud.google.com/nat/docs/overview"},{"id":290,"topic":"Altostrat Media Case Study","question":"Your company has just recently activated Cloud Identity to manage users. The Google Cloud Organization has been configured as wed. The security learn needs to secure protects that will be part of the Organization. They want to prohibit IAM users outside the domain from gaining permissions from now on. What should they do?","options":{"A":"Configure an organization policy to restrict identities by domain","B":"Configure an organization policy to block creation of service accounts","C":"Configure Cloud Scheduler o trigger a Cloud Function every hour that removes all users that don ' t belong to the Cloud identity domain from all projects.","D":"Create a technical user (e g . crawler@yourdomain com), and give it the protect owner rote at root organization level Write a bash script that * Lists all me IAM rules of all projects within the organization * Deletes all users that do not belong to the company domain Create a Compute Engine instance m a project within the Organization and configure gcloud to be executed with technical user credentials Configure a cron job that executes the bash script every hour."},"answer":["C"],"explanation":"Explanation: https://cloud.google.com/resource-manager/docs/organization-policy/restricting-domains"},{"id":291,"topic":"Altostrat Media Case Study","question":"You created a Cloud Monitoring dashboard for your dev environment to view real-time application metrics The Ops team wants a similar dashboard to monitor the production environment. You want to minimize time and effort as you assist the Ops team with their dashboard request What should you do?","options":{"A":"Export your dashboard to a JSON file and share it with the Ops team.","B":"Create a shared document and list every step you performed lo create the dashboard. The Ops team can use the document to build their own dashboard.","C":"Grant viewer permission to the Ops team in your project so they can recreate the charts in their dashboard from the console.","D":"Share your dashboard and send the shared dashboard URL to the Ops team"},"answer":["A"],"explanation":"Explanation: To replicate a dashboard across different projects (e.g., from Dev to Prod) with minimal effort, JSON Export /Import (Option A) is the standard method. * Portability: Cloud Monitoring dashboards are defined as JSON objects. You can copy the JSON from the \" Code Editor \" or export it, and the Ops team can simply paste it into their own project. * Why not D? Sharing a URL only gives access to the existing dashboard in the Dev project. It does not help the Ops team create a new one in the Production project that points to production metrics."},{"id":292,"topic":"Altostrat Media Case Study","question":"Your organization has a 3-tier web application deployed in the same network on Google Cloud Platform. Each tier (web, API, and database) scales independently of the others Network traffic should flow through the web to the API tier and then on to the database tier. Traffic should not flow between the web and the database tier. How should you configure the network?","options":{"A":"Add each tier to a different subnetwork.","B":"Set up software based firewalls on individual VMs.","C":"Add tags to each tier and set up routes to allow the desired traffic flow.","D":"Add tags to each tier and set up firewall rules to allow the desired traffic flow."},"answer":["D"],"explanation":"Explanation: https://aws.amazon.com/blo gs/aws/building-thre e-tier-architectures-with-security-groups/ Google Cloud Platform(GCP) enforces firewall rules through rules and tags. GCP rules and tags can be defined once and used across all regions. References: https://cloud.google.com/docs/compare/openstack/ https://aws.amazon.c om/it/blogs/aws/building-three-tier-architectures-with-s ecurity-groups/"},{"id":293,"topic":"Altostrat Media Case Study","question":"You company has a Kubernetes application that pulls messages from Pub/Sub and stores them in Firestore. Because the application is simple, it was deployed as a single pod. The infrastructure team has analyzed Pub /Sub metrics and discovered that the application cannot process the messages in real time. Most of them wait for minutes before being processed. You need to scale the elaboration process that is I/O- intensive. What should you do?","options":{"A":"Configure a Kubernetes autoscaling based on the subscription/push_request metric.","B":"Use the -enable- autoscaling flag when you create the Kubernetes cluster","C":"Configure a Kubernetes autoscaling based on the subscription/num_undelivered message metric.","D":"Use kubectl autoscale deployment APP_NAME -max 6 -min 2 -cpu- percent 50 to configure Kubernetes autoscaling deployment"},"answer":["A"],"explanation":"Explanation: https://cloud.google.com/kubernetes-engine/docs/concepts/custom-a nd-external- metrics#external_metrics"},{"id":294,"topic":"Altostrat Media Case Study","question":"Your organization requires that metrics from all applications be retained for 5 years for future analysis in possible legal proceedings. Which approach should you use?","options":{"A":"Grant the security team access to the logs in each Project.","B":"Configure Stackdriver Monitoring for all Projects, and export to BigQuery.","C":"Configure Stackdriver Monitoring for all Projects with the default retention policies.","D":"Configure Stackdriver Monitoring for all Projects, and export to Google Cloud Storage."},"answer":["D"],"explanation":"Explanation: Overview of storage classes, price, and use cases https://cloud.google.com/storage/docs/storage- classes Why export logs? https://cloud.google.com/logging/docs/export/ StackDriver Quotas and Limits for Monitoring https://cloud.google.c om/monitoring/quotas The BigQuery pricing. https://clou d.google.com/bigquery/pricing"},{"id":295,"topic":"Altostrat Media Case Study","question":"You are deploying a critical application with a stateless, containerized (rented on Cloud Run and a Cloud SQL tor PostgreSQL backend The application experiences unpredictable traffic spikes, and the business requires the ability to immediately roll back a failed deployment to the last known good state You need to apply a deployment strategy that aligns with Site Reliability Engineering (SRE) principles for both the application code and the database schema updates, while meeting the business ' s requirements What should you do?","options":{"A":"Configure the CI/CD pipeline to use the: latest Last container tag for deployments, with database schema changes applied manually as needed.","B":"Use a single CI/CD pipeline that first applies database schema changes and then deploys the new Cloud Run revision","C":"Separate CI/CD pipelines for database schema migrations from application deployments When deploying a new Cloud Run revision, use gradual traffic split.","D":"Package the database schema migration script within the container to be executed on every container startup before the application process begins."},"answer":["C"],"explanation":"Explanation: In SRE (Site Reliability Engineering), the goal is to decouple components to reduce the \" blast radius \" of changes. * Separation of Concerns: Database schema migrations and application code should have separate pipelines (Option C). If a schema update is backward-compatible (a requirement for zero-downtime), the app can be rolled back independently. * Traffic Management: Cloud Run supports gradual traffic splitting , allowing you to send 5% of traffic to a new revision. If errors spike, you can immediately shift 100% of traffic back to the old revision. * Why not D? Running migrations on container startup is a common \" anti-pattern \" in large-scale systems because if 100 containers start at once, they might all try to modify the schema simultaneously, leading to lock contention or database corruption."},{"id":296,"topic":"Altostrat Media Case Study","question":"Your company has decided to make a major revision of their API in order to create better experiences for their developers. They need to keep the old version of the API available and deployable, while allowing new customers and testers to try out the new API. They want to keep the same SSL and DNS records in place to serve both APIs. What should they do?","options":{"A":"Configure a new load balancer for the new version of the API.","B":"Reconfigure old clients to use a new endpoint for the new API.","C":"Have the old API forward traffic to the new API based on the path.","D":"Use separate backend pools for each API path behind the load balancer."},"answer":["D"],"explanation":"Explanation: https://cloud.google.com/endpoints/docs/openapi/lifecycle-management"},{"id":297,"topic":"Altostrat Media Case Study","question":"The database administration team has asked you to help them improve the performance of their new database server running on Google Compute Engine. The database is for importing and normalizing their performance statistics and is built with MySQL running on Debian Linux. They have an n1-standard-8 virtual machine with 80 GB of SSD persistent disk. What should they change to get better performance from this system?","options":{"A":"Increase the virtual machine ' s memory to 64 GB.","B":"Create a new virtual machine running PostgreSQL.","C":"Dynamically resize the SSD persistent disk to 500 GB.","D":"Migrate their performance metrics warehouse to BigQuery.","E":"Modify all of their batch jobs to use bulk inserts into the database."},"answer":["C"],"explanation":""},{"id":298,"topic":"A
