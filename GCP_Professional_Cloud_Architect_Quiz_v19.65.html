ltostrat Media Case Study","question":"For this question, refer to the TerramEarth case study. You are building a microservice- based application for TerramEarth. The application is based on Docker containers. You want to follow Google-recommended practices to build the application continuously and store the build artifacts. What should you do?","options":{"A":"1. Configure a trigger in Cloud Build for new source changes. 2. Invoke Cloud Build to build one container image, and tag the image with the label ' latest. ' 3. Push the image to the Artifact Registry.","B":"1. Configure a trigger in Cloud Build for new source changes. 2. Invoke Cloud Build to build container images for each microservice, and tag them using the code commit hash. 3. Push the images to the Artifact Registry.","C":"1 Create a Scheduler job to check the repo every minute. 2. For any new change, invoke Cloud Build to build container images for the microservices. 3. Tag the images using the current timestamp, and push them to the Artifact Registry.","D":"1. Configure a trigger in Cloud Build for new source changes. 2. The trigger invokes build jobs and build container images for the microservices. 3. Tag the images with a version number, and push them to Cloud Storage."},"answer":["C"],"explanation":""},{"id":299,"topic":"Altostrat Media Case Study","question":"You have an outage in your Compute Engine managed instance group: all instance keep restarting after 5 seconds. You have a health check configured, but autoscaling is disabled. Your colleague, who is a Linux expert, offered to look into the issue. You need to make sure that he can access the VMs. What should you do?","options":{"A":"Grant your colleague the IAM role of project Viewer","B":"Perform a rolling restart on the instance group","C":"Disable the health check for the instance group. Add his SSH key to the project-wide SSH keys","D":"Disable autoscaling for the instance group. Add his SSH key to the project-wide SSH Keys"},"answer":["C"],"explanation":"Explanation: https://cloud. google.com/compute/docs/instance-groups/au tohealing-instances-in-migs Health checks used for autohealing should be conservative so they don ' t preemptively delete and recreate your instances. When an autohealer health check is too aggressive, the autohealer might mistake busy instances for failed instances and unnecessarily restart them, reducing availability"},{"id":300,"topic":"Altostrat Media Case Study","question":"You need to ensure reliability for your application and operations by supporting reliable task a scheduling for compute on GCP. Leveraging Google best practices, what should you do?","options":{"A":"Using the Cron service provided by App Engine, publishing messages directly to a message- processing utility service running on Compute Engine instances.","B":"Using the Cron service provided by App Engine, publish messages to a Cloud Pub/Sub topic. Subscribe to that topic using a message-processing utility service running on Compute Engine instances.","C":"Using the Cron service provided by Google Kubernetes Engine (GKE), publish messages directly to a message-processing utility service running on Compute Engine instances.","D":"Using the Cron service provided by GKE, publish messages to a Cloud Pub/Sub topic. Subscribe to that topic using a message-processing utility service running on Compute Engine instances."},"answer":["B"],"explanation":"Explanation: https://cloud.google.com/solu tions/reliable-task-scheduling-compute-engine"},{"id":301,"topic":"Altostrat Media Case Study","question":"Your company captures all web traffic data in Google Analytics 260 and stores it in BigQuery. Each country has its own dataset. Each dataset has multiple tables. You want analysts from each country to be able to see and query only the data for their respective countries. How should you configure the access rights?","options":{"A":"Create a group per country. Add analysts to their respective country-groups. Create a single group 'all_analysts', and add all country-groups as members. Grant the 'all-analysis' group the IAM role of BigQuery jobUser. Share the appropriate dataset with view access with each respective analyst country- group.","B":"Create a group per country. Add analysts to their respective country-groups. Create a single group 'all_analysts', and add all country-groups as members. Grant the 'all-analysis' group the IAM role of BigQuery jobUser. Share the appropriate tables with view access with each respective analyst countrygroup.","C":"Create a group per country. Add analysts to their respective country-groups. Create a single group 'all_analysts', and add all country-groups as members. Grant the 'all-analysis' group the IAM role of BigQuery dataViewer. Share the appropriate dataset with view access with each respective analyst country-group.","D":"Create a group per country. Add analysts to their respective country-groups. Create a single group 'all_analysts', and add all country-groups as members. Grant the 'all-analysis' group the IAM role of BigQuery dataViewer. Share the appropriate table with view access with each respective analyst countrygroup."},"answer":["A"],"explanation":""},{"id":302,"topic":"Altostrat Media Case Study","question":"Your company is running a stateless application on a Compute Engine instance. The 153 application is used heavily during regular business hours and lightly outside of business hours. Users are reporting that the application is slow during peak hours. You need to optimize the application's performance. What should you do?","options":{"A":"Create a snapshot of the existing disk. Create an instance template from the snapshot. Create an autoscaled managed instance group from the instance template.","B":"Create a snapshot of the existing disk. Create a custom image from the snapshot. Create an autoscaled managed instance group from the custom image.","C":"Create a custom image from the existing disk. Create an instance template from the custom image. Create an autoscaled managed instance group from the instance template.","D":"Create an instance template from the existing disk. Create a custom image from the instance template.Create an autoscaled managed instance group from the custom image."},"answer":["B"],"explanation":"Explanation: https://cloud.google.com/compute/docs/instance-templates/create-instance-templa tes"},{"id":303,"topic":"Altostrat Media Case Study","question":"A financial services company is decommissioning one of its on-premises data centers. As part of this initiative, the company needs to perform a one-time migration of 500 TB of historical transaction archives to a Cloud Storage bucket for long-term retention. The data center ' s internet egress is 1 Gbps, which is shared with critical business operations. You must complete the secure data transfer within a 60-day window to meet the decommissioning deadline. What should you do?","options":{"A":"Order a Transfer Appliance, copy the data to the appliance using your high-speed local network, and ship it back to Google to upload the data into your Cloud Storage bucket.","B":"Use Storage Transfer Service to create an agent-based transfer job that moves the data from the on- premises file servers directly to the Cloud Storage bucket.","C":"Provision a Partner Interconnect connection with a 10 Gbps capacity to accelerate the data transfer, and then use Storage Transfer Service.","D":"Write a script that uses the gcloud storage cp --parallel command to upload the data in chunks over the public internet during off-peak hours."},"answer":["A"],"explanation":"Explanation: According to Google Cloud ' s data transfer decision tree , physical migration using Transfer Appliance is the recommended solution when network bandwidth is a bottleneck. For 500 TB of data on a 1 Gbps link, the theoretical transfer time at 100% saturation is approximately 58 days ($500 \\times 10^{12} \\text{ bytes} / 125 \\times 10^6 \\text{ bytes per second} \\approx 4.6 \\times 10^6 \\text{ seconds}$). However, since the bandwidth is shared with critical business operations , saturating the link is not feasible. Transfer Appliance is a high-capacity storage server that you lease from Google. You connect it to your local network, perform a high-speed local transfer (typically 10 Gbps or higher), and then ship it back to a Google data center where the data is ingested into Cloud Storage. This bypasses the limitations and risks of the shared internet connection, ensures the data is encrypted both at rest and in transit (meeting security requirements), and easily fits within the 60-day decommissioning window. While Storage Transfer Service (Option B) is excellent for online transfers, it cannot overcome the physics of a limited 1 Gbps shared pipe. Interconnect (Option C) is generally reserved for permanent hybrid connectivity rather than one-time migrations due to the lead time and setup costs involved."},{"id":304,"topic":"Altostrat Media Case Study","question":"Your company has a Google Cloud project that uses BigQuery for data warehousing. The VPN tunnel between the on-premises environment and Google Cloud is configured with Cloud VPN. Your security team wants to avoid data exfiltration by malicious insiders, compromised code, and accidental oversharing. What should you do?","options":{"A":"Configure VPC Service Controls and configure Private Google Access for on-premises hosts.","B":"Create a service account, grant the BigQuery JobUser role and Storage Object Viewer role to the service account, and remove all other Identity and Access Management (1AM) access from the project.","C":"Configure Private Google Access.","D":"Configure Private Service Connect."},"answer":["A"],"explanation":"Explanation: To secure data from exfiltration by malicious insiders, compromised code or accidental oversharing, we use VPC Service controls https://cloud.google.com/vpc-service-controls/docs/overview For private access options, connect to services in VPC networks we use private service endpoints or VPC network peering. https://cloud.google.com/vpc/docs/private-access-options#connect-services"},{"id":305,"topic":"Altostrat Media Case Study","question":"You are working at a sports association whose members range in age from 8 to 30. The association collects a large amount of health data, such as sustained injuries. You are storing this data in BigQuery. Current legislation requires you to delete such information upon request of the subject. You want to design a solution that can accommodate such a request. What should you do?","options":{"A":"Use a unique identifier for each individual. Upon a deletion request, delete all rows from BigQuery with this identifier.","B":"When ingesting new data in BigQuery, run the data through the Data Loss Prevention (DLP) API to identify any personal information. As part of the DLP scan, save the result to Data Catalog. Upon a deletion request, query Data Catalog to find the column with personal information.","C":"Create a BigQuery view over the table that contains all data. Upon a deletion request, exclude the rows that affect the subject's data from this view. Use this view instead of the source table for all analysis tasks.","D":"Use a unique identifier for each individual. Upon a deletion request, overwrite the column with the unique identifier with a salted SHA256 of its value."},"answer":["A"],"explanation":"Explanation: Current legislation requires you to delete \" SUCH \" information upon request of the subject. \" So from that point of view the question is not to delete the entire user records but specific data related to personal health data. With DLP you can use InfoTypes and InfoType detectors to specifically scan for those entries and how to act upon them (link https://cloud.google.com/dlp/docs/concepts-infotypes ) https://cloud.google.com/dlp#section-6"},{"id":306,"topic":"Altostrat Media Case Study","question":"You are managing several internal applications that are deployed on Compute Engine. Business users inform you that an application has become very slow over the past few days. You 155 want to find the underlying cause in order to solve the problem. What should you do first?","options":{"A":"Inspect the logs and metrics from the instances in Cloud Logging and Cloud Monitoring.","B":"Restore a backup of the application database from a time before the application became slow.","C":"Deploy the applications on a managed instance group with autoscaling enabled. Add a load balancer in front of the managed instance group, and have the users connect to the IP of the load balancer.","D":"Change the Compute Engine Instances behind the application to a machine type with more CPU and memory."},"answer":["A"],"explanation":"Explanation: When an application becomes slow, the first step you should take is to gather information about the underlying cause of the problem. One way to do this is by inspecting the logs and metrics from the instances where the application is deployed. Google Cloud Platform (GCP) provides tools such as Cloud Logging and Cloud Monitoring that can help you to collect and analyze this information. By reviewing the logs and metrics from the instances, you may be able to identify issues such as resource shortages (e.g. CPU, memory, or disk), network problems, or application errors that are causing the performance issues. Once you have identified the underlying cause of the problem, you can take steps to resolve it."},{"id":307,"topic":"Altostrat Media Case Study","question":"You are designing me observability strategy for a new microservices application running on Google Kubernetes Engine (GKE) The application consists of multiple services (e.g.. frontend, orders, payments). During load testing, you observe an error in the frontend service ' s logs, but you cannot find the corresponding logs in the downstream services to investigate the root cause because the logs are not correlated. You need to implement a solution that allows you to follow a single user request across all microservices involved in the transaction. The solution must not require developers to manually add correlation logic to their application code What should you do?","options":{"A":"Require developers to generate a unique correlation-id at the frontend. and manually add it as a field to every log message in all services.","B":"Configure all containers to write logs to STDOUTSTDERR. and then filter logs by pod name and timestamp m the Logs Explorer","C":"Implement Cloud Trace by ensuring the traceparent header is propagated between microservice calls to link logs to a single trace","D":"Create custom metrics in Cloud Monitoring for error counts in each service and correlate incident spikes using a shared dashboard"},"answer":["C"],"explanation":"Explanation: To follow a user request through a maze of microservices, you need Distributed Tracing . * Cloud Trace: By ensuring the traceparent (W3C standard) header is propagated (Option C), Google Cloud can automatically link logs from the Frontend, Orders, and Payments services. * Zero Manual Effort: Modern libraries (like OpenTelemetry) handle the \" heavy lifting \" of extracting and injecting these headers into outgoing requests, satisfying the requirement to avoid manual correlation logic."},{"id":308,"topic":"Altostrat Media Case Study","question":"Your company is migrating its on-premises data center into the cloud. As part of the 156 migration, you want to integrate Kubernetes Engine for workload orchestration. Parts of your architecture must also be PCI DSScompliant. Which of the following is most accurate?","options":{"A":"App Engine is the only compute platform on GCP that is certified for PCI DSS hosting.","B":"Kubernetes Engine cannot be used under PCI DSS because it is considered shared hosting.","C":"Kubernetes Engine and GCP provide the tools you need to build a PCI DSS-compliant environment.","D":"All Google Cloud services are usable because Google Cloud Platform is certified PCI-compliant."},"answer":["D"],"explanation":"Explanation: http s://cloud.google.com/security/compliance/pci-dss"},{"id":309,"topic":"Altostrat Media Case Study","question":"A development team at your company has created a dockerized HTTPS web application. You need to deploy the application on Google Kubernetes Engine (GKE) and make sure that the application scales automatically. How should you deploy to GKE?","options":{"A":"Use the Horizontal Pod Autoscaler and enable cluster autoscaling. Use an Ingress resource to loadbalance the HTTPS traffic.","B":"Use the Horizontal Pod Autoscaler and enable cluster autoscaling on the Kubernetes cluster. Use a Service resource of type LoadBalancer to load-balance the HTTPS traffic.","C":"Enable autoscaling on the Compute Engine instance group. Use an Ingress resource to load balance the HTTPS traffic.","D":"Enable autoscaling on the Compute Engine instance group. Use a Service resource of type LoadBalancer to load-balance the HTTPS traffic."},"answer":["B"],"explanation":"Explanation: ht tps://cloud.google.com/kubernetes-engine/do cs/tutorials/http-balancer https://cloud.google.com/kubernetes-engine/docs/concepts/network-overview#ext -lb"},{"id":310,"topic":"Altostrat Media Case Study","question":"Your company is using BigQuery as its enterprise data warehouse. Data is distributed over several Google Cloud projects. All queries on BigQuery need to be billed on a single project. You want to make sure that no query costs are incurred on the projects that contain the data. Users should be able to query the datasets, but not edit them. How should you configure users' access roles?","options":{"A":"Add all users to a group. Grant the group the role of BigQuery user on the billing project and BigQuery dataViewer on the projects that contain the data.","B":"Add all users to a group. Grant the group the roles of BigQuery dataViewer on the billing project and BigQuery user on the projects that contain the data.","C":"Add all users to a group. Grant the group the roles of BigQuery jobUser on the billing project and BigQuery dataViewer on the projects that contain the data.","D":"Add all users to a group. Grant the group the roles of BigQuery dataViewer on the billing project and BigQuery jobUser on the projects that contain the data."},"answer":["A"],"explanation":"Reference: https://cloud.google.com/bigquery/docs/run ning-queries "},{"id":311,"topic":"Altostrat Media Case Study","question":"You are implementing a single Cloud SQL MySQL second-generation database that contains business-critical transaction data. You want to ensure that the minimum amount of data is lost in case of catastrophic failure. Which two features should you implement? (Choose two.)","options":{"A":"Sharding","B":"Read replicas","C":"Binary logging","D":"Automated backups","E":"Semisynchronous replication"},"answer":["C","D"],"explanation":"Explanation: Backups help you restore lost data to your Cloud SQL instance. Additionally, if an instance is having a problem, you can restore it to a previous state by using the backup to overwrite it. Enable automated backups for any instance that contains necessary data. Backups protect your data from loss or damage. Enabling automated backups, along with binary logging, is also required for some operations, such as clone and replica creation. Reference: https://cloud.google.com/sql/docs/mysql/backup-recovery/backups"},{"id":312,"topic":"Altostrat Media Case Study","question":"You have been asked to select the storage system for the click-data of your company ' s large portfolio of websites. This data is streamed in from a custom website analytics package at a typical rate of 6,000 clicks per minute, with bursts of up to 8,500 clicks per second. It must been stored for future analysis by your data science and user experience teams. Which storage infrastructure should you choose?","options":{"A":"Google Cloud SQL","B":"Google Cloud Bigtable","C":"Google Cloud Storage","D":"Google cloud Datastore"},"answer":["C"],"explanation":"Explanation: https://cloud.google.com/bigquery/docs/loading-data-cloud-storage"},{"id":313,"topic":"Altostrat Media Case Study","question":"Your company has a networking team and a development team. The development team runs applications on Compute Engine instances that contain sensitive data. The development team requires administrative permissions for Compute Engine. Your company requires all network resources to be managed by the networking team. The development team does not want the networking team to have access to the sensitive data on the instances. What should you do?","options":{"A":"1. Create a project with a standalone VPC and assign the Network Admin role to the networking team. 2. Create a second project with a standalone VPC and assign the Compute Admin role to the development team. 3. Use Cloud VPN to join the two VPCs.","B":"1. Create a project with a standalone Virtual Private Cloud (VPC), assign the Network Admin role to the networking team, and assign the Compute Admin role to the development team.","C":"1. Create a project with a Shared VPC and assign the Network Admin role to the networking team. 2. Create a second project without a VPC, configure it as a Shared VPC service project, and assign the Compute Admin role to the development team.","D":"1. Create a project with a standalone VPC and assign the Network Admin role to the networking team. 2. Create a second project with a standalone VPC and assign the Compute Admin role to the development team. 3. Use VPC Peering to join the two VPCs."},"answer":["C"],"explanation":"Explanation: In this scenario, a large organization has a central team that manages security and networking controls for the entire organization. Developers do not have permissions to make changes to any network or security settings defined by the security and networking team but they are granted permission to create resources such as virtual machines in shared subnets. To facilitate this the organization makes use of a shared VPC (Virtual Private Cloud). A shared VPC allows creation of a VPC network of RFC 1918 IP spaces that associated projects (service projects) can then use. Developers using the associated projects can create VM instances in the shared VPC network spaces. The organization ' s network and security admins can create subnets, VPNs, and firewall rules usable by all the projects in the VPC network. https://cloud.google.com/iam/docs/job- functions/networking#single_team_manages_security_network_for_organization Reference: https://cloud.google.com/vpc/docs/shared-vpc"},{"id":314,"topic":"Altostrat Media Case Study","question":"Your company wants to try out the cloud with low risk. They want to archive approximately 100 TB of their log data to the cloud and test the analytics features available to them there, while also retaining that data as a long-term disaster recovery backup. Which two steps should they take? Choose 2 answers","options":{"A":"Load logs into Google BigQuery.","B":"Load logs into Google Cloud SQL.","C":"Import logs into Google Stackdriver.","D":"Insert logs into Google Cloud Bigtable.","E":"Upload log files into Google Cloud Storage."},"answer":["A","E"],"explanation":""},{"id":315,"topic":"Altostrat Media Case Study","question":"You have an App Engine application that needs to be updated. You want to test the update with production traffic before replacing the current application version. What should you do?","options":{"A":"Deploy the update using the Instance Group Updater to create a partial rollout, which allows for canary testing.","B":"Deploy the update as a new version in the App Engine application, and split traffic between the new and current versions.","C":"Deploy the update in a new VPC, and use Google's global HTTP load balancing to split traffic between the update and current applications.","D":"Deploy the update as a new App Engine application, and use Google's global HTTP load balancing to split traffic between the new and current applications."},"answer":["B"],"explanation":"Explanation: https://cloud.google.com/appengine/docs/standard/python/splitting-traffic"},{"id":316,"topic":"Altostrat Media Case Study","question":"You have an application that uses Vertex AI Feature Store to manage and serve product features for real-time recommendations. You want to monitor the performance and health of the application. You need to understand the overall duration of a request. What should you do?","options":{"A":"Measure the Latency of your requests.","B":"Track the Online serving throughput of your requests.","C":"Observe the Request size in your featurestore.","D":"Monitor the Queries per second for your featurestore."},"answer":["A"],"explanation":"Explanation: According to the Google Cloud SRE (Site Reliability Engineering) handbook and Vertex AI Monitoring documentation , Latency is the fundamental metric used to measure the time it takes to service a request. In the context of \" real-time recommendations \" for Cymbal Retail, understanding the overall duration -from the moment the app requests a feature to the moment it receives the response-is critical for maintaining the user experience. In Vertex AI Feature Store, latency is typically measured at various percentiles (e.g., p50, p95, and p99) to account for outliers. High latency in the online serving path directly impacts the speed of the recommendation engine. While Online serving throughput (Option B) and Queries per second (QPS) (Option D) are important metrics, they measure capacity and volume (how many requests the system can handle simultaneously) rather than the duration of an individual request. Request size (Option C) measures the payload volume, which can influence latency but does not define the time duration itself. To address the specific requirement of measuring \" overall duration, \" monitoring request latency within Cloud Monitoring is the standard architectural practice."},{"id":317,"topic":"Altostrat Media Case Study","question":"Your designing the access control strategy for a new system that will store highly sensitive financial reports in a series of Cloud Storage buckets. The design must allow members of Google Groups to access only the reports they are authorized to see. All access must be directly tied to an employee ' s corporate identity for clear audit trails and the access model must be simple to operate and scalable. What should you do?","options":{"A":"Generate and distribute time-limited signed URLs to grant users temporary, per-object access.","B":"Grant the IAM role roles/storage.objectAdmin to all authorized Google Groups to simplify permission management.","C":"Enable uniform bucket-level access on the buckets, and grant predefined Storage IAM roles to the Google Groups.","D":"Maintain fine-grained access control, and use default object ACLs to grant the required permissions to the Google Groups."},"answer":["C"],"explanation":"Explanation: According to Google Cloud Storage Security documentation, Uniform Bucket-level Access is the industry- standard recommendation for securing sensitive enterprise data. When uniform access is enabled, it disables Access Control Lists (ACLs) entirely, forcing all permissions to be managed via Cloud IAM . Using IAM roles (such as roles/storage.objectViewer) granted to Google Groups provides several advantages: * Auditability: Every access request is logged with the user ' s corporate identity in Cloud Audit Logs , meeting the compliance requirement. * Simplicity & Scalability: Permissions are managed in one place (the bucket level) rather than on individual files. As employees join or leave the company, their access is automatically updated by modifying their membership in the Google Group. * Security: It prevents \" permissions creep \" and accidental exposure that often occurs with fine- grained ACLs (Option D). Option A (Signed URLs) is over-engineered for internal employee access and harder to audit. Option B is a violation of the Principle of Least Privilege , as objectAdmin allows users to delete and overwrite files, which is inappropriate for financial report viewing."},{"id":318,"topic":"Altostrat Media Case Study","question":"You are responsible for the architecture of a critical ecommerce application. The application ' s web frontends run on Compute Engine instances deployed across multiple zones within a single region. The architecture must be highly available and self-healing. If a zone becomes unavailable, the system must automatically recreate the lost capacity in the available zones. To maximize efficiency, you need to ensure that all provisioned compute resources actively serve traffic during normal operations, and user traffic is au tomatically and seamlessly directed away from any failed instance or zone. What should you do?","options":{"A":"Create a single regional unmanaged instance group spanning all three zones. Place a regional external Application Load Balancer in front of the group, and configure its backend service with a health check.","B":"Configure a regional external Application Load Balancer with a primary regional managed instance group (MIG) as its backend service, and configure a second regional MIG as a failover backend.","C":"Create a single regional managed instance group (MIG) configured to span all three zones. Place a regional external Application Load Balancer in front of the MIG. And configure its backend service with a health check.","D":"Create three separate zonal managed instance groups (MIGs), and use Cloud DNS with weighted routing to distribute traffic across the public IP address of an instance in each MIG."},"answer":["C"],"explanation":"Explanation: The Google Cloud Architecture Framework: Reliability section states that Regional Managed Instance Groups (MIGs) are the optimal choice for high availability within a region. A Regional MIG automatically distributes instances across multiple zones. If a zone fails, the MIG's auto- healing feature detects the loss and automatically recreates the instances in the remaining healthy zones, satisfying the self-healing requirement. By placing a Regional External Application Load Balancer in front of the MIG and using health checks , the system ensures that traffic is only sent to healthy instances. This is an Active-Active configuration, meaning all instances are serving traffic during normal operations, maximizing efficiency. Option B is an Active-Passive (failover) setup which is less efficient, and Option A (unmanaged groups) lacks the auto-scaling and auto-healing capabilities required for modern ecommerce applications."},{"id":319,"topic":"Altostrat Media Case Study","question":"Your company places a high value on being responsive and meeting customer needs quickly. 161 Their primary business objectives are release speed and agility. You want to reduce the chance of security errors being accidentally introduced. Which two actions can you take? Choose 2 answers","options":{"A":"Ensure every code check-in is peer reviewed by a security SME.","B":"Use source code security analyzers as part of the CI/CD pipeline.","C":"Ensure you have stubs to unit test all interfaces between components.","D":"Enable code signing and a trusted binary repository integrated with your CI/CD pipeline.","E":"Run a vulnerability security scanner as part of your continuous-integration /continuous-delivery (CI /CD) pipeline."},"answer":["B","E"],"explanation":"Explanation: https://do cs.microsoft.com/en-us/vsts/arti cles/security-valid ation-cicd-pipeline?view=vsts"},{"id":320,"topic":"Altostrat Media Case Study","question":"Your company wants you to build a highly reliable web application with a few public APIs as the backend. You don't expect a lot of user traffic, but traffic could spike occasionally. You want to leverage Cloud Load Balancing, and the solution must be cost-effective for users. What should you do?","options":{"A":"Store static content such as HTML and images in Cloud CDN. Host the APIs on App Engine and store the user data in Cloud SQL.","B":"Store static content such as HTML and images in a Cloud Storage bucket. Host the APIs on a zonal Google Kubernetes Engine cluster with worker nodes in multiple zones, and save the user data in Cloud Spanner.","C":"Store static content such as HTML and images in Cloud CDN. Use Cloud Run to host the APIs and save the user data in Cloud SQL.","D":"Store static content such as HTML and images in a Cloud Storage bucket. Use Cloud Functions to host the APIs and save the user data in Firestore."},"answer":["D"],"explanation":"Explanation: https://cloud.google.com/load-balancing/docs/https/setting-up-https-serverless#gcloud:-cloud- functions https://cloud.google.com/blog/products/networking/better-load-balancing-for-app-engine-cloud- run-and-functions"},{"id":321,"topic":"Altostrat Media Case Study","question":"A large enterprise is building a file processing pipeline on Google Cloud. The pipeline ingests the raw files, which are then accessed by a fleet of hundreds of Compute Engine virtual machines (VMs) in a single region for parallel processing. These VMs need concurrent, low-latency read and write access to a shared file system. You need to implement a storage solution that delivers the highest possible throughput to minimize the overall processing time. What should you do?","options":{"A":"Create a Filestore Zonal instance in each zone where the VMs are running. Mount the Filestore file share on each Compute Engine VM.","B":"Use a multi-region Cloud Storage bucket to store the files.","C":"Create a Regional Persistent Disk and attach it to all VMs in multi-writer mode.","D":"Create a Filestore Enterprise instance in the same region as the VMs. Mount the Filestore file share on each Compute Engine VM."},"answer":["D"],"explanation":"Explanation: According to Google Cloud Filestore documentation , for large-scale high-performance computing (HPC) and file processing pipelines that require high throughput and low latency, Filestore Enterprise is the superior choice. Filestore Enterprise is designed for critical workloads that require high availability and massive parallel access from hundreds of clients. Filestore Enterprise supports up to 12 GB/s of throughput and thousands of IOPS , which is significantly higher than the Zonal tier (Option A). Furthermore, the Enterprise tier is regional, meaning it synchronously replicates data across three zones within a region, providing higher availability without the administrative overhead of managing separate zonal instances. Option B (Cloud Storage) is object-based and does not provide the standard POSIX file system semantics or the low-latency random write performance required for \" processing \" by a fleet of VMs. Option C (Regional Persistent Disk) has a strict limit of only 2 nodes in multi- writer mode and is intended for specific clustered database workloads, making it unsuitable for a fleet of \" hundreds of VMs. \" Therefore, Filestore Enterprise is the most scalable and performant solution for this pipeline."},{"id":322,"topic":"Altostrat Media Case Study","question":"You have an application that runs in Google Kubernetes Engine (GKE). Over the last 2 weeks, customers have reported that a specific part of the application returns errors very frequently. You currently have no logging or monitoring solution enabled on your GKE cluster. You want to diagnose the problem, but you have not been able to replicate the issue. You want to cause minimal disruption to the application. What should you do?","options":{"A":"1. Update your GKE cluster to use Cloud Operations for GKE. 2. Use the GKE Monitoring dashboard to investigate logs from affected Pods.","B":"1. Create a new GKE cluster with Cloud Operations for GKE enabled. 2. Migrate the affected Pods to the new cluster, and redirect traffic for those Pods to the new cluster. 3. Use the GKE Monitoring dashboard to investigate logs from affected Pods.","C":"1. Update your GKE cluster to use Cloud Operations for GKE, and deploy Prometheus. 2. Set an alert to trigger whenever the application returns an error.","D":"1. Create a new GKE cluster with Cloud Operations for GKE enabled, and deploy Prometheus. 2. Migrate the affected Pods to the new cluster, and redirect traffic for those Pods to the new cluster. 3. Set an alert to trigger whenever the application returns an error."},"answer":["A"],"explanation":"Reference: https://cloud.google.com/blog/products/management-tools/using-logging-your-apps- running- kubernetes-engine"},{"id":323,"topic":"Altostrat Media Case Study","question":"You are helping the QA team to roll out a new load-testing tool to test the scalability of your primary cloud services that run on Google Compute Engine with Cloud Bigtable. Which three requirements should they include? Choose 3 answers","options":{"A":"Ensure that the load tests validate the performance of Cloud Bigtable.","B":"Create a separate Google Cloud project to use for the load-testing environment.","C":"Schedule the load-testing tool to regularly run against the production environment.","D":"Ensure all third-party systems your services use are capable of handling high load.","E":"Instrument the production services to record every transaction for replay by the load-testing tool.","F":"Instrument the load-testing tool and the target services with detailed logging and metrics collection."},"answer":["A","B","F"],"explanation":""},{"id":324,"topic":"Altostrat Media Case Study","question":"You have developed an application using Cloud ML Engine that recognizes famous paintings from uploaded images. You want to test the application and allow specific people to upload images for the next 24 hours. Not all users have a Google Account. How should you have users upload images?","options":{"A":"Have users upload the images to Cloud Storage. Protect the bucket with a password that expires after 24 hours.","B":"Have users upload the images to Cloud Storage using a signed URL that expires after 24 hours.","C":"Create an App Engine web application where users can upload images. Configure App Engine to disable the application after 24 hours. Authenticate users via Cloud Identity.","D":"Create an App Engine web application where users can upload images for the next 24 hours.Authenticate users via Cloud Identity."},"answer":["A"],"explanation":"Explanation: https://cloud.google.com/blog/products/storage-data-transfer/uploading-images-directly-to-cloud- storage-by-using-sign ed-url"},{"id":325,"topic":"Altostrat Media Case Study","question":"Refer to the Altostrat Media case study for the following solution. Altostrat is concerned about sophisticated, multi-vector Distributed Denial of Service (DDoS) attacks targeting various layers of their infrastructure. DDoS attacks could potentially disrupt video streaming and cause financial losses. You need to mitigate this risk. What should you do?","options":{"A":"Set up VPC Service Controls to restrict access to sensitive resources and prevent data exfiltration.","B":"Configure Cloud Next Generation Firewall (NGFW) with custom rules to filter malicious traffic at the network level.","C":"Deploy Google Cloud Armor with pre-configured and custom rules for L3/L4 and L7 protection.","D":"Activate Security Command Center to monitor security posture and detect potential threats."},"answer":["C"],"explanation":"Explanation: According to the Google Cloud Architecture Framework and Google Cloud Armor documentation , Google Cloud Armor is the enterprise-grade solution for protecting applications and services against Distributed Denial of Service (DDoS) attacks and web-based exploits. Altostrat requires a solution that addresses \" multi-vector \" attacks at \" various layers, \" specifically the Network/Transport layers ( L3/L4 ) and the Application layer ( L7 ). Google Cloud Armor provides built-in, always-on protection against L3 and L4 volumetric attacks at the edge of Google's network, preventing malicious traffic from reaching the backend GKE clusters or Cloud Run functions. For L7 (Application Layer) protection, Cloud Armor offers Web Application Firewall (WAF) capabilities, including pre-configured rule sets (based on OWASP Top 10 ), rate limiting, and Adaptive Protection . The latter uses machine learning to detect anomalies in traffic patterns specific to Altostrat's applications, automatically suggesting rules to block sophisticated botnets or application-layer floods. While Cloud NGFW (Option B) provides essential network filtering, it lacks the native L7 inspection and global DDoS scrubbing capabilities inherent to Cloud Armor. VPC Service Controls (Option A) focus on data exfiltration and API security perimeters, and Security Command Center (Option D) is a posture management and threat detection tool rather than an active traffic mitigation service. Deploying Cloud Armor at the global load balancing tier ensures Altostrat maintains the high availability and reliability required for its global media streaming audience."},{"id":326,"topic":"Altostrat Media Case Study","question":"You have developed a non-critical update to your application that is running in a managed instance group, and have created a new instance template with the update that you want to release. To prevent any possible impact to the application, you don ' t want to update any running instances. You want any new instances that are created by the managed instance group to contain the new update. What should you do?","options":{"A":"Start a new rolling restart operation.","B":"Start a new rolling replace operation.","C":"Start a new rolling update. Select the Proactive update mode.","D":"Start a new rolling update. Select the Opportunistic update mode."},"answer":["D"],"explanation":"Explanation: In certain scenarios, an opportunistic update is useful because you don ' t want to cause instability to the system if it can be avoided. For example, if you have a non-critical update that can be applied as necessary without any urgency and you have a MIG that is actively being autoscaled, perform an opportunistic update so that Compute Engine does not actively tear down your existing instances to apply the update. When resizing down, the autoscaler preferentially terminates instances with the old template as well as instances that are not yet in a RUNNING state."},{"id":327,"topic":"Altostrat Media Case Study","question":"You are deploying an application on App Engine that needs to integrate with an on-premises database. For security purposes, your on-premises database must not be accessible through the public Internet. What should you do?","options":{"A":"Deploy your application on App Engine standard environment and use App Engine firewall rules to limit access to the open on-premises database.","B":"Deploy your application on App Engine standard environment and use Cloud VPN to limit access to the onpremises database.","C":"Deploy your application on App Engine flexible environment and use App Engine firewall rules to limit access to the on-premises database.","D":"Deploy your application on App Engine flexible environment and use Cloud VPN to limit access to the on-premises database."},"answer":["D"],"explanation":"Explanation: https://cloud.google.com/a ppengine/ docs/flexible/python/using-third-party-databases"},{"id":328,"topic":"Altostrat Media Case Study","question":"You need to deploy a stateful workload on Google Cloud. The workload can scale horizontally, but each instance needs to read and write to the same POSIX filesystem. At high load, the stateful workload needs to support up to 100 MB/s of writes. What should you do?","options":{"A":"Use a persistent disk for each instance.","B":"Use a regional persistent disk for each instance.","C":"Create a Cloud Filestore instance and mount it in each instance.","D":"Create a Cloud Storage bucket and mount it in each instance using gcsfuse."},"answer":["C"],"explanation":" Explanation: https://cloud.google.com/storage/docs/gcs-fuse#notes Cloud Filestore: Cloud Filestore is a scalable and highly available shared file service fully managed by Google. Cloud Filestore provides persistent storage ideal for shared workloads. It is best suited for enterprise applications requiring persistent, durable, shared storage which is accessed by NFS or requires a POSIX compliant file system. Reference: https://cloud.google.com/storage/docs/gcs-fuse"},{"id":329,"topic":"Altostrat Media Case Study","question":"You are designing the architecture for a stateless, public-facing, containerized web application. The marketing department uses this web application to run unpredictable flash sales that cause sudden, massive spikes in user traffic. The application is a critical revenue driver and must always be available and responsive to users. Your design must automatically handle high traffic fluctuations and allow for new application versions to be deployed with zero downtime and a safe, fast rollback capability. What should you do?","options":{"A":"Deploy the application to a regional Managed Instance Group (MIG). Configure a CPU-based autoscaling policy and use the MIG ' s rolling update feature for deployments.","B":"Deploy the application as a Cloud Run service. Configure request-based auto-scaling and use gradual rollouts by splitting traffic between revisions.","C":"Deploy the application to a single, large Compute Engine instance and use a startup script to pull and run the latest container image on boot.","D":"Deploy the application to a Google Kubernetes Engine (GKE) cluster. Use the Recreate deployment strategy to roll out new application versions."},"answer":["B"],"explanation":"Explanation: For stateless, containerized applications facing \" sudden, massive spikes, \" Cloud Run is the preferred serverless solution. According to Cloud Run documentation , it offers superior scaling speed compared to VMs or GKE, as it can scale from zero to thousands of instances in seconds based on request-based metrics (concurrency) rather than just CPU utilization. Cloud Run natively supports Revisions , allowing for zero-downtime deployments . You can perform \" Blue- Green \" or \" Canary \" deployments by splitting traffic between a new revision and an old one. If a new version fails, the rollback is nearly instantaneous (switching traffic back to the previous revision). Option A (MIGs) scales significantly slower than Cloud Run. Option D (GKE Recreate) involves downtime during deployments, and Option C is a single point of failure that cannot handle traffic spikes."},{"id":330,"topic":"Altostrat Media Case Study","question":"You are designing the storage configuration for a critical Cloud Storage bucket. This bucket will store trade confirmation documents for a financial services company. These documents are immutable and serve as a legal record. Your design must meet two primary data protection requirements: * The system must allow for the rapid recovery of any document that is accidentally deleted or maliciously overwritten. * Once a document is written, it must be impossible for anyone, including administrators, to delete or modify it for seven years. What should you do?","options":{"A":"Enable Object Versioning on the bucket. Additionally, configure the bucket with a Bucket Lock and a retention policy of seven years.","B":"Grant only the roles/storage.objectCreator IAM role to the application ' s service account. Remove all other admin permissions from the bucket.","C":"Use Storage Transfer Service to create a daily replication job that synchronizes the bucket to a separate archive bucket in another region.","D":"Configure an Object Lifecycle Management rule on the bucket to ensure all objects are retained for at least seven years before they can be deleted."},"answer":["A"],"explanation":"Explanation: To satisfy strict regulatory compliance (such as SEC Rule 17a-4), you must implement WORM (Write Once, Read Many) storage. According to Cloud Storage documentation , this is achieved through a Retention Policy and Bucket Lock . Once a Bucket Lock is applied, the retention policy cannot be shortened or removed-even by a Project Owner or Administrator-ensuring the 7-year legal requirement is met. To address the \" rapid recovery \" requirement for accidental deletions or overwrites, Object Versioning is essential. When versioning is enabled, deleting or overwriting an object creates a \" noncurrent \" version instead of permanently removing the data. This allows for immediate restoration. Option D (Lifecycle Management) is incorrect because it can only delete or change classes of objects after a time period; it does not prevent a user with sufficient permissions from deleting the object manually before that time. Option B (IAM) is insufficient because it does not protect against malicious administrators. Only the combination of Object Versioning and a locked Retention Policy provides the non-repudiable protection required for financial trade documents."},{"id":331,"topic":"Altostrat Media Case Study","question":"Your company is developing a new application that will allow globally distributed users to upload pictures and share them with other selected users. The application will support millions of concurrent users. You want to allow developers to focus on just building code without having to create and maintain the underlying infrastructure. Which service should you use to deploy the application?","options":{"A":"App Engine","B":"Cloud Endpoints","C":"Compute Engine","D":"Google Kubernetes Engine"},"answer":["D"],"explanation":"Reference: https://cloud.google.com/terms/services https://cloud.google.com/appengine/docs/standard/go/how-requests-are-handled"},{"id":332,"topic":"Altostrat Media Case Study","question":"One of your primary business objectives is being able to trust the data stored in your application. You want to log all changes to the application data. How can you design your logging system to verify authenticity of your logs?","options":{"A":"Write the log concurrently in the cloud and on premises.","B":"Use a SQL database and limit who can modify the log table.","C":"Digitally sign each timestamp and log entry and store the signature.","D":"Create a JSON dump of each log entry and store it in Google Cloud Storage."},"answer":["C"],"explanation":" Explanation: https://cloud.google.com/storage/docs/access-logs References: https://cloud.google.com/logging/docs/reference/tools/gcloud-logging"},{"id":333,"topic":"Altostrat Media Case Study","question":"You are migrating third-party applications from optimized on-premises virtual machines to Google Cloud. You are unsure about the optimal CPU and memory requirements. The applications have a con sistent usage pattern across multiple weeks. You want to optimize resource usage for the lowest cost . What should you do?","options":{"A":"1. Create multiple Compute Engine instances with varying CPU and memory options. 2. Install the Ops Agent, and deploy the third-party application on each of them. 3. Run a load test with high traffic levels on the application, and use the results to determine the optimal settings.","B":"1. Create an instance template with the smallest available machine type, and use an image of the third- party application taken from a current on-premises virtual machine. 2. Create a managed instance group that uses average CPU utilization to autoscale the number of instances in the group. 3. Modify the average CPU utilization threshold to optimize the number of instances running.","C":"1. Create an App Engine flexible environment, and deploy the third-party application using a Dockerfile and a custom runtime. 2. Set CPU and memory options similar to your application ' s current on-premises virtual machine in the app.yaml file.","D":"1. Create a Compute Engine instance with CPU and memory options similar to your application's current on-premises virtual machine. 2. Install the Ops agent, and deploy the third-party application. 3. Run a load test with normal traffic levels on the application, and follow the Rightsizing Recommendations in the Google Cloud console."},"answer":["D"],"explanation":"Explanation: Comprehensive and Detailed Explanation From Exact Extract: The goal is to optimize resource usage for the lowest cost when the optimal CPU and memory are unknown, and the application has a consistent usage pattern . The best Google Cloud-native approach for this is to leverage Rightsizing Recommendations . This feature analyzes the historical performance data of your VMs to suggest a machine type that is more closely aligned with actual usage. * Step 1 provides a reasonable starting point. * Step 2 ( Install the Ops agent ) is crucial as it collects detailed system-level metrics (CPU, memory, disk, network) required for generating accurate rightsizing recommendations. * Step 3 ( Run a load test with normal traffic levels and follow the Rightsizing Recommendations ) ensures that the observed usage is based on real-world (or simulated normal-world) load and uses the automated Google Cloud tool to find the most cost-effective machine type. Running a load test is necessary to generate sufficient, representative telemetry data. * Option A ' s step 3 uses high traffic, which would lead to an oversized instance recommendation. * Option B and C don ' t leverage the Rightsizing Recommendations feature, which is the most efficient and automated way to find optimal resource usage based on actual data. Exact Extract Principle: From the Google Cloud documentation on Rightsizing Recommendations : \" Google Cloud provides Rightsizing Recommendations for Compute Engine instances based on resource usage metrics collected by the Ops Agent or legacy monitoring agent. These recommendations help you optimize your resources for cost and performance. To generate accurate and effective rightsizing recommendations , the instance must be running a representative workload and have the Ops Agent installed to collect CPU and memory utilization data. \" \" Rightsizing recommendations are a key feature for cost optimization in Compute Engine, suggesting smaller or larger machine types that match your actual utilization. \" Reference: Google Cloud Compute Engine Rightsizing Recommendations Documentation."},{"id":334,"topic":"Altostrat Media Case Study","question":"Your company is planning to migrate their Windows Server 2022 from their on-premises data center to Google Cloud. You need to bring the licenses that are currently in use in on-premises virtual machines into the target cloud environment. What should you do?","options":{"A":"1. Create an image of the on-premises virtual machines and upload into Cloud Storage. 2. Import the image as a virtual disk on Compute Engine.","B":"1. Create standard instances on Compute Engine. 2. Select as the OS the same Microsoft Windows version that is currently in use in the on-premises environment.","C":"1. Create an image of the on-premises virtual machine. 2. Import the image as a virtual disk on Compute Engine. 3. Create a standard instance on Compute Engine, selecting as the OS the same Microsoft Windows version that is currently in use in the on-premises environment. 4. Attach a data disk that includes data that matches the created image.","D":"1. Create an image of the on-premises virtual machines. 2. Import the image as a virtual disk on Compute Engine using --os=windows-2022-dc-v. 3. Create a sole-tenancy instance on Compute Engine that uses the imported disk as a boot disk."},"answer":["D"],"explanation":"Explanation: https://cloud.google.com/compute/docs/import/importing-virtual-disks"},{"id":335,"topic":"Altostrat Media Case Study","question":"Your company has a Google Workspace account and Google Cloud Organization Some developers in the company have created Google Cloud projects outside of the Google Cloud Organization You want to create an Organization structure that allows developers to create projects, but prevents them from modifying production projects You want to manage policies for all projects centrally and be able to set more restrictive policies for production projects You want to minimize disruption to users and developers when business needs change in the future You want to follow Google-recommended practices How should you design the Organization structure?","options":{"A":"1 Create a second Google Workspace account and Organization 2 Grant all developers the Project Creator IAM role on the new Organization 3 Move the developer projects into the new Organization 4 Set the policies for all projects on both Organizations. 5 Additionally set the production policies on the original Organization","B":"1 Create a folder under the Organization resource named \" Production ' 2 Grant all developers the Project Creator IAM role on the Organization 3. Move the developer projects into the Organization 4 Set the policies for all projects on the Organization 5 Additionally set the production policies on the ' Production \" folder","C":"1 Create folders under the Organization resource named \" Development \" and Production ' 2 Grant all developers the Project Creator IAM role on the \" \" Development1 folder 3. Move the developer projects into the \" Development \" folder 4 Set the policies for all projects on the Organization 5 Additionally set the production policies on the \" Production \" folder","D":"1 Designate the Organization for production projects only 2 Ensure that developers do not have the Project Creator IAM role on the Organization 3 Create development projects outside of the Organization using the developer Google Workspace accounts 4 Set the policies for all projects on the Organization 5 Additionally set the production policies on the individual production projects"},"answer":["C"],"explanation":"Explanation: This option can help create an organization structure that allows developers to create projects, but prevents them from modifying production projects. Folders are containers for projects and other folders within Google Cloud organizations. Folders allow resources to be structured hierarchically and inherit policies from their parent resources. By creating folders under the organization resource named \"Development\" and \"Production\", you can organize your projects by environment and apply different policies to them. By granting all developers the Project Creator IAM role on the \"Development\" folder, you can allow them to create projects under that folder, but not under the \"Production\" folder. By moving the developer projects into the \"Development\" folder, you can ensure that they are subject to the policies set on that folder. By setting the policies for all projects on the organization, you can manage policies centrally and efficiently. By additionally setting the production policies on the \"Production\" folder, you can enforce more restrictive policies for production projects and prevent developers from modifying them. The other options are not optimal for this scenario, because they either create a second Google Workspace account and organization, which increases complexity and cost (A), or do not use folders to organize projects by environment, which makes it harder to manage policies and permissions (B, D). References: * https://cloud.google.com/resource-manager/docs/creating-managing-folders * https://cloud.google.com/architecture/framework/system-design"},{"id":336,"topic":"Altostrat Media Case Study","question":"You have found an error in your App Engine application caused by missing Cloud Datastore indexes. You have created a YAML file with the required indexes and want to deploy these new indexes to Cloud Datastore. What should you do?","options":{"A":"Point gcloud datastore create-indexes to your configuration file","B":"Upload the configuration file the App Engine's default Cloud Storage bucket, and have App Engine detect the new indexes","C":"In the GCP Console, use Datastore Admin to delete the current indexes and upload the new configuration file","D":"Create an HTTP request to the built-in python module to send the index configuration file to your application"},"answer":["A"],"explanation":""},{"id":337,"topic":"Altostrat Media Case Study","question":"Your application needs to process credit card transactions. You want the smallest scope of Payment Card Industry (PCI) compliance without compromising the ability to analyze transactional data and trends relating to which payment methods are used. How should you design your architecture?","options":{"A":"Create a tokenizer service and store only tokenized data.","B":"Create separate projects that only process credit card data.","C":"Create separate subnetworks and isolate the components that process credit card data.","D":"Streamline the audit discovery phase by labeling all of the virtual machines (VMs) that process PCI data.","E":"Enable Logging export to Google BigQuery and use ACLs and views to scope the data shared with the auditor."},"answer":["A"],"explanation":"Explanation: https://cloud.google.com/solutions/pci-dss-compliance-in-gcp"},{"id":338,"topic":"Altostrat Media Case Study","question":"You are the cloud architect for a team developing a new application that integrates with the Gemini API. You observe a sudden, massive spike in API costs and usage. An investigation reveals that a developer accidentally committed a service account key with Gemini API access to a public GitHub repository, and a malicious actor is using it. The on-call SRE immediately disabled the key, stopping the unauthorized usage. Your responsibility is to lead the post-incident review to prevent future credential leaks. What should you do?","options":{"A":"Initiate a formal disciplinary review for the developer who committed the key. Mandate that all future pull requests must be manually approved by a security team member before being merged.","B":"Immediately migrate all applications to use Workload Identity Federation to access Google Cloud APIs from GitHub Actions, eliminating all service account keys from your CI/CD process.","C":"Write a report detailing the financial impact of the unauthorized use of the service account key. Work with the finance department to track the costs and create a policy to bill the responsible team for any future cost overruns caused by credential leaks.","D":"Schedule a blameless postmortem with the engineering team to map the incident timeline.Collaboratively identify gaps in the development workflow, and assign action items to implement automated pre-commit hooks and a CI/CD pipeline stage for secret scanning."},"answer":["D"],"explanation":"Explanation: Site Reliability Engineering (SRE) and DevOps best practices state that post-incident reviews must be blameless. Punitive actions create an environment of fear, which can lead to teams hiding mistakes and delaying incident resolution. A constructive postmortem focuses on uncovering systemic systemic failures within tools, workflows, and guardrails rather than assigning individual blame. The primary goal of this review is to identity security gaps and implement automated preventative guardrails. This involves adding secret detection tools (e.g., GitGuardian or TruffleHog) directly into development workflows using pre-commit hooks, as well as adding static analysis security testing (SAST) scanning stages into remote CI/CD deployment pipelines. This architecture catches exposed service keys or credentials before code changes are merged into public repositories, mitigating risk through automated technical controls. References: Cloud Architect (GCP) Study Guide topics: \" Google SRE Culture and Blameless Postmortems \" , \" Secret Management Best Practices \" , \" Securing CI/CD Pipelines \" , and \" Credential Leak Mitigation \" ."},{"id":339,"topic":"Altostrat Media Case Study","question":"Your web application has several VM instances running within a VPC. You want to restrict communications between instances to only the paths and ports you authorize, but you don't want to rely on static IP addresses or subnets because the app can autoscale. How should you restrict communications?","options":{"A":"Use separate VPCs to restrict traffic","B":"Use firewall rules based on network tags attached to the compute instances","C":"Use Cloud DNS and only allow connections from authorized hostnames","D":"Use service accounts and configure the web application particular service accounts to have access"},"answer":["B"],"explanation":""},{"id":340,"topic":"Altostrat Media Case Study","question":"Your organization wants to control IAM policies for different departments independently, but centrally. Which approach should you take?","options":{"A":"Multiple Organizations with multiple Folders","B":"Multiple Organizations, one for each department","C":"A single Organization with Folder for each department","D":"A single Organization with multiple projects, each with a central owner"},"answer":["C"],"explanation":"Explanation: Folders are nodes in the Cloud Platform Resource Hierarchy. A folder can contain projects, other folders, or a combination of both. You can use folders to group projects under an organization in a hierarchy. For example, your organization might contain multiple departments, each with its own set of GCP resources. Folders allow you to group these resources on a per-department basis. Folders are used to group resources that share common IAM policies. While a folder can contain multiple folders or resources, a given folder or resource can have exactly one parent. References: https://cloud.google.com/resource-manager/docs/creating-managing-folders"},{"id":341,"topic":"Altostrat Media Case Study","question":"Your organization is going to migrate applications to Kubernetes and use managed cloud services to deploy applications. Your team is new to Kubernetes and wants to quickly onboard engineers. You want to reduce operational overhead, so the engineering team can focus on developing consumer requirements instead of maintaining the infrastructure. What should you do?","options":{"A":"Package your application into a Docker image, and deploy it to Kubernetes on Compute Engine.","B":"Leverage Cloud Build to create a container image, and deploy it automatically to Kubernetes on Compute Engine.","C":"Assess application and dependencies for containerization. Develop a migration strategy for deployment to GKE in Standard mode.","D":"Assess application and dependencies for containerization. Develop a migration strategy for deployment to GKE in Autopilot mode."},"answer":["D"],"explanation":"Explanation: According to GKE documentation , GKE Autopilot is the recommended mode for teams that want a \" hands-off \" Kubernetes experience with the lowest possible operational overhead. In Autopilot mode, Google Cloud manages the entire underlying infrastructure, including the control plane, node provisioning, security hardening, and scaling. For a team that is \" new to Kubernetes, \" GKE Standard (Option C) would require them to manually manage node pools, choose machine types, and handle OS upgrades-tasks that distract from \" developing consumer requirements. \" Options A and B involve managing Kubernetes manually on Compute Engine, which represents the highest possible operational burden. GKE Autopilot automatically applies best practices for security and resource management. It implements a per-pod billing model, meaning you only pay for the resources (CPU, memory, storage) requested by your pods, rather than paying for unused node capacity. This aligns with the business goal of maximizing developer focus on features while Google handles the complexities of cluster management, ensuring a faster onboarding process for the engineering team."},{"id":342,"topic":"Altostrat Media Case Study","question":"Your company has an enterprise application running on Compute Engine that requires high availability and high performance. The application has been deployed on two instances in two zones in the same region m active passive mode. The application writes data to a persistent disk in the case of a single zone outage that data should be immediately made available to the other instance in the other zone. You want to maximize performance while minimizing downtime and data loss. What should you do?","options":{"A":"1. Attach a persistent SSD disk to the first instance 2. Create a snapshot every hour 3. In case of a zone outage, recreate a persistent SSD disk in the second instance where data is coming from the created snapshot","B":"1 Create a Cloud Storage bucket 2. Mount the bucket into the first instance with gcs-fuse 3. In case of a zone outage, mount the Cloud Storage bucket to the second instance with gcs-fuse","C":"1 Attach a local SSD lo the first instance disk 2. Execute an rsync command every hour where the target is a persistent SSD disk attached to the second instance 3. In case of a zone outage, use the second instance","D":"1. Attach a regional SSD persistent Ask to the first instance 2. In case of a zone outage, force-attach the disk to the other instance"},"answer":["D"],"explanation":""},{"id":343,"topic":"Altostrat Media Case Study","question":"An application development team has come to you for advice.They are planning to write and deploy an HTTP (S) API using Go 1.12. The API will have a very unpredictable workload and must remain reliable during peaks in traffic. They want to minimize operational overhead for this application. What approach should you recommend?","options":{"A":"Use a Managed Instance Group when deploying to Compute Engine","B":"Develop an application with containers, and deploy to Google Kubernetes Engine (GKE)","C":"Develop the application for App Engine standard environment","D":"Develop the application for App Engine Flexible environment using a custom runtime"},"answer":["C"],"explanation":"Explanation: https://cloud.google.com/appengine/docs/the-appengine-environments"},{"id":344,"topic":"Altostrat Media Case Study","question":"Your company runs several databases on a single MySQL instance. They need to take backups of a specific database at regular intervals. The backup activity needs to complete as quickly as possible and cannot be allowed to impact disk performance. How should you configure the storage?","options":{"A":"Configure a cron job to use the gcloud tool to take regular backups using persistent disk snapshots.","B":"Mount a Local SSD volume as the backup location. After the backup is complete, use gsutil to move the backup to Google Cloud Storage.","C":"Use gcsfuse to mount a Google Cloud Storage bucket as a volume directly on the instance and write backups to the mounted location using mysqldump","D":"Mount additional persistent disk volumes onto each virtual machine (VM) instance in a RAID10 array and use LVM to create snapshots to send to Cloud Storage."},"answer":["B"],"explanation":"Explanation: https://cloud.google.com/compute/docs/instances/sql-server/best-practices"},{"id":345,"topic":"Altostrat Media Case Study","question":"Your organization uses Google Kubernetes Engine (GKE) and Amazon Elastic Kubernetes Service (EKS) to manage a complex Kubernetes environment across multiple cloud providers. You need to deploy a solution that streamlines configuration management, enforces security policies, and ensures consistent application deployment across all of the environments. You want to follow Google-recommended practices. What should you do?","options":{"A":"Leverage Argo CD for GitOps-based continuous delivery and Open Policy Agent (OPA) for policy enforcement, and develop a controller for multi-cluster configuration management.","B":"Deploy Customize for configuration customization. Config Sync with multiple Git repositories, and a script to enforce security policies.","C":"Utilize Config Sync as part of GKE to synchronize configurations from a centralized repository, and utilize Policy Controller to enforce policies using OPA Gatekeeper.","D":"Deploy Crossplane for managing cloud resources as Kubernetes objects. FluxCD for GitOps-based configuration synchronization, and Kyverno for policy enforcement."},"answer":["C"],"explanation":"Explanation: According to Google Cloud ' s Anthos (now GKE Enterprise) documentation, Config Sync and Policy Controller are the official tools for multi-cluster and multi-cloud management. These tools allow for a GitOps approach to infrastructure and configuration. * Config Sync: Automatically synchronizes Kubernetes configurations (like YAML files for Namespaces, Roles, or Deployments) from a central Git repository to all registered clusters, whether they are in GKE or EKS. This ensures consistency across providers. * Policy Controller: Built on the open-source Gatekeeper project (using Open Policy Agent ), it enforces security policies and compliance at scale. For exam ple, it can prevent a developer from deploying a container that runs as root or requires excessive resources across both AWS and Google Cloud environments. While Option A uses similar open-source technologies, Option C is the \" Google-recommended \" integrated solution that is fully managed and supported. This centralized management reduces the complexity of maintaining custom controllers (as mentioned in A) or scripts (as mentioned in B), providing a robust, enterprise-grade framework for hybrid and multi-cloud governance."},{"id":346,"topic":"Altostrat Media Case Study","question":"You need to develop procedures to verify resilience of disaster recovery for remote recovery using GCP. Your production environment is hosted on-premises. You need to establish a secure, redundant connection between your on premises network and the GCP network. What should you do?","options":{"A":"Verify that Dedicated Interconnect can replicate files to GCP. Verify that direct peering can establish a secure connection between your networks if Dedicated Interconnect fails.","B":"Verify that Dedicated Interconnect can replicate files to GCP. Verify that Cloud VPN can establish a secure connection between your networks if Dedicated Interconnect fails.","C":"Verify that the Transfer Appliance can replicate files to GCP. Verify that direct peering can establish a secure connection between your networks if the Transfer Appliance fails.","D":"Verify that the Transfer Appliance can replicate files to GCP. Verify that Cloud VPN can establish a secure connection between your networks if the Transfer Appliance fails."},"answer":["B"],"explanation":"Explanation: https: //cloud.google.com/interconnect/docs/how-to/direct-peering"},{"id":347,"topic":"Altostrat Media Case Study","question":"You want to establish a Compute Engine application in a single VPC across two regions. The application must communicate over VPN to an on-premises network. How should you deploy the VPN?","options":{"A":"Use VPC Network Peering between the VPC and the on-premises network.","B":"Expose the VPC to the on-premises network using IAM and VPC Sharing.","C":"Create a global Cloud VPN Gateway with VPN tunnels from each region to the on-premises peer gateway.","D":"Deploy Cloud VPN Gateway in each region. Ensure that each region has at least one VPN tunnel to the on-premises peer gateway."},"answer":["C"],"explanation":"Explanation: https://cloud.google.com/vpn/docs /how-to/creating-static-vpns"},{"id":348,"topic":"Altostrat Media Case Study","question":"Your customer is receiving reports that their recently updated Google App Engine application is taking approximately 30 seconds to load for some of their users. This behavior was not reported before the update. What strategy should you take?","options":{"A":"Work with your ISP to diagnose the problem.","B":"Open a support ticket to ask for network capture and flow data to diagnose the problem, then roll back your application.","C":"Roll back to an earlier known good release initially, then use Stackdriver Trace and logging to diagnose the problem in a development/test/staging environment.","D":"Roll back to an earlier known good release, then push the release again at a quieter period to investigate. Then use Stackdriver Trace and logging to diagnose the problem."},"answer":["C"],"explanation":"Explanation: Stackdriver Logging allows you to store, search, analyze, monitor, and alert on log data and events from Google Cloud Platform and Amazon Web Services (AWS). Our API also allows ingestion of any custom log data from any source. Stackdriver Logging is a fully managed service that performs at scale and can ingest application and system log data from thousands of VMs. Even better, you can analyze all that log data in real time. References: https://cloud.google.com/logging/ "}];
const KEY = "gcp_pca_v1965_progress_v1";
let state = JSON.parse(localStorage.getItem(KEY) || '{"current":1,"answers":{},"review":{}}');

function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function q(){return QUESTIONS.find(x=>x.id===state.current)||QUESTIONS[0];}
function answerKey(q){return q.answer.slice().sort().join("");}
function selected(q){return (state.answers[q.id]?.selected||[]).slice().sort();}
function isSolved(q){return !!state.answers[q.id];}
function isCorrect(q){return isSolved(q) && answerKey(q)===selected(q).join("");}

function render(){
  const x=q(), a=state.answers[x.id];
  document.getElementById("total").textContent=QUESTIONS.length;
  document.getElementById("question").innerHTML=`
    <div class="meta">
      <span class="badge">Q${x.id} · ${esc(x.topic||"GCP Professional Cloud Architect")}</span>
      <button class="btn review" onclick="toggleMark(${x.id})">${state.review[x.id]?"★ 다시 풀기 해제":"☆ 다시 풀기"}</button>
    </div>
    <h2>${esc(x.question)}</h2>
    <div class="small">${x.answer.length>1?"복수 정답 · 모두 선택하세요":"단일 정답 · 하나를 선택하세요"}</div>
    <div id="options">${Object.entries(x.options).map(([k,v])=>`
      <label class="option ${a&&a.selected?.includes(k)?"selected":""} ${a&&a.submitted&&x.answer.includes(k)?"correct":""} ${a&&a.submitted&&!x.answer.includes(k)&&a.selected?.includes(k)?"incorrect":""}">
        <input type="${x.answer.length>1?"checkbox":"radio"}" name="opt" value="${k}" ${a&&a.selected?.includes(k)?"checked":""} ${a?.submitted?"disabled":""} onchange="selectOption('${k}')">
        <span class="letter">${k}.</span><span>${esc(v)}</span>
      </label>`).join("")}</div>
    ${a?.submitted ? `<div class="result ${isCorrect(x)?"good":"bad"}">${isCorrect(x)?"✓ 정답입니다!":"✗ 오답입니다."} 정답: <b>${x.answer.join(", ")}</b></div>
      <div class="explain"><b>해설</b><br>${esc(x.explanation||"이 문제에는 PDF에서 별도 해설이 제공되지 않습니다.")}</div>` : ""}
    <div class="nav">
      <button class="btn" onclick="prev()">← 이전</button>
      ${a?.submitted?`<button class="btn primary" onclick="next()">다음 →</button>`:`<button class="btn primary" onclick="submitAnswer()">정답 확인</button>`}
      ${a?.submitted?`<button class="btn" onclick="nextUnsolved()">다음 미풀이 →</button>`:""}
    </div>`;
  renderList(); updateStats();
}
function selectOption(k){
  const x=q();
  let s=state.answers[x.id]?.selected||[];
  if(x.answer.length===1) s=[k];
  else s=s.includes(k)?s.filter(v=>v!==k):[...s,k];
  state.answers[x.id]={selected:s,submitted:false};
  save(); render();
}
function submitAnswer(){
  const x=q(), a=state.answers[x.id];
  if(!a?.selected?.length){alert("답을 하나 이상 선택해주세요.");return;}
  a.submitted=true; save(); render();
}
function next(){let i=QUESTIONS.findIndex(x=>x.id===state.current);state.current=QUESTIONS[(i+1)%QUESTIONS.length].id;save();render();}
function prev(){let i=QUESTIONS.findIndex(x=>x.id===state.current);state.current=QUESTIONS[(i-1+QUESTIONS.length)%QUESTIONS.length].id;save();render();}
function go(id){state.current=id;save();render();window.scrollTo({top:0,behavior:"smooth"});}
function nextUnsolved(){let i=QUESTIONS.findIndex(x=>x.id===state.current);for(let n=1;n<=QUESTIONS.length;n++){let x=QUESTIONS[(i+n)%QUESTIONS.length];if(!isSolved(x)){go(x.id);return}}alert("미풀이 문제가 없습니다.");}
function nextWrong(){let i=QUESTIONS.findIndex(x=>x.id===state.current);for(let n=1;n<=QUESTIONS.length;n++){let x=QUESTIONS[(i+n)%QUESTIONS.length];if(isSolved(x)&&!isCorrect(x)){go(x.id);return}}alert("오답 문제가 없습니다.");}
function nextReview(){let i=QUESTIONS.findIndex(x=>x.id===state.current);for(let n=1;n<=QUESTIONS.length;n++){let x=QUESTIONS[(i+n)%QUESTIONS.length];if(state.review[x.id]){go(x.id);return}}alert("다시 풀기 표시된 문제가 없습니다.");}
function randomUnsolved(){const a=QUESTIONS.filter(x=>!isSolved(x));if(!a.length){alert("미풀이 문제가 없습니다.");return}go(a[Math.floor(Math.random()*a.length)].id);}
function toggleMark(id){state.review[id]=!state.review[id];if(!state.review[id])delete state.review[id];save();render();}
function toggleReview(){const a=QUESTIONS.filter(x=>state.review[x.id]);if(!a.length){alert("다시 풀기 표시된 문제가 없습니다.");return}go(a[0].id);}
function renderList(){
  const term=(document.getElementById("search")?.value||"").toLowerCase();
  const arr=QUESTIONS.filter(x=>String(x.id).includes(term)||x.question.toLowerCase().includes(term)||String(x.topic).toLowerCase().includes(term));
  document.getElementById("list").innerHTML=arr.map(x=>{
    let c=isCorrect(x)?"done":(isSolved(x)?"wrong":"");
    return `<button class="qnum ${c} ${state.review[x.id]?"review":""} ${x.id===state.current?"current":""}" onclick="go(${x.id})">${x.id}</button>`;
  }).join("")||'<div class="empty">검색 결과 없음</div>';
}
function updateStats(){
  const solved=QUESTIONS.filter(isSolved).length, correct=QUESTIONS.filter(isCorrect).length, wrong=solved-correct, marked=QUESTIONS.filter(x=>state.review[x.id]).length;
  document.getElementById("solved").textContent=solved;
  document.getElementById("correct").textContent=correct;
  document.getElementById("wrong").textContent=wrong;
  document.getElementById("marked").textContent=marked;
  document.getElementById("bar").style.width=(solved/QUESTIONS.length*100)+"%";
}
function exportProgress(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="gcp_pca_progress.json";a.click();URL.revokeObjectURL(a.href);
}
function importProgress(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!s.answers||!s.review)throw 0;state=s;save();render();alert("진도를 가져왔습니다.");}catch(_){alert("올바른 진도 파일이 아닙니다.");}};r.readAsText(f);
}
function resetProgress(){if(confirm("모든 풀이 기록과 다시 풀기 표시를 삭제할까요?")){state={current:1,answers:{},review:{}};save();render();}}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
render();
</script>
